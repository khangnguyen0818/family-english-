    tb.innerHTML=`<div class="bar"><button class="btn primary" data-act="playall">${IC.play}Nghe cả đoạn hội thoại</button><button class="btn" data-act="gramall">${GRAMOPEN?"Thu gọn phân tích ngữ pháp":"Mở tất cả phân tích ngữ pháp"}</button></div><div class="lines">${t.L.map((ln,i)=>lineHTML(t,ln,i)).join("")}</div>`;
  } else if(tab==="vocab"){
    tb.innerHTML=`<div class="tbl"><table class="vocab"><tbody>${t.vocab.map((v,j)=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td><button class="btn" data-act="vsay" data-j="${j}" aria-label="Nghe ${esc(v[0])}">${IC.say}</button> <button class="btn mic" data-act="vrec" data-j="${j}" aria-label="Nói thử ${esc(v[0])}">${IC.mic}<span class="mlbl">Nói</span></button><div class="result" id="vr${j}" hidden style="margin-top:8px;text-align:left;white-space:normal"></div></td></tr>`).join("")}</tbody></table></div>
    <h2 style="font-size:1.3rem;margin-top:8px">Mẫu câu trong bài</h2><div class="tbl"><table class="vocab"><tbody>${t.L.map((ln,i)=>`<tr><td style="font-size:1rem">${esc(ln[3])}</td><td>${esc(ln[1])}</td><td><button class="btn" data-act="say" data-i="${i}" aria-label="Nghe">${IC.say}</button></td></tr>`).join("")}</tbody></table></div>`;
  } else renderRP();
}
function defAssign(t){const a={};const kid=t.sp.includes("K");let p1=false;
  t.sp.forEach(s=>{if(kid&&s==="K")a[s]="2";else if(!p1){a[s]="1";p1=true}else if(!kid&&!Object.values(a).includes("2"))a[s]="2";else a[s]="m"});return a}
/* who plays line ln: null = machine, "1"/"2" = player (duo), "me" (solo) */
function playerOf(ln){if(!rp)return null;if(rp.mode==="duo"){const p=rp.assign[ln[0]];return p==="1"||p==="2"?p:null}return ln[0]===rp.role?"me":null}
function pname(p){return esc(rp.names[+p-1]||("Người "+p))}
function renderRP(){
  const t=cur,tb=$("#tb");
  if(!rp)rp={role:t.sp.includes("K")?"K":t.sp[t.sp.length-1],hide:store.get("cn_hide",false),i:-1,mode:store.get("cn_rpmode","solo"),names:store.get("cn_names",["Bố mẹ","Con"]),assign:defAssign(t)};
  const cnt=s=>t.L.filter(l=>l[0]===s).length;
  const modes=`<div class="modes"><button class="role ${rp.mode==="solo"?"sel":""}" data-act="rpmode" data-m="solo">1 người với máy<small>Máy đọc các vai còn lại</small></button><button class="role ${rp.mode==="duo"?"sel":""}" data-act="rpmode" data-m="duo">2 người cùng chơi<small>Hai người thay phiên nói</small></button></div>`;
  const solo=`<p>Bạn đóng vai nào? Máy sẽ đọc các vai còn lại.</p>
  <div class="roles">${t.sp.map(s=>`<button class="role c-${SPK[s].c} ${rp.role===s?"sel":""}" data-act="rprole" data-s="${s}">${SPK[s].en} · ${SPK[s].vi}<small>${cnt(s)} câu</small></button>`).join("")}</div>`;
  const opt=(s,v,l)=>`<option value="${v}" ${rp.assign[s]===v?"selected":""}>${l}</option>`;
  const duo=`<p>Hai người dùng chung một máy, thay phiên nhau nói. Mỗi câu đều được chấm điểm riêng.</p>
  <div class="names"><label>Người 1<input id="nm1" maxlength="16" value="${esc(rp.names[0])}"></label><label>Người 2<input id="nm2" maxlength="16" value="${esc(rp.names[1])}"></label></div>
  <div class="assign">${t.sp.map(s=>`<div class="row c-${SPK[s].c}"><span><b>${SPK[s].en} · ${SPK[s].vi}</b><small>${cnt(s)} câu</small></span><select data-s="${s}" aria-label="Ai đóng vai ${SPK[s].vi}">${opt(s,"1",esc(rp.names[0])+" (Người 1)")}${opt(s,"2",esc(rp.names[1])+" (Người 2)")}${opt(s,"m","Máy đọc")}</select></div>`).join("")}</div>`;
  tb.innerHTML=`<div class="rp-setup" id="rpsetup">${modes}${rp.mode==="duo"?duo:solo}
  <label class="chk" for="rphide"><input type="checkbox" id="rphide" ${rp.hide?"checked":""}> Thử thách: ẩn câu tiếng Anh của ${rp.mode==="duo"?"người chơi":"tôi"}, chỉ hiện nghĩa tiếng Việt để tự nhớ</label>
  <div class="err" id="rperr" hidden></div>
  <div><button class="btn primary" data-act="rpstart">${IC.play}Bắt đầu nhập vai</button></div></div><div class="chat" id="chat"></div>`;
}
function readDuo(){
  if(rp.mode!=="duo")return true;
  rp.names=[($("#nm1").value.trim()||"Người 1"),($("#nm2").value.trim()||"Người 2")];store.set("cn_names",rp.names);
  document.querySelectorAll(".assign select").forEach(sel=>rp.assign[sel.dataset.s]=sel.value);
  const v=Object.values(rp.assign);
  if(!v.includes("1")&&!v.includes("2")){const e=$("#rperr");e.hidden=false;e.textContent="Hãy chọn ít nhất một vai cho người chơi.";return false}
  return true;
}
function bubble(ln,i,p){
  const s=SPK[ln[0]],mine=!!p,duo=p&&p!=="me";
  const tag=duo?`<span class="pl pl${p}">${pname(p)}</span>`:mine?" (bạn)":"";
  return `<div class="bub ${mine?"me":"them"} ${duo?"p"+p:""} c-${s.c}" id="rp${i}"><div class="bh">${s.en} · ${s.vi}${tag}</div>
  ${duo?`<div class="turn">Đến lượt ${pname(p)} nói</div>`:""}
  ${mine&&rp.hide?`<p class="en mask" id="rpen${i}">• • • • •</p>`:`<p class="en">${esc(ln[1])}</p>`}<p class="vi">${esc(ln[2])}</p>
  <div class="acts">${mine?`<button class="btn mic" data-act="rprec">${IC.mic}<span class="mlbl">Bấm để nói</span></button><button class="btn" data-act="rpmodel">${IC.say}Nghe mẫu</button>${rp.hide?`<button class="btn ghost" data-act="rphint">Gợi ý</button>`:""}<button class="btn ghost" data-act="rpnext">Bỏ qua</button>`:""}</div>
  <div class="result" id="rpr${i}" hidden></div></div>`;
}
function scrollToEl(el){if(!el)return;const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;el.scrollIntoView({behavior:rm?"auto":"smooth",block:"nearest"})}
async function rpNext(){
  const t=cur,tok=rpTok,chat=$("#chat");if(!chat||!rp)return;
  const prevB=$("#rp"+rp.i);if(prevB)prevB.classList.add("done");
  rp.i++;
  if(rp.i>=t.L.length){
    const avgOf=arr=>{const sc=arr.filter(x=>x!=null);return sc.length?{avg:Math.round(sc.reduce((a,b)=>a+b,0)/sc.length),n:sc.length}:null};
    let body;
    if(rp.mode==="duo"){
      const per=["1","2"].filter(p=>Object.values(rp.assign).includes(p)).map(p=>({p,r:avgOf(t.L.map((l,i)=>playerOf(l)===p?rp.scores[i]:null))}));
      const done=per.filter(x=>x.r);
      let msg="Hai người chưa nói câu nào. Thử lại và bấm mic ở lượt của mình nhé.";
      if(done.length===2){const[a,b2]=done;msg=Math.abs(a.r.avg-b2.r.avg)<=5?"Cả hai đều giỏi ngang nhau!":`${pname((a.r.avg>b2.r.avg?a:b2).p)} dẫn trước lượt này. Đổi vai rồi chơi lại nhé!`}
      else if(done.length)msg="Giỏi lắm! Đổi vai để cùng luyện các câu còn lại nhé.";
      body=`<div class="who2">${per.map(x=>`<div><span class="pl pl${x.p}">${pname(x.p)}</span><b>${x.r?x.r.avg+"/100":"–"}</b><small>${x.r?x.r.n+" câu đã nói":"chưa nói"}</small></div>`).join("")}</div><p>${msg}</p>`;
    } else {const r=avgOf(rp.scores);body=`<p>${r?`Điểm trung bình các câu của bạn: <b>${r.avg}/100</b> (${r.n} câu đã nói)`:"Bạn chưa nói câu nào. Thử lại và bấm mic ở lượt của mình nhé."}</p>`}
    chat.insertAdjacentHTML("beforeend",`<div class="sum"><h3>Hoàn thành!</h3>${body}<div class="acts" style="justify-content:center"><button class="btn primary" data-act="rpstart">Chơi lại</button><button class="btn" data-act="rpswap">Đổi vai</button></div></div>`);
    scrollToEl(chat.lastElementChild);return}
  const ln=t.L[rp.i],p=playerOf(ln);
  chat.insertAdjacentHTML("beforeend",bubble(ln,rp.i,p));const b=chat.lastElementChild;scrollToEl(b);
  if(p)return;
  const r=await playLines([{text:ln[1],spk:ln[0],id:"rp"+rp.i}]);
  if(tok!==rpTok||!rp)return;
  if(r==="done")setTimeout(()=>{if(tok===rpTok)rpNext()},450);
  else b.querySelector(".acts").innerHTML=`<button class="btn primary" data-act="rpnext">Tiếp tục →</button><button class="btn" data-act="rpagain">${IC.say}Nghe lại</button>`;
}
function rpStart(){stopAll();rpTok++;rp.i=-1;rp.scores=[];$("#chat").innerHTML="";rpNext()}

/* mic button states */
function micUI(btn,text,resEl,key,onScore){
  const lbl=btn.querySelector(".mlbl"),orig=lbl?lbl.textContent:"";
  return{
    onState:s=>{const on=s==="starting"||s==="listening"||s==="finishing";btn.classList.toggle("on",on);if(lbl)lbl.textContent=s==="starting"?"Đang mở mic…":s==="listening"?"Đang nghe… bấm để dừng":s==="finishing"?"Đang xử lý…":orig},
    onLive:x=>{resEl.hidden=false;resEl.innerHTML=`<div class="live">Đang nghe: <i>${esc(x)||"…"}</i></div>`},
    onInfo:x=>{resEl.hidden=false;resEl.innerHTML=`<div class="live">${esc(x)}</div>`},
    onDone:(h,url)=>{resEl.hidden=false;if(h){const r=score(text,h);resEl.innerHTML=resultHTML(r,url);if(key)saveBest(key,r.score);onScore&&onScore(r.score)}else{resEl.innerHTML=resultHTML(null,url);onScore&&onScore(null)}},
    onError:m=>{resEl.hidden=false;resEl.innerHTML=`<div class="err">${esc(m)}</div>`}
  }
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,t=cur;
  if(a==="stop"){stopAll();return}
  if(a==="say"||a==="slow"){const i=+b.dataset.i,ln=t.L[i];const card=$("#l"+i);
    document.querySelectorAll(".line.playing").forEach(x=>x.classList.remove("playing"));if(card)card.classList.add("playing");
    playLines([{text:ln[1],spk:ln[0],id:"l"+i}],null,a==="slow"?0.7:RATE).then(()=>{if(card)card.classList.remove("playing")});return}
  if(a==="rec"){const i=+b.dataset.i,ln=t.L[i];record(ln[1],micUI(b,ln[1],$("#r"+i),t.id+":"+i,()=>{const bb=best[t.id+":"+i];$("#b"+i).innerHTML=`Điểm cao nhất: <b>${bb}</b>`}));return}
  if(a==="gram"){const g=$("#g"+b.dataset.i);g.hidden=!g.hidden;b.setAttribute("aria-expanded",!g.hidden);return}
  if(a==="gramall"){GRAMOPEN=!GRAMOPEN;store.set("cn_gram",GRAMOPEN);renderTab();return}
  if(a==="playall"){const items=t.L.map((ln,i)=>({text:ln[1],spk:ln[0],id:"l"+i}));
    playLines(items,id=>{document.querySelectorAll(".line.playing").forEach(x=>x.classList.remove("playing"));if(id){const c=$("#"+id);if(c){c.classList.add("playing");scrollToEl(c)}}});return}
  if(a==="tab"){if(tab===b.dataset.tab)return;stopAll();if(curRec)curRec.stop();rpTok++;rp=null;tab=b.dataset.tab;renderTab();return}
  if(a==="vsay"){const v=t.vocab[+b.dataset.j];playLines([{text:v[0].replace(/\.\.\./g,""),spk:"M",id:"v"}]);return}
  if(a==="vrec"){const j=+b.dataset.j,v=t.vocab[j][0].replace(/\.\.\./g,"");record(v,micUI(b,v,$("#vr"+j),null));return}
  if(a==="rprole"){rp.role=b.dataset.s;rp.i=-1;rpTok++;stopAll();renderRP();return}
  if(a==="rpmode"){if($("#nm1"))readDuo();rp.mode=b.dataset.m;store.set("cn_rpmode",rp.mode);rp.i=-1;rpTok++;stopAll();renderRP();return}
  if(a==="rpstart"){const h=$("#rphide");if(h){if(!readDuo())return;rp.hide=h.checked;store.set("cn_hide",rp.hide)}rpStart();return}
  if(a==="rpswap"){if(rp.mode==="duo"){for(const s in rp.assign)rp.assign[s]=rp.assign[s]==="1"?"2":rp.assign[s]==="2"?"1":"m"}else{const sp=t.sp;rp.role=sp[(sp.indexOf(rp.role)+1)%sp.length]}rp.i=-1;rpTok++;renderRP();scrollToEl($("#rpsetup"));return}
  if(a==="rpnext"){stopAll();if(curRec)curRec.stop();rpNext();return}
  if(a==="rpagain"){const ln=t.L[rp.i];playLines([{text:ln[1],spk:ln[0],id:"x"}]);return}
  if(a==="rpmodel"){const ln=t.L[rp.i];playLines([{text:ln[1],spk:ln[0],id:"x"}],null,RATE);return}
  if(a==="rphint"){const el=$("#rpen"+rp.i);if(el){el.classList.remove("mask");el.textContent=t.L[rp.i][1]}b.remove();return}
  if(a==="rprec"){const i=rp.i,ln=t.L[i],tok=rpTok;
    record(ln[1],micUI(b,ln[1],$("#rpr"+i),t.id+":"+i,sc=>{if(sc!=null)rp.scores[i]=Math.max(rp.scores[i]||0,sc);
      const acts=$("#rp"+i+" .acts");
      if(sc!=null&&sc>=75){setTimeout(()=>{if(tok===rpTok&&rp&&rp.i===i)rpNext()},1600)}
      else if(acts&&!acts.querySelector('[data-act="rpnext"].primary')){acts.insertAdjacentHTML("beforeend",`<button class="btn primary" data-act="rpnext">Tiếp tục →</button>`)}
    }));return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="rate"){RATE=+e.target.value;store.set("cn_rate",RATE);if(tts&&tts.setRate)tts.setRate(RATE).catch(()=>{})}
  if(e.target.id==="showvi"){SHOWVI=e.target.checked;store.set("cn_vi",SHOWVI);$("#tb").classList.toggle("hide-vi",!SHOWVI)}
});
function route(){
  stopAll();if(curRec)curRec.stop();
  const h=decodeURIComponent(location.hash.slice(1));
  const t=T.find(x=>x.id===h);
  if(t){renderTopic(t);return}
  if(cur||!app.firstChild)renderHome();
  if(h.startsWith("g-")){const el=document.getElementById(h);if(el)el.scrollIntoView()}else if(!h)window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();initCaps(0);
</script>

</body></html>
