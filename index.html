<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C7A79"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Cả Nhà Nói Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: a day of family life, morning to night — topic cards grouped by time of day; each topic opens a dialogue page with per-line grammar, listen, and speak-to-score. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#E8EEF5; --ink:#17223A; --muted:#58657E; --line:#D5DDE9;
  --accent:#0C7A79; --accent-ink:#FFFFFF; --accent-soft:#D7F0EE; --sun:#F4B43A; --sun-soft:#FFF1CC;
  --good:#1D8E4E; --warn:#B87700; --bad:#CC3B3B;
  --mom:#C93B70; --dad:#2C64CC; --kid:#178A5C; --grand:#A35A1B; --other:#7350C0;
  --shadow:0 1px 2px rgba(23,34,58,.06),0 4px 14px rgba(23,34,58,.06);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162032; --surface2:#1E2A40; --ink:#E6ECF6; --muted:#9BA8C0; --line:#2A3853;
  --accent:#3DC0BD; --accent-ink:#04201F; --accent-soft:#143836; --sun:#F6C35C; --sun-soft:#3A3220;
  --good:#4CCB85; --warn:#F0B53D; --bad:#F27575;
  --mom:#F27DA7; --dad:#79A3F6; --kid:#52CC97; --grand:#E59A5C; --other:#AD90EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162032; --surface2:#1E2A40; --ink:#E6ECF6; --muted:#9BA8C0; --line:#2A3853;
  --accent:#3DC0BD; --accent-ink:#04201F; --accent-soft:#143836; --sun:#F6C35C; --sun-soft:#3A3220;
  --good:#4CCB85; --warn:#F0B53D; --bad:#F27575;
  --mom:#F27DA7; --dad:#79A3F6; --kid:#52CC97; --grand:#E59A5C; --other:#AD90EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.en-inline{font-weight:600;color:var(--accent);background:var(--accent-soft);padding:0 .3em;border-radius:5px;white-space:nowrap}

/* home */
.hero{padding-block:36px 20px;display:grid;gap:14px}
.hero .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:800}
.hero h1 span{color:var(--accent)}
.hero p{max-width:62ch;margin:0;color:var(--muted);font-size:1.02rem}
.daybar{display:flex;gap:0;margin-block:6px 8px;overflow-x:auto;padding-block:4px}
.daybar a{flex:1 0 auto;min-width:120px;text-decoration:none;color:var(--ink);padding:10px 12px;border-top:4px solid var(--c,var(--accent));background:var(--surface);display:grid;gap:0;border-right:1px solid var(--line)}
.daybar a:first-child{border-radius:0 0 0 10px}.daybar a:last-child{border-radius:0 0 10px 0;border-right:0}
.daybar b{font-family:var(--f-display);font-size:1.02rem}
.daybar small{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--good)}.pill.no .dot{background:var(--bad)}
.grp{padding-block:22px 6px}
.grp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grp-h h2{font-size:1.6rem}
.grp-h span{color:var(--muted);font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card h3{font-size:1.25rem}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.time{font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);margin-top:6px}
.prog{height:5px;background:var(--surface2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:9px}
.howto{margin-block:30px 50px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.howto h2{font-size:1.4rem;margin-bottom:8px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:75ch}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px}
.back{text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ctrl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.t-head{padding-block:24px 10px;display:grid;gap:6px}
.t-head h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800}
.vi-title{margin:0;font-size:1.1rem;color:var(--muted);font-weight:500}
.scene{margin:6px 0 0;max-width:70ch}
.tip{background:var(--sun-soft);border-radius:12px;padding:10px 14px;max-width:75ch;font-size:.93rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:.86rem;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.mic{color:var(--accent);border-color:var(--accent)}
.btn.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){.btn.mic.on{animation:none}.card{transition:none}}

.lines{display:grid;gap:14px;margin-block:8px 30px}
.line{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;scroll-margin-top:80px}
.line.playing{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.who{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#fff;background:var(--c)}
.nm{font-weight:700;font-size:.92rem;color:var(--c);line-height:1.2}
.nm small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.c-mom{--c:var(--mom)}.c-dad{--c:var(--dad)}.c-kid{--c:var(--kid)}.c-grand{--c:var(--grand)}.c-other{--c:var(--other)}
.body{min-width:0;display:grid;gap:8px}
.en{font-family:var(--f-display);font-size:1.4rem;font-weight:700;line-height:1.3;margin:0}
.vi{margin:0;color:var(--muted)}
.hide-vi .vi{display:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.best{font-size:.78rem;color:var(--muted);margin-left:auto}
.best b{color:var(--good)}
.gram{background:var(--surface2);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.pat{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pat code{font-family:var(--f-body);font-weight:700;color:var(--ink);background:var(--surface);border:1px dashed var(--accent);padding:2px 10px;border-radius:8px;font-size:.92rem}
.gram ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.gram li{max-width:78ch}
.gram li b{color:var(--ink)}
.result{display:flex;gap:14px;align-items:flex-start;background:var(--surface2);border-radius:12px;padding:10px 14px}
.result p{margin:0}
.score{min-width:64px;text-align:center;font-family:var(--f-display);line-height:1;padding:8px 6px;border-radius:12px;background:var(--surface);font-variant-numeric:tabular-nums}
.score strong{font-size:1.8rem;display:block}
.score span{font-size:.72rem;color:var(--muted)}
.s-good strong{color:var(--good)}.s-mid strong{color:var(--warn)}.s-low strong{color:var(--bad)}
.fb{font-weight:600}
.words{font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.4}
.w-ok{color:var(--good)}.w-part{color:var(--warn)}.w-miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.heard{font-size:.85rem;color:var(--muted)}
.replay{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.replay audio{max-width:100%;height:38px}
.live,.err{font-size:.9rem}.err{color:var(--bad)}

.vocab{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.vocab td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.vocab tr:last-child td{border-bottom:0}
.vocab td:first-child{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.vocab td:last-child{white-space:nowrap;text-align:right}
.tbl{overflow-x:auto;margin-block:10px 30px}

/* roleplay */
.rp-setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:12px;margin-block:10px}
.rp-setup p{margin:0;font-weight:600}
.roles{display:flex;gap:8px;flex-wrap:wrap}
.role{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--c);text-align:left}
.role small{display:block;font-weight:500;color:var(--muted)}
.role.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.micperm{flex-basis:100%;background:var(--sun-soft);border:1px solid var(--sun);border-radius:14px;padding:12px 14px;display:grid;gap:8px;justify-items:start}
.micperm p{margin:0;font-size:.92rem}
.micperm .hint{color:var(--muted);font-size:.85rem}
.iosapp{display:grid;gap:8px;justify-items:start;margin-top:8px}
.iosapp p{margin:0;font-size:.88rem;color:var(--muted)}
.iosapp a.btn{text-decoration:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes .role{--c:var(--accent);text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.names input,.assign select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.assign{display:grid;gap:8px}
.assign .row{display:grid;grid-template-columns:1fr minmax(120px,170px);gap:10px;align-items:center;padding:8px 12px;border-radius:12px;border:1px solid var(--line)}
.assign .row b{color:var(--c)}
.assign .row small{display:block;color:var(--muted);font-weight:500}
.pl{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--surface);margin-left:6px;vertical-align:middle}
.pl1{background:var(--accent)}.pl2{background:var(--kid)}
.bub.me.p1{justify-self:start;border-bottom-left-radius:6px;border-bottom-right-radius:18px}
.turn{font-weight:700;font-size:.95rem}
.sum .who2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sum .who2 div{background:var(--surface);border-radius:12px;padding:8px 14px;min-width:120px}
.sum .who2 b{font-size:1.4rem;display:block}
.chat{display:grid;gap:12px;margin-block:16px 40px}
.bub{max-width:min(620px,92%);padding:12px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;scroll-margin-bottom:120px}
.bub.them{justify-self:start;border-bottom-left-radius:6px}
.bub.me{justify-self:end;border-bottom-right-radius:6px;border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.bh{font-size:.8rem;font-weight:700;color:var(--c)}
.bub .en{font-size:1.25rem}
.bub.done .acts{display:none}
.mask{letter-spacing:.2em;color:var(--muted)}
.sum{justify-self:center;text-align:center;background:var(--accent-soft);border-radius:16px;padding:16px 22px;display:grid;gap:8px}
.sum h3{font-size:1.4rem}

.pager{display:flex;justify-content:space-between;gap:10px;padding-block:10px 40px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:600;max-width:48%}
.pager small{display:block;color:var(--muted);font-weight:500}

.stopfab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:min(520px,calc(100% - 32px));font-size:.9rem;box-shadow:var(--shadow)}

@media (max-width:640px){
  .line{grid-template-columns:1fr;gap:10px;padding:14px}
  .who{flex-direction:row;align-items:center}
  .av{width:34px;height:34px;font-size:1rem}
  .en{font-size:1.25rem}
  .ctrl{margin-left:0}
  .best{margin-left:0;width:100%}
  .result{flex-direction:column}
}
</style>

<div id="app"></div>
<button class="btn primary stopfab" id="stopfab" data-act="stop" hidden>■ Dừng đọc</button>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============ DATA ============ */
const SPK={
 M:{en:"Mom",vi:"Mẹ",c:"mom",voice:"airy",pitch:1.15},
 D:{en:"Dad",vi:"Bố",c:"dad",voice:"rounded",pitch:.8},
 K:{en:"Kid",vi:"Con",c:"kid",voice:"glassy",pitch:1.45},
 G:{en:"Grandma",vi:"Bà",c:"grand",voice:"buttery",pitch:1.05},
 P:{en:"Grandpa",vi:"Ông",c:"grand",voice:"rounded",pitch:.7},
 T:{en:"Teacher",vi:"Cô giáo",c:"other",voice:"buttery",pitch:1.1},
 F:{en:"Friend",vi:"Bạn cùng lớp",c:"other",voice:"airy",pitch:1.5},
 W:{en:"Waiter",vi:"Phục vụ",c:"other",voice:"buttery",pitch:1},
 C:{en:"Cashier",vi:"Thu ngân",c:"other",voice:"buttery",pitch:1.1},
 O:{en:"Staff",vi:"Nhân viên",c:"other",voice:"buttery",pitch:.95},
 S:{en:"Sister",vi:"Chị gái",c:"mom",voice:"airy",pitch:1.35},
 U:{en:"Aunt Mai",vi:"Dì Mai",c:"grand",voice:"airy",pitch:1.1},
 A:{en:"Shop assistant",vi:"Nhân viên bán hàng",c:"other",voice:"airy",pitch:1.1},
 H:{en:"Hairdresser",vi:"Thợ cắt tóc",c:"other",voice:"buttery",pitch:1},
 Q:{en:"Coach",vi:"Thầy dạy bơi",c:"other",voice:"rounded",pitch:.9},
 V:{en:"Driver",vi:"Tài xế",c:"other",voice:"rounded",pitch:.85},
 L:{en:"Passer-by",vi:"Người đi đường",c:"other",voice:"buttery",pitch:1},
 N:{en:"Dentist",vi:"Nha sĩ",c:"other",voice:"buttery",pitch:1.05},
 R:{en:"Receptionist",vi:"Lễ tân",c:"other",voice:"airy",pitch:1.1},
 X:{en:"Doctor",vi:"Bác sĩ",c:"other",voice:"rounded",pitch:.9},
 Y:{en:"Delivery man",vi:"Người giao hàng",c:"other",voice:"rounded",pitch:.95},
 E:{en:"Neighbor",vi:"Bác hàng xóm",c:"grand",voice:"rounded",pitch:.85},
 I:{en:"Librarian",vi:"Cô thủ thư",c:"other",voice:"airy",pitch:1.05},
 Z:{en:"Pharmacist",vi:"Dược sĩ",c:"other",voice:"buttery",pitch:1},
 B:{en:"Seller",vi:"Cô bán hàng",c:"other",voice:"airy",pitch:1.15}
};
const GROUPS=[
 {id:"sang",en:"Morning",vi:"Buổi sáng",time:"6:30 – 7:30",c:"var(--sun)"},
 {id:"ngay",en:"Daytime",vi:"Ở trường & chiều về",time:"8:00 – 18:00",c:"var(--accent)"},
 {id:"toi",en:"Evening",vi:"Buổi tối",time:"18:30 – 21:00",c:"var(--dad)"},
 {id:"nha",en:"Home together",vi:"Ở nhà cùng nhau",time:"Ngày nghỉ",c:"var(--grand)"},
 {id:"ngoai",en:"Out & about",vi:"Ra ngoài & cuối tuần",time:"Cuối tuần",c:"var(--kid)"},
 {id:"dulich",en:"Travel",vi:"Đi du lịch",time:"Kỳ nghỉ",c:"var(--mom)"},
 {id:"khac",en:"Health & feelings",vi:"Sức khỏe & cảm xúc",time:"Bất cứ lúc nào",c:"var(--other)"}
];
/* Line: [speaker, English, Vietnamese, pattern, [notes]]  — notes: `english` and **bold** */
const T=[
{id:"wake-up",g:"sang",t:"6:30",en:"Waking Up",vi:"Thức dậy buổi sáng",sp:["M","K"],
scene:"Mẹ vào phòng gọi con dậy. Con còn buồn ngủ và kể về giấc mơ đêm qua.",
tip:"Nói câu ‘Good morning, sweetie!’ mỗi sáng thật đều đặn. Một câu lặp lại hằng ngày sẽ thành phản xạ nhanh hơn mười câu học một lần.",
vocab:[["wake up","tỉnh giấc"],["get up","ra khỏi giường"],["sleepy","buồn ngủ"],["have a dream","nằm mơ"],["make your bed","dọn giường"],["open the curtains","kéo rèm ra"]],
L:[
["M","Good morning, sweetie! It's time to wake up.","Chào buổi sáng con yêu! Đến giờ dậy rồi.","It's time to + V (nguyên mẫu)",[
"`It's` là dạng rút gọn của `It is`. Chữ `it` ở đây là chủ ngữ giả, không chỉ vật cụ thể nào, giống chữ ‘đã’ trong ‘đã đến giờ’.",
"`It's time to + động từ nguyên mẫu` = đã đến lúc làm gì. Nếu theo sau là danh từ thì dùng `It's time for + danh từ`: `It's time for school`, `It's time for bed`.",
"**Vì sao `wake up` mà không phải `get up`?** `wake up` là tỉnh giấc, mở mắt. `get up` là ra khỏi giường. Mẹ đang gọi con tỉnh nên dùng `wake up`; lát nữa con mới `get up`.",
"`sweetie`, `honey`, `sweetheart` là cách gọi con thân mật, đặt ở đầu hoặc cuối câu và ngăn bằng dấu phẩy."]],
["K","Five more minutes, please. I'm so sleepy.","Cho con năm phút nữa thôi. Con buồn ngủ quá.","Số + more + danh từ   |   I'm + tính từ",[
"`Five more minutes` là câu rút gọn của `Give me five more minutes`. Trong văn nói, người bản xứ hay bỏ động từ khi ý đã rõ.",
"Vị trí của `more`: **số đứng trước `more`** → `five more minutes`, `two more cookies`. Không nói `more five minutes`.",
"**Vì sao `I'm sleepy` mà không phải `I'm sleep`?** `sleep` là động từ (ngủ). Sau `am/is/are` cần tính từ, nên dùng `sleepy`. Phân biệt: `sleepy` = buồn ngủ, `tired` = mệt, `asleep` = đang ngủ.",
"`so` + tính từ = quá, rất (cảm xúc mạnh hơn `very`)."]],
["M","Did you sleep well last night?","Tối qua con ngủ có ngon không?","Did + S + V (nguyên mẫu)?",[
"Dùng **quá khứ đơn** vì có mốc thời gian đã qua: `last night`.",
"Câu hỏi quá khứ dùng trợ động từ `did`, và động từ chính **trở về nguyên mẫu**: `Did you sleep`, không nói `Did you slept`. Ý ‘quá khứ’ đã nằm ở `did` rồi.",
"**Vì sao `sleep well` mà không phải `sleep good`?** `well` là trạng từ, bổ nghĩa cho động từ `sleep`. `good` là tính từ, đi với danh từ: `a good sleep`.",
"`last night` không có `the` và không có giới từ đứng trước: không nói `in last night`."]],
["K","Yes, I had a funny dream about a dinosaur.","Có ạ, con mơ một giấc mơ buồn cười về con khủng long.","S + had + a + tính từ + danh từ + about + N",[
"`had` là quá khứ của `have` (bất quy tắc: have → had → had).",
"`have a dream` là cụm cố định (collocation): nằm mơ. Không nói `make a dream` hay `do a dream`.",
"Tính từ đứng **trước** danh từ: `a funny dream` (giấc mơ buồn cười), ngược trật tự với tiếng Việt.",
"`a` dùng trước danh từ đếm được số ít khi nhắc đến lần đầu: `a dinosaur`. `about` + danh từ = về cái gì."]],
["M","Wow! You can tell me all about it at breakfast.","Ồ! Lúc ăn sáng con kể hết cho mẹ nghe nhé.","can + V   |   tell + người + about + việc",[
"`can` + động từ nguyên mẫu, ở đây mang nghĩa gợi ý/cho phép. Sau `can` không thêm `to` và không thêm `-s`.",
"**Vì sao `tell` mà không phải `say`?** `tell` có người nghe đứng ngay sau: `tell me`, `tell Dad`. `say` thì không: `say something`, `say it to me`. Không nói `say me`.",
"`all about it` = tất cả về chuyện đó; `it` thay cho `the dream`.",
"Giới từ đi với bữa ăn là `at`, không có `the`: `at breakfast`, `at lunch`, `at dinner`."]],
["M","Come on, let's open the curtains.","Nào, mình kéo rèm ra nhé.","Let's + V (nguyên mẫu)",[
"`Let's` = `Let us`, dùng để rủ người khác **cùng** làm. Sau `let's` là động từ nguyên mẫu: `let's open`, `let's go`.",
"`Come on` = thôi nào, nhanh lên (giục nhẹ nhàng, có ý khích lệ).",
"`the curtains`: dùng `the` vì cả hai đều biết là rèm nào (rèm phòng này). Số nhiều vì cửa sổ thường có hai tấm rèm."]],
["K","Okay, I'm getting up now.","Vâng, con dậy đây ạ.","S + am/is/are + V-ing (hiện tại tiếp diễn)",[
"**Hiện tại tiếp diễn** ở đây chỉ hành động đang bắt đầu ngay lúc nói. Người Việt nói ‘con dậy đây’, người Anh nói `I'm getting up`.",
"Bây giờ con mới `get up` (ra khỏi giường), vì con đã `wake up` (tỉnh) từ trước. Đây chính là chỗ khác nhau giữa hai cụm động từ.",
"`get` thêm `-ing` thì gấp đôi phụ âm cuối: `getting` (quy tắc: một nguyên âm + một phụ âm ở cuối → gấp đôi)."]],
["M","Good job! Don't forget to make your bed.","Giỏi lắm! Đừng quên dọn giường nhé.","Don't + V   |   forget to + V",[
"`Don't + động từ nguyên mẫu` = câu mệnh lệnh phủ định (đừng...).",
"**Vì sao `forget to make` mà không phải `forget making`?** `forget to + V` = quên làm một việc **chưa làm**. `forget + V-ing` = quên một việc **đã làm** rồi (hay dùng với `never`: `I'll never forget meeting you`).",
"`make your bed` = dọn, xếp giường (collocation). Không hiểu từng chữ là ‘làm giường’.",
"`Good job!` là câu khen rất phổ biến với trẻ em. Có thể thay bằng `Well done!` hoặc `Great job!`."]]
]},

{id:"bathroom",g:"sang",t:"6:40",en:"Brushing Teeth",vi:"Đánh răng, rửa mặt",sp:["M","K"],
scene:"Trong phòng tắm, mẹ hướng dẫn con đánh răng, rửa mặt và chải đầu.",
tip:"Đứng cạnh con trước gương và nói từng bước bằng tiếng Anh trong khi làm. Trẻ nhớ nhanh nhất khi lời nói đi kèm hành động thật.",
vocab:[["brush your teeth","đánh răng"],["toothbrush","bàn chải đánh răng"],["toothpaste","kem đánh răng"],["sink","bồn rửa"],["wash your face","rửa mặt"],["comb your hair","chải tóc"]],
L:[
["M","Go to the bathroom and brush your teeth.","Con vào phòng tắm đánh răng đi.","V + ... and + V (hai mệnh lệnh nối bằng and)",[
"Câu mệnh lệnh bắt đầu bằng động từ nguyên mẫu, không cần chủ ngữ: `Go...`, `brush...`.",
"`teeth` là số nhiều **bất quy tắc** của `tooth` (một cái răng). Tương tự: foot → feet.",
"**Vì sao phải có `your`?** Tiếng Anh gần như luôn đặt tính từ sở hữu trước bộ phận cơ thể: `brush your teeth`, `wash your hands`. Tiếng Việt chỉ nói ‘đánh răng’ nhưng tiếng Anh cần rõ là răng của ai."]],
["K","Mom, where is my toothbrush?","Mẹ ơi, bàn chải của con đâu rồi?","Where + is + N số ít?",[
"`Where is` dùng với danh từ số ít; số nhiều thì `Where are`: `Where are my socks?`",
"Văn nói hay rút gọn: `Where's my toothbrush?`",
"`toothbrush` là danh từ ghép: `tooth` (răng) + `brush` (bàn chải). Danh từ đứng trước đóng vai trò bổ nghĩa, nên không nói `teethbrush`."]],
["M","It's in the cup, next to the sink.","Nó ở trong cốc, cạnh bồn rửa đó con.","It's + giới từ chỉ vị trí + the + N",[
"`It` thay cho `my toothbrush` để khỏi lặp lại danh từ.",
"Giới từ vị trí: `in` = bên trong, `on` = bên trên (có tiếp xúc), `next to` = bên cạnh, `under` = bên dưới.",
"Dùng `the cup`, `the sink` vì cả hai đều biết là cái cốc, cái bồn nào trong nhà mình."]],
["K","How much toothpaste should I use?","Con nên dùng bao nhiêu kem đánh răng ạ?","How much + N không đếm được + should + S + V?",[
"**Vì sao `How much` mà không phải `How many`?** `toothpaste` là danh từ **không đếm được** (không nói one toothpaste, two toothpastes) nên dùng `How much`. Với danh từ đếm được số nhiều dùng `How many`: `How many apples?`",
"`should` = nên, dùng để hỏi lời khuyên. Câu hỏi đảo `should` lên trước chủ ngữ: `Should I...?`",
"Sau `should` là động từ nguyên mẫu: `should use`, không nói `should to use`."]],
["M","Just a little, the size of a pea.","Một chút thôi, bằng hạt đậu thôi con.","a little + N không đếm được",[
"`a little` = một ít, dùng với danh từ không đếm được. Với danh từ đếm được dùng `a few`: `a few minutes`.",
"Cẩn thận: `a little` (một ít, ý tích cực) khác `little` không có `a` (rất ít, gần như không có).",
"`the size of a pea` = to bằng hạt đậu. Cấu trúc `the size of + N` dùng để so kích thước."]],
["M","Brush for two minutes, up and down.","Đánh trong hai phút, chải lên chải xuống nhé.","V + for + khoảng thời gian",[
"`for` + khoảng thời gian = trong bao lâu: `for two minutes`, `for an hour`.",
"Phân biệt với `in`: `in two minutes` = hai phút **nữa** (sau hai phút).",
"`up and down` = lên và xuống, cặp trạng từ cố định. Tương tự: `left and right`, `back and forth`."]],
["K","I'm done! Look, my teeth are clean and shiny.","Con xong rồi! Mẹ xem, răng con sạch và sáng bóng.","S + be + adj + and + adj",[
"`I'm done` = con xong rồi. `done` ở đây là tính từ, không phải động từ chia quá khứ.",
"`teeth` số nhiều nên dùng `are`, không dùng `is`.",
"Hai tính từ nối bằng `and`: `clean and shiny`. `Look,` đặt đầu câu để gọi người khác nhìn."]],
["M","Great! Now wash your face and comb your hair.","Tốt lắm! Giờ rửa mặt và chải tóc nhé.","Now + V + ... and + V",[
"`Now` đầu câu để chuyển sang bước tiếp theo.",
"**Vì sao `hair` không có `-s`?** `hair` (mái tóc) là danh từ không đếm được. `hairs` chỉ dùng khi nói từng sợi tóc: `There are two hairs in my soup.`",
"`comb` đọc là /koʊm/, chữ `b` cuối câm (giống `thumb`, `climb`)."]]
]},

{id:"get-dressed",g:"sang",t:"6:50",en:"Getting Dressed",vi:"Mặc quần áo",sp:["M","K"],
scene:"Con chọn quần áo, tìm tất và nhờ mẹ giúp cài cúc. Áo bị mặc ngược.",
tip:"Cho con tự chọn đồ bằng tiếng Anh: đưa hai chiếc áo và hỏi ‘The blue one or the red one?’.",
vocab:[["wear","mặc (trạng thái)"],["put on","mặc vào (hành động)"],["take off","cởi ra"],["socks","tất"],["jacket","áo khoác"],["backwards","ngược trước ra sau"]],
L:[
["M","What do you want to wear today?","Hôm nay con muốn mặc gì?","What + do + S + want to + V?",[
"Câu hỏi với từ để hỏi ở thì hiện tại đơn: `What` + `do/does` + chủ ngữ + động từ nguyên mẫu.",
"`want to + V` = muốn làm gì. Văn nói nhanh nghe như `wanna`, nhưng khi viết dùng `want to`.",
"**Vì sao `wear` mà không phải `put on`?** `wear` là mặc (trạng thái, mặc cả ngày). `put on` là động tác mặc vào. Ở đây hỏi chọn đồ để mặc cả ngày nên dùng `wear`."]],
["K","Can I wear my blue T-shirt?","Con mặc áo phông xanh được không ạ?","Can I + V?",[
"`Can I...?` dùng để xin phép. Lịch sự hơn: `Could I...?`, trang trọng nhất: `May I...?`",
"Trật tự: tính từ sở hữu + tính từ màu + danh từ: `my blue T-shirt`.",
"Chữ T trong `T-shirt` luôn viết hoa vì áo có hình chữ T."]],
["M","It's cold outside, so put on a jacket too.","Bên ngoài lạnh đấy, nên mặc thêm áo khoác nhé.","Nguyên nhân + so + kết quả",[
"**Vì sao dùng `so` mà không phải `because`?** `so` (nên, vì vậy) đứng trước **kết quả**. `because` (vì) đứng trước **nguyên nhân**. Viết lại: `Put on a jacket because it's cold outside.`",
"Bây giờ là động tác mặc vào nên dùng `put on`.",
"`too` ở cuối câu khẳng định = cũng, thêm nữa. Câu phủ định thì dùng `either`."]],
["K","I can't find my socks.","Con không tìm thấy tất của con.","S + can't + V",[
"`can't` = `cannot` (không thể).",
"**Vì sao `find` mà không phải `look for`?** `look for` = đang tìm (quá trình). `find` = tìm thấy (kết quả). Con đã tìm mà không thấy nên dùng `can't find`. Có thể nói: `I'm looking for my socks, but I can't find them.`",
"`socks` số nhiều vì tất đi theo đôi. Tương tự: `shoes`, `pants`, `glasses`."]],
["M","They're under your bed. I saw them this morning.","Nó ở dưới gầm giường con đấy. Sáng nay mẹ thấy mà.","They're + giới từ + N   |   S + V2 (quá khứ)",[
"**Vì sao `They` mà không phải `It`?** `socks` là số nhiều nên đại từ thay thế là `they` (chủ ngữ) và `them` (tân ngữ).",
"`saw` là quá khứ của `see` (bất quy tắc: see → saw → seen). Dùng quá khứ vì việc nhìn thấy đã xảy ra và kết thúc.",
"`this morning` đi với quá khứ đơn được, vì lúc nói buổi sáng đã qua một phần và việc thấy đã xong."]],
["K","Mom, can you help me with the buttons?","Mẹ ơi, mẹ cài cúc giúp con được không?","help + người + with + việc",[
"`Can you...?` dùng để nhờ ai làm gì (khác `Can I...?` là xin phép).",
"Cấu trúc `help + người + with + danh từ`: `help me with my homework`. Hoặc `help + người + V`: `help me do it`.",
"`buttons` số nhiều vì áo có nhiều cúc."]],
["M","Sure. Oh, your shirt is on backwards! Let's take it off and try again.","Được. Ơ, con mặc ngược áo rồi! Mình cởi ra mặc lại nhé.","be on backwards   |   take + it + off",[
"`be on backwards` = mặc ngược (trước ra sau). Phân biệt: `inside out` = mặc lộn trái, `upside down` = lộn ngược đầu xuống.",
"`take off` (cởi ra) là ngược nghĩa của `put on`.",
"**Vì sao `take it off` mà không phải `take off it`?** Với cụm động từ tách được, nếu tân ngữ là **đại từ** (it, them, me) thì bắt buộc đặt ở giữa: `take it off`, `put them on`. Danh từ thì đặt đâu cũng được: `take off your shirt` hoặc `take your shirt off`."]],
["K","Do I look nice now?","Giờ con trông đẹp chưa ạ?","look + tính từ",[
"`look` ở đây là động từ nối (linking verb), nghĩa là ‘trông có vẻ’, nên theo sau là **tính từ**.",
"**Vì sao `look nice` mà không phải `look nicely`?** Động từ nối (look, feel, smell, taste, sound, seem) mô tả chủ ngữ, nên dùng tính từ. `nicely` là trạng từ, chỉ dùng khi mô tả cách làm: `She sings nicely.`",
"Câu hỏi hiện tại đơn với `I`: `Do I...?`"]],
["M","You look great!","Con trông tuyệt lắm!","S + look + tính từ",[
"Câu trả lời dùng lại cấu trúc `look + tính từ`.",
"`great` mạnh hơn `nice`. Thang mức độ khen: `nice` < `great` < `amazing`, `wonderful`.",
"Khen trẻ thường xuyên bằng câu ngắn như thế này giúp con thích nói tiếng Anh hơn."]]
]},

{id:"breakfast",g:"sang",t:"7:00",en:"Breakfast Time",vi:"Bữa sáng",sp:["D","K","M"],
scene:"Bố chuẩn bị bữa sáng. Con muốn đổi món, cả nhà nhắc nhau cách cư xử trên bàn ăn.",
tip:"Bữa ăn là lúc tốt nhất để luyện câu xin và mời: ‘Can I have...?’, ‘Would you like...?’. Chỉ đưa món ăn khi con nói đúng câu.",
vocab:[["be ready","sẵn sàng"],["toast","bánh mì nướng"],["cereal","ngũ cốc"],["instead","thay vào đó"],["Would you like...?","Con có muốn... không?"],["pass me...","đưa cho tôi..."]],
L:[
["D","Breakfast is ready! Come and sit down.","Bữa sáng xong rồi! Lại đây ngồi nào.","N + is ready   |   Come and + V",[
"`be ready` = đã sẵn sàng, đã xong. `Breakfast` không có `the` khi nói về bữa ăn nói chung.",
"`Come and sit down` = lại đây ngồi xuống. Văn nói hay dùng `come and + V` thay cho `come to + V`.",
"`sit down` = ngồi xuống (hành động). Phân biệt: `sit` = đang ngồi."]],
["K","What are we having for breakfast?","Sáng nay mình ăn gì hả bố?","What + are + S + having + for + bữa ăn?",[
"Dùng **hiện tại tiếp diễn** để nói việc sắp diễn ra đã được chuẩn bị sẵn.",
"**Vì sao `having` mà không phải `eating`?** Với bữa ăn, người bản xứ hay dùng `have`: `have breakfast`, `have lunch`. `eat breakfast` vẫn đúng nhưng ít tự nhiên hơn trong câu hỏi này.",
"`for breakfast` = cho bữa sáng: `We have eggs for breakfast.`"]],
["D","We have eggs, toast and some milk.","Có trứng, bánh mì nướng và ít sữa.","some + N không đếm được / N số nhiều",[
"`eggs` đếm được nên có `-s`. `toast` và `milk` không đếm được nên không thêm `-s`. Muốn đếm thì dùng: `a slice of toast`, `a glass of milk`.",
"`some` = một ít, dùng trong câu khẳng định với cả danh từ không đếm được và đếm được số nhiều.",
"Liệt kê ba thứ: `A, B and C`."]],
["K","Can I have some cereal instead?","Con ăn ngũ cốc thay vào được không ạ?","Can I have + some + N + instead?",[
"`Can I have...?` là cách xin đồ ăn, đồ uống lịch sự và tự nhiên nhất. Không nói `Give me...` vì nghe như ra lệnh.",
"**Vì sao dùng `some` trong câu hỏi mà không phải `any`?** Thường câu hỏi dùng `any`, nhưng khi **xin** hoặc **mời** thì dùng `some` vì người hỏi mong câu trả lời là ‘có’.",
"`instead` ở cuối câu = thay vào đó. Nếu có danh từ đi kèm thì dùng `instead of`: `cereal instead of eggs`."]],
["D","Of course. Would you like some honey on it?","Được chứ. Con có muốn rưới mật ong lên không?","Would you like + N?",[
"`Would you like + danh từ?` là câu **mời** lịch sự. `Would you like + to V?` là mời làm gì.",
"**Vì sao `Would you like` mà không phải `Do you like`?** `Do you like honey?` là hỏi sở thích chung (con có thích mật ong không). `Would you like some honey?` là mời ngay bây giờ.",
"`on it`: `it` thay cho `cereal`."]],
["K","Yes, please. Just a little.","Có ạ. Chỉ một chút thôi.","Yes, please. / No, thank you.",[
"Đáp lời mời: đồng ý là `Yes, please`, từ chối là `No, thank you` hoặc `No, thanks`. Chỉ nói `Yes` hoặc `No` không thì nghe cụt.",
"`Just a little` = chỉ một chút (honey không đếm được nên dùng `a little`)."]],
["M","Don't talk with your mouth full, sweetie.","Đừng vừa nhai vừa nói nhé con.","Don't + V + with + N + tính từ",[
"Mệnh lệnh phủ định `Don't + V`.",
"`with your mouth full` = với cái miệng đầy thức ăn. Cấu trúc `with + danh từ + tính từ` mô tả trạng thái đi kèm: `Don't sleep with the lights on.`",
"Đây là câu nhắc nhở rất quen thuộc trong các gia đình nói tiếng Anh."]],
["K","Sorry. Can you pass me the milk, please?","Con xin lỗi. Mẹ đưa con hộp sữa được không ạ?","pass + người + vật",[
"Động từ `pass` có thể theo sau bởi **hai tân ngữ**: người nhận đứng trước, đồ vật đứng sau: `pass me the milk`. Viết cách khác: `pass the milk to me`.",
"Các động từ tương tự: `give me`, `show me`, `send me`, `bring me`.",
"`please` đặt cuối câu, trước có dấu phẩy, để lời nhờ mềm hơn."]],
["D","Here you are. Finish your breakfast, we're leaving in ten minutes.","Đây con. Ăn nốt đi, mười phút nữa mình đi đấy.","Here you are   |   be + V-ing + in + thời gian",[
"`Here you are` hoặc `Here you go` = của con đây (nói khi đưa đồ cho ai).",
"`We're leaving` là hiện tại tiếp diễn chỉ **kế hoạch gần đã định**.",
"**Vì sao `in ten minutes` mà không phải `after ten minutes`?** Để nói ‘bao lâu nữa’ tính từ bây giờ, tiếng Anh dùng `in`. `after` dùng với một mốc hay sự việc: `after breakfast`."]]
]},

{id:"school-ready",g:"sang",t:"7:20",en:"Ready for School",vi:"Chuẩn bị đi học",sp:["M","K"],
scene:"Trước khi ra khỏi nhà, mẹ kiểm tra cặp sách, nhắc con đồ cần mang và chào tạm biệt.",
tip:"Làm một ‘checklist’ bằng tiếng Anh dán ở cửa: books, pencil case, water bottle, lunch box. Mỗi sáng hai mẹ con đọc to cùng nhau.",
vocab:[["pack your bag","xếp cặp"],["pencil case","hộp bút"],["water bottle","bình nước"],["lunch box","hộp cơm"],["hurry up","nhanh lên"],["be late","bị muộn"]],
L:[
["M","Have you packed your school bag?","Con xếp cặp chưa?","Have + S + V3 (hiện tại hoàn thành)?",[
"**Hiện tại hoàn thành** (`have/has + V3`) dùng khi việc đã làm trong quá khứ nhưng **kết quả quan trọng ở hiện tại**: mẹ quan tâm bây giờ cặp đã xếp xong chưa.",
"**Vì sao không dùng `Did you pack`?** `Did you pack...?` vẫn đúng, nhưng hỏi về một hành động trong quá khứ. `Have you packed...?` nhấn vào kết quả ‘đã xong chưa’, rất tự nhiên khi kiểm tra.",
"`packed` là V3 của `pack` (động từ có quy tắc, thêm `-ed`)."]],
["K","Yes, I have. I've got my books and my pencil case.","Rồi ạ. Con có sách và hộp bút rồi.","Yes, I have.   |   I've got + N",[
"Trả lời ngắn cho câu hiện tại hoàn thành: `Yes, I have.` / `No, I haven't.` Không trả lời `Yes, I did.`",
"`I've got` = `I have got` = `I have` (có). Cách nói này phổ biến trong tiếng Anh-Anh, nhất là văn nói.",
"Lặp `my` trước mỗi danh từ (`my books and my pencil case`) để rõ ràng, nhưng bỏ cái thứ hai cũng được."]],
["M","Don't forget your water bottle and your lunch box.","Đừng quên bình nước và hộp cơm nhé.","Don't forget + N",[
"`forget + danh từ` = quên mang, quên cầm theo.",
"`water bottle`, `lunch box` là danh từ ghép: danh từ đầu bổ nghĩa cho danh từ sau và luôn ở dạng số ít (không nói `waters bottle`)."]],
["K","Where are my shoes? I can't see them anywhere.","Giày con đâu rồi? Con tìm mãi không thấy.","Where are + N số nhiều?   |   not ... anywhere",[
"`shoes` số nhiều nên dùng `are` và đại từ `them`.",
"**Vì sao `anywhere` mà không phải `somewhere`?** Trong câu **phủ định** và câu hỏi dùng `anywhere`. Câu khẳng định dùng `somewhere`: `They're somewhere in the house.`",
"`can't see` = không nhìn thấy (khác `can't find` = không tìm thấy, nhưng ở đây nghĩa gần như nhau)."]],
["M","Look by the door. Hurry up, or we'll be late!","Nhìn chỗ cửa ấy. Nhanh lên, không là muộn đấy!","Mệnh lệnh + or + S + will + V",[
"`by the door` = cạnh cửa (`by` = sát bên).",
"**Vì sao dùng `or`?** Sau câu mệnh lệnh, `or` nghĩa là ‘nếu không thì’, nói hậu quả: `Hurry up, or we'll be late.` Tương đương: `If you don't hurry up, we'll be late.`",
"`we'll` = `we will`, dự đoán điều sẽ xảy ra. `be late` = bị muộn (late là tính từ)."]],
["K","I'm ready! Let's go.","Con xong rồi! Mình đi thôi.","I'm + adj   |   Let's + V",[
"`ready` là tính từ: sẵn sàng. Nói `I'm ready`, không nói `I ready`.",
"`Let's go` = mình đi thôi."]],
["M","Wait! Give me a hug first.","Khoan! Ôm mẹ cái đã nào.","give + người + vật + first",[
"`give me a hug` = ôm mẹ một cái. Động từ `give` theo sau bởi hai tân ngữ (người trước, vật sau).",
"`first` ở cuối câu = trước đã, làm việc này trước rồi mới làm việc khác.",
"Cùng kiểu: `give me a kiss`, `give me a high five` (đập tay)."]],
["M","Have a good day at school!","Chúc con một ngày vui ở trường!","Have a + adj + day",[
"Đây là câu **chúc** có hình thức mệnh lệnh: `Have a good day!`, `Have fun!`, `Have a nice trip!`",
"**Vì sao `at school` không có `the`?** Khi nói đến trường như nơi học tập (đi học, ở trường) thì không dùng `the`: `go to school`, `at school`. Dùng `the school` khi nói về tòa nhà cụ thể."]],
["K","Bye, Mom! See you later.","Con chào mẹ! Lát gặp lại mẹ.","See you + thời gian",[
"`See you later` là dạng rút gọn của `I will see you later`.",
"Các biến thể: `See you soon`, `See you tonight`, `See you tomorrow`.",
"Trong tiếng Anh, con gọi `Mom` (Mỹ) hoặc `Mum` (Anh) như một tên riêng nên viết hoa."]]
]},
{id:"at-school",g:"ngay",t:"8:00",en:"In the Classroom",vi:"Trong lớp học",sp:["T","K","F"],
scene:"Trong giờ học: cô giáo bắt đầu tiết học, con xin phép ra ngoài, bạn mượn tẩy, cô hỏi bài.",
tip:"Đóng vai ‘lớp học’ ở nhà: bố mẹ làm cô giáo, con làm học sinh. Câu ‘May I go to the toilet?’ là câu con cần nhất ở trường quốc tế.",
vocab:[["take out","lấy ra"],["May I...?","Con xin phép..."],["borrow","mượn"],["lend","cho mượn"],["raise your hand","giơ tay"],["the answer","câu trả lời"]],
L:[
["T","Good morning, class. Please take out your books.","Chào cả lớp. Các con lấy sách ra nào.","Please + V + O",[
"`class` ở đây là danh từ tập hợp chỉ cả lớp học sinh, dùng như một lời gọi.",
"`Please` đặt đầu câu mệnh lệnh để lịch sự hơn. Đặt cuối câu cũng được: `Take out your books, please.`",
"`take out` = lấy ra (khỏi cặp, khỏi ngăn bàn). Ngược nghĩa: `put away` = cất đi."]],
["K","Excuse me, teacher. May I go to the toilet?","Thưa cô, con xin phép đi vệ sinh ạ.","Excuse me + May I + V?",[
"`Excuse me` dùng để thu hút sự chú ý một cách lịch sự trước khi nói.",
"**Vì sao `May I` mà không phải `Can I`?** Cả ba đều dùng để xin phép, mức độ lịch sự tăng dần: `Can I` < `Could I` < `May I`. Với thầy cô, `May I` là chuẩn mực nhất.",
"Lưu ý văn hóa: học sinh ở Anh, Mỹ thường gọi thầy cô bằng `Mr./Ms. + họ` (ví dụ `Ms. Lan`). Gọi `teacher` vẫn được hiểu, rất phổ biến ở châu Á."]],
["T","Yes, you may. Come back quickly.","Được con. Về nhanh nhé.","Yes, you may.   |   V + trạng từ (-ly)",[
"Trả lời ngắn dùng lại trợ động từ của câu hỏi: hỏi `May I` thì đáp `Yes, you may`.",
"**Vì sao `quickly` mà không phải `quick`?** `quickly` là trạng từ, bổ nghĩa cho động từ `come back`. Phần lớn trạng từ chỉ cách thức = tính từ + `-ly`: quick → quickly, slow → slowly.",
"`come back` = quay lại."]],
["F","Can I borrow your eraser, please?","Cho tớ mượn cục tẩy được không?","Can I borrow + your + N?",[
"**`borrow` hay `lend`?** `borrow` = mượn (đồ của người khác về mình). `lend` = cho mượn (đồ của mình sang người khác). Hai cách hỏi đúng: `Can I borrow your eraser?` hoặc `Can you lend me your eraser?`",
"Lỗi hay gặp của người Việt: `Can you borrow me...?` là sai.",
"`eraser` (Mỹ) = `rubber` (Anh): cục tẩy."]],
["K","Sure, here you go. Please give it back later.","Được, của cậu đây. Lát nữa trả tớ nhé.","give + it + back",[
"`Sure` = được chứ, dĩ nhiên (thân mật hơn `Of course`).",
"`give back` = trả lại. Như các cụm động từ tách được khác, đại từ phải đứng giữa: `give it back`, không nói `give back it`.",
"`later` = lát nữa, sau đó."]],
["T","Who knows the answer? Raise your hand.","Ai biết câu trả lời nào? Giơ tay lên.","Who + V(s/es)?",[
"**Vì sao `Who knows` mà không phải `Who does know`?** Khi `who` là **chủ ngữ** (người làm hành động), câu hỏi không cần trợ động từ `do/does`, và động từ chia như ngôi thứ ba số ít: `Who knows?`, `Who wants cake?`",
"So sánh: `Who do you know?` (Con biết ai?) thì `who` là tân ngữ nên cần `do`.",
"`raise your hand` = giơ tay. `raise` là nâng cái gì lên (có tân ngữ); `rise` là tự nó dâng lên (`The sun rises`)."]],
["K","I know! The answer is twelve.","Con biết ạ! Đáp án là mười hai.","The answer is + N",[
"`know` là động từ chỉ trạng thái nên không dùng tiếp diễn: không nói `I'm knowing`.",
"`the answer`: dùng `the` vì chỉ có một đáp án đúng cho câu hỏi đó."]],
["T","Well done! That's correct.","Giỏi lắm! Đúng rồi.","That's + tính từ",[
"`Well done!` = làm tốt lắm (khen kết quả).",
"`That's correct` = `That's right`. `That` chỉ câu trả lời vừa nói. Khi sai, thầy cô thường nói nhẹ nhàng: `Not quite. Try again!`"]]
]},

{id:"coming-home",g:"ngay",t:"16:30",en:"After School",vi:"Đón con tan học",sp:["D","K"],
scene:"Bố đón con ở cổng trường và hỏi con về một ngày ở trường trên đường về nhà.",
tip:"Đừng hỏi ‘Did you have a good day?’ (con chỉ đáp Yes). Hỏi câu mở như ‘What did you learn today?’ để con phải nói nhiều hơn.",
vocab:[["How was your day?","Hôm nay của con thế nào?"],["break time","giờ ra chơi"],["learn about","học về"],["interesting","thú vị"],["snack","đồ ăn vặt"],["hungry","đói"]],
L:[
["D","Hi, buddy! How was your day?","Chào con trai! Hôm nay thế nào?","How + was + N?",[
"**Vì sao `was` mà không phải `is`?** Ngày học đã kết thúc, nên dùng quá khứ của `is` là `was`.",
"`buddy` là cách bố gọi con (thường là con trai) thân mật, giống ‘anh bạn nhỏ’. Với con gái hay dùng `sweetie`, `honey`.",
"Đây là câu hỏi quen thuộc nhất sau giờ học, giờ làm ở các nước nói tiếng Anh."]],
["K","It was great! We played football at break time.","Vui lắm ạ! Chúng con đá bóng giờ ra chơi.","S + V-ed (quá khứ đơn có quy tắc)",[
"`played` = `play` + `-ed`, quá khứ của động từ có quy tắc.",
"**Vì sao `play football` không có `the`?** Môn thể thao, trò chơi đi sau `play` không dùng mạo từ: `play football`, `play chess`. Nhưng nhạc cụ thì có `the`: `play the piano`.",
"`at break time` = vào giờ ra chơi. `at` dùng với mốc thời gian cụ thể: `at 5 o'clock`, `at lunchtime`."]],
["D","Did you eat all your lunch?","Con có ăn hết cơm trưa không?","Did + S + V + all + N?",[
"Câu hỏi quá khứ: `Did` + chủ ngữ + động từ nguyên mẫu (`eat`, không phải `ate`).",
"`all your lunch` = toàn bộ bữa trưa. `all` đứng trước tính từ sở hữu: `all my toys`, `all the children`."]],
["K","Not all of it. I didn't like the vegetables.","Không hết ạ. Con không thích món rau.","S + didn't + V",[
"`Not all of it` = không phải tất cả. Khi dùng đại từ (it, them) thì bắt buộc có `of`: `all of it`, `all of them`.",
"Phủ định quá khứ: `didn't` + động từ nguyên mẫu: `didn't like`, không nói `didn't liked`.",
"`the vegetables`: có `the` vì là rau trong bữa trưa hôm nay, cụ thể. Nói chung chung thì bỏ `the`: `I don't like vegetables.`"]],
["D","What did you learn today?","Hôm nay con học gì?","What + did + S + V?",[
"`What` ở đây là **tân ngữ** (học cái gì), nên cần trợ động từ `did`.",
"So sánh với `What happened?` (Chuyện gì đã xảy ra?): `what` là chủ ngữ nên không cần `did` và động từ chia quá khứ luôn."]],
["K","We learned about animals that live in the ocean.","Chúng con học về các con vật sống dưới đại dương.","N + that + V (mệnh đề quan hệ)",[
"`that live in the ocean` là **mệnh đề quan hệ**, bổ nghĩa cho `animals`: những con vật mà sống ở đại dương.",
"**Vì sao `live` mà không phải `lives`?** Động từ trong mệnh đề quan hệ chia theo danh từ mà nó bổ nghĩa: `animals` số nhiều → `live`. Nếu là `an animal that lives...` thì thêm `-s`.",
"Với vật, dùng `that` hoặc `which`; với người dùng `who` hoặc `that`. `learn about` = học về."]],
["D","That sounds interesting! Tell me more.","Nghe hay quá! Kể thêm cho bố nghe đi.","sound + tính từ",[
"`sound` (nghe có vẻ) là động từ nối, theo sau là **tính từ**: `That sounds fun`, `That sounds great`.",
"**`interesting` hay `interested`?** Tính từ đuôi `-ing` mô tả **sự việc** gây ra cảm xúc (câu chuyện thú vị). Đuôi `-ed` mô tả **cảm xúc của người**: `I'm interested in animals.` Nói `I'm interesting` nghĩa là ‘tôi là người thú vị’!",
"`Tell me more` = kể thêm đi."]],
["K","I'm hungry, Dad. Can we get a snack?","Con đói rồi bố ơi. Mình mua gì ăn được không?","Can we + V?",[
"`I'm hungry` = con đói. `hungry` là tính từ nên có `am`.",
"`get` ở đây = mua, lấy. Văn nói rất hay dùng `get` thay cho `buy`.",
"`snack` = đồ ăn nhẹ giữa các bữa, đếm được: `a snack`, `some snacks`."]]
]},

{id:"homework",g:"ngay",t:"17:00",en:"Homework Time",vi:"Làm bài tập về nhà",sp:["M","K"],
scene:"Mẹ ngồi cùng con làm bài tập toán. Con gặp bài khó và mẹ giải thích.",
tip:"Khi con làm đúng, khen vào nỗ lực chứ không chỉ khen thông minh: ‘You worked really hard!’ giúp con chịu khó hơn.",
vocab:[["homework","bài tập về nhà"],["have to","phải"],["exercise","bài tập"],["explain","giải thích"],["I get it","con hiểu rồi"],["better and better","ngày càng tốt hơn"]],
L:[
["M","Do you have any homework today?","Hôm nay con có bài tập về nhà không?","Do + S + have + any + N?",[
"`any` dùng trong câu hỏi và câu phủ định khi hỏi có hay không.",
"**`homework` không đếm được**: không nói `a homework` hay `homeworks`. Muốn đếm: `a piece of homework`. Tương tự: `information`, `advice`, `furniture`."]],
["K","Yes, I have to do some math exercises.","Có ạ, con phải làm mấy bài toán.","have to + V",[
"**`have to` hay `must`?** Cả hai đều là ‘phải’. `have to` khi sự bắt buộc đến **từ bên ngoài** (cô giáo giao bài). `must` khi người nói tự thấy cần, hoặc là luật lệ: `I must study harder.`",
"**Vì sao `do` mà không phải `make`?** Với bài tập, việc nhà, công việc dùng `do`: `do homework`, `do exercises`, `do the dishes`. `make` dùng khi tạo ra cái gì mới: `make a cake`, `make a mistake`.",
"`math` (Mỹ) = `maths` (Anh): môn toán."]],
["M","Let's do it together. Read the question first.","Mình cùng làm nhé. Đọc đề bài trước đã.","Let's + V + together",[
"`together` = cùng nhau, đặt cuối câu.",
"`the question first` = đọc câu hỏi trước tiên. `first` cuối câu nghĩa là làm việc này trước."]],
["K","I don't understand this one. It's too difficult.","Con không hiểu bài này. Khó quá ạ.","S + don't + V   |   too + tính từ",[
"**Vì sao không nói `I'm not understanding`?** `understand`, `know`, `like`, `want` là **động từ chỉ trạng thái**, thường không dùng ở thì tiếp diễn.",
"`this one` = cái này; `one` thay cho danh từ đã nhắc (question) để không lặp lại.",
"**`too` hay `very`?** `too` = quá mức, mang nghĩa tiêu cực (khó đến mức không làm được). `very` = rất, chỉ nhấn mạnh. `It's very difficult` = rất khó (nhưng vẫn có thể làm được)."]],
["M","Don't worry. Let me explain it to you.","Đừng lo. Để mẹ giải thích cho con.","Let me + V   |   explain + vật + to + người",[
"`Let me + V` = để tôi làm gì (đề nghị tự làm). Khác với `Let's` là rủ cùng làm.",
"**Vì sao không nói `explain you`?** `explain` không nhận người làm tân ngữ trực tiếp. Phải nói `explain it to you` hoặc `explain to you how...`. Lỗi `Can you explain me?` rất phổ biến.",
"`Don't worry` = đừng lo."]],
["M","If you have five apples and eat two, how many are left?","Nếu con có năm quả táo và ăn hai quả, còn lại bao nhiêu quả?","If + hiện tại đơn, + câu hỏi   |   How many + are left?",[
"Câu **điều kiện loại 0/1**: `If` + hiện tại đơn, dùng cho tình huống có thật hoặc giả định đơn giản như bài toán.",
"`How many` vì `apples` đếm được. Câu đầy đủ: `How many apples are left?`, ở đây bỏ `apples` vì đã rõ.",
"`be left` = còn lại. `left` là quá khứ phân từ của `leave`."]],
["K","Three! Oh, now I get it.","Ba ạ! À, giờ con hiểu rồi.","I get it",[
"`I get it` = con hiểu rồi (văn nói, thân mật hơn `I understand`). Ngược lại: `I don't get it.`",
"Dùng hiện tại đơn vì đây là trạng thái hiểu ngay lúc nói."]],
["M","Excellent! You're getting better and better.","Xuất sắc! Con ngày càng giỏi hơn đấy.","be getting + so sánh hơn + and + so sánh hơn",[
"`get + tính từ` = trở nên. Thì tiếp diễn `are getting` diễn tả **quá trình đang thay đổi**.",
"**So sánh kép** `better and better` = ngày càng tốt hơn. `better` là so sánh hơn bất quy tắc của `good`. Tương tự: `bigger and bigger`, `more and more beautiful`."]]
]},

{id:"chores",g:"ngay",t:"17:30",en:"Helping at Home",vi:"Giúp mẹ việc nhà",sp:["M","K"],
scene:"Mẹ nhờ con dọn phòng khách. Con tự nhận thêm việc tưới cây và đổ rác.",
tip:"Biến việc nhà thành trò chơi: mỗi việc con làm xong và nói được câu tiếng Anh tương ứng thì được một ngôi sao.",
vocab:[["tidy up","dọn dẹp gọn gàng"],["put back","để lại chỗ cũ"],["water the plants","tưới cây"],["take out the trash","đổ rác"],["helpful","có ích, hay giúp đỡ"],["proud of","tự hào về"]],
L:[
["M","Can you help me tidy up the living room?","Con giúp mẹ dọn phòng khách được không?","help + người + V (nguyên mẫu)",[
"`help + người + V` (không cần `to`): `help me tidy up`. Có `to` cũng đúng: `help me to tidy up`, nhưng văn nói thường bỏ.",
"`tidy up` = dọn cho gọn gàng (xếp đồ về chỗ). `clean` = lau chùi cho sạch.",
"`living room` = phòng khách."]],
["K","Sure! What should I do first?","Vâng! Con nên làm gì trước ạ?","What + should + I + V?",[
"Hỏi hướng dẫn hoặc lời khuyên với `should`.",
"`first` = đầu tiên, trước tiên."]],
["M","Please put your toys back in the box.","Con cất đồ chơi lại vào hộp nhé.","put + N + back + in + N",[
"`put back` = để lại chỗ cũ. Danh từ có thể chen giữa: `put your toys back`.",
"`in the box` = vào trong hộp. Với động từ chuyển động, người bản xứ cũng hay nói `into the box`."]],
["K","Done! Shall I water the plants too?","Xong rồi ạ! Con tưới cây luôn nhé?","Shall I + V?",[
"`Done!` là câu rút gọn của `I'm done`.",
"**`Shall I` hay `Can I`?** `Shall I...?` dùng để **đề nghị giúp** (con làm việc này cho mẹ nhé?). `Can I...?` dùng để **xin phép**. Kiểu Mỹ hay nói `Should I...?` với nghĩa tương tự.",
"`water` ở đây là **động từ** (tưới nước). Nhiều từ tiếng Anh vừa là danh từ vừa là động từ."]],
["M","Yes, please. That would be very helpful.","Ừ, con tưới đi. Thế thì giúp mẹ nhiều lắm.","That would be + tính từ",[
"`would` ở đây làm câu nói nhẹ nhàng, lịch sự hơn `That is very helpful`, vì việc tưới cây chưa xảy ra.",
"`helpful` = có ích, giúp được nhiều. Hậu tố `-ful` = đầy: help → helpful, care → careful."]],
["K","Mom, the trash can is full.","Mẹ ơi, thùng rác đầy rồi.","N + is + tính từ",[
"`trash can` (Mỹ) = `rubbish bin` (Anh): thùng rác.",
"`full` = đầy. Ngược nghĩa: `empty` = trống."]],
["M","Could you take out the trash for me?","Con đi đổ rác giúp mẹ được không?","Could you + V + for + người?",[
"`Could you...?` lịch sự hơn `Can you...?`. Bố mẹ dùng `Could you` với con cũng là dạy con cách nhờ vả lịch sự.",
"`take out the trash` = mang rác ra ngoài, đổ rác.",
"`for me` = giúp mẹ, cho mẹ."]],
["K","No problem! I'm a big helper.","Không có gì ạ! Con là người giúp việc giỏi mà.","a + tính từ + danh từ",[
"`No problem` = không vấn đề gì, sẵn lòng.",
"`helper` = người giúp đỡ. Hậu tố `-er` biến động từ thành danh từ chỉ người: help → helper, teach → teacher."]],
["M","Thank you so much. I'm proud of you.","Cảm ơn con nhiều. Mẹ tự hào về con.","be proud of + người",[
"**Vì sao `proud of` mà không phải `proud about`?** `proud` luôn đi với giới từ `of`. Đây là cụm cố định, nên học cả cụm.",
"Câu này nói thường xuyên sẽ giúp con tự tin và gắn bó với việc học tiếng Anh."]]
]},

{id:"cooking",g:"ngay",t:"18:00",en:"Cooking Together",vi:"Nấu ăn cùng mẹ",sp:["K","M"],
scene:"Mẹ đang nấu súp gà. Con vào bếp xin phụ, mẹ giao việc an toàn và nhắc con cẩn thận.",
tip:"Trong bếp, dạy con các động từ hành động: wash, cut, stir, pour, taste. Vừa làm vừa nói to tên hành động.",
vocab:[["chicken soup","súp gà"],["carrots","cà rốt"],["potatoes","khoai tây"],["sharp","sắc"],["be careful","cẩn thận"],["smell delicious","thơm ngon"]],
L:[
["K","What are you cooking, Mom?","Mẹ đang nấu món gì thế?","What + are + you + V-ing?",[
"**Hiện tại tiếp diễn** vì việc nấu đang diễn ra ngay lúc nói.",
"Cấu trúc câu hỏi: `What` + `am/is/are` + chủ ngữ + `V-ing`?"]],
["M","I'm making chicken soup. Would you like to help?","Mẹ đang nấu súp gà. Con có muốn phụ mẹ không?","Would you like + to V?",[
"**Vì sao `making` mà không phải `cooking`?** Với món ăn cụ thể, người bản xứ hay dùng `make`: `make soup`, `make a sandwich`. `cook` thường dùng chung chung: `I'm cooking dinner`.",
"`Would you like to + V?` = mời ai làm gì (lịch sự). Khác `Would you like + N?` = mời món gì."]],
["K","Yes! What can I do?","Có ạ! Con làm được gì ạ?","What + can + I + V?",[
"`can` ở đây hỏi về khả năng hoặc việc được giao.",
"Câu hỏi đảo: `can` đứng trước chủ ngữ `I`."]],
["M","You can wash the carrots and the potatoes.","Con rửa cà rốt và khoai tây nhé.","S + can + V + the + N số nhiều",[
"`carrots` thêm `-s`; `potatoes` thêm `-es` vì danh từ tận cùng bằng phụ âm + `o` thường thêm `-es`: potato → potatoes, tomato → tomatoes.",
"`the` vì là cà rốt, khoai tây cụ thể đang có trên bàn."]],
["K","Is it okay if I cut them?","Con cắt chúng được không ạ?","Is it okay if + S + V (hiện tại)?",[
"`Is it okay if...?` là một cách xin phép rất tự nhiên, nhẹ nhàng.",
"**Vì sao `if I cut` mà không phải `if I will cut`?** Sau `if` dùng hiện tại đơn dù nói về việc sắp làm.",
"`them` thay cho `the carrots and the potatoes`."]],
["M","No, the knife is too sharp. I'll do that part.","Không con ạ, dao sắc quá. Phần đó để mẹ làm.","too + tính từ   |   I'll + V",[
"`too sharp` = sắc quá (đến mức nguy hiểm cho trẻ). Nhớ `too` mang nghĩa ‘quá mức’.",
"**Vì sao `I'll` mà không phải `I'm going to`?** `will` dùng cho **quyết định ngay lúc nói**. Mẹ vừa quyết định sẽ tự cắt. `be going to` dùng cho dự định đã có từ trước.",
"`knife` chữ `k` câm, đọc /naɪf/. Số nhiều: `knives`."]],
["M","Be careful! The pot is very hot.","Cẩn thận! Cái nồi nóng lắm đấy.","Be + tính từ (mệnh lệnh)",[
"Câu mệnh lệnh với tính từ phải có `Be`: `Be careful!`, `Be quiet!`, `Be nice!`. Không nói `Careful!` trong câu đầy đủ (dù văn nói vẫn nghe thấy).",
"`very hot` = rất nóng (chỉ nhấn mạnh, khác `too hot` = nóng quá không chạm được)."]],
["K","It smells delicious!","Thơm quá đi!","smell + tính từ",[
"`smell` là động từ nối như `look`, `sound`, `taste`, nên theo sau là tính từ: `smells delicious`, không nói `smells deliciously`.",
"**Vì sao không nói `very delicious`?** `delicious` đã mang nghĩa rất ngon (tính từ mạnh). Người bản xứ hay dùng `really delicious` hoặc `so delicious` thay vì `very`.",
"`It smells` thêm `-s` vì chủ ngữ `It` là ngôi thứ ba số ít."]],
["M","It will be ready in fifteen minutes.","Mười lăm phút nữa là xong.","will be + tính từ + in + thời gian",[
"`will` dự đoán tương lai.",
"`in fifteen minutes` = sau mười lăm phút nữa (tính từ bây giờ). Lưu ý `fifteen` (15) nhấn âm cuối, `fifty` (50) nhấn âm đầu."]]
]},

{id:"dinner",g:"toi",t:"18:45",en:"Family Dinner",vi:"Bữa tối cả nhà",sp:["M","D","K"],
scene:"Cả nhà ngồi vào bàn ăn tối. Con không thích cá nhưng được khuyến khích ăn thử.",
tip:"Mỗi tối cho con nói một câu ‘Can I have some more...?’ với một món khác nhau. Sau một tuần con đã thuộc tên cả chục món ăn.",
vocab:[["some more","thêm một ít"],["good for you","tốt cho sức khỏe"],["one bite","một miếng"],["might","có thể (không chắc)"],["yummy","ngon (trẻ em hay dùng)"],["I'm full","con no rồi"]],
L:[
["M","Dinner's ready! Wash your hands, everyone.","Cơm tối xong rồi! Mọi người rửa tay đi nào.","N's = N is   |   everyone",[
"`Dinner's` = `Dinner is`. Văn nói rút gọn `is` thành `'s` cả sau danh từ.",
"`everyone` = mọi người, đặt cuối câu như lời gọi. Nếu làm chủ ngữ, `everyone` đi với động từ **số ít**: `Everyone is here.`"]],
["D","This looks amazing. Thank you, honey.","Trông hấp dẫn quá. Cảm ơn em nhé.","This + looks + tính từ",[
"`look + tính từ` = trông có vẻ. `looks` thêm `-s` vì chủ ngữ `This` số ít.",
"`honey` ở đây bố gọi mẹ (vợ chồng cũng gọi nhau thân mật như vậy).",
"Bố mẹ cảm ơn nhau trước mặt con là cách dạy con nói `Thank you` tự nhiên nhất."]],
["K","Can I have some more rice, please?","Con xin thêm cơm được không ạ?","Can I have + some more + N?",[
"`some more` = thêm một ít nữa. `rice` không đếm được nên không có `-s`.",
"Ngược lại: `no more`, `not any more` = không thêm nữa."]],
["M","Of course. Try some fish too. It's good for you.","Được chứ. Ăn thử chút cá nữa nhé. Cá tốt cho con đấy.","be good for + người",[
"`Try some...` = ăn thử một ít.",
"**`good for` hay `good at`?** `good for you` = tốt cho con (có lợi). `good at` = giỏi về: `good at math`.",
"`fish` khi là món ăn thì không đếm được: `some fish`."]],
["K","I don't like fish very much.","Con không thích cá lắm.","S + don't + like + N + very much",[
"`not ... very much` = không ... lắm. Cụm `very much` đặt cuối câu, sau tân ngữ.",
"**Vì sao không nói `I don't like very much fish`?** Trạng từ `very much` không đứng giữa động từ và tân ngữ. Trật tự đúng: động từ + tân ngữ + `very much`.",
"`fish` nói chung chung (cá nói chung) nên không có `the`."]],
["D","Just try one bite. You might like it.","Thử một miếng thôi. Biết đâu con lại thích.","might + V",[
"**`might` hay `will`?** `might` = có thể (khả năng thấp, không chắc chắn). `will` = chắc chắn sẽ. Bố không chắc con sẽ thích nên dùng `might`. Mức độ chắc chắn: `will` > `may` > `might`.",
"`bite` = một miếng cắn. `one bite` nhấn mạnh ‘chỉ một miếng thôi’."]],
["K","Mmm, it's not bad! Actually, it's yummy.","Ừm, cũng không tệ! Thật ra là ngon ạ.","Actually, + mệnh đề",[
"`not bad` = không tệ, khá ngon (người Anh hay nói giảm nhẹ như vậy).",
"`Actually` = thật ra, dùng khi nói điều trái với dự đoán trước đó.",
"`yummy` là từ trẻ em hay dùng cho đồ ăn ngon; người lớn dùng `delicious`, `tasty`."]],
["D","See? I told you so.","Thấy chưa? Bố nói rồi mà.","I told you so",[
"`I told you so` là câu cố định: tôi đã bảo rồi mà. `told` là quá khứ của `tell`.",
"`See?` = Thấy chưa? (câu hỏi rút gọn của `Do you see?`)."]],
["K","I'm full. May I leave the table?","Con no rồi. Con xin phép rời bàn ạ.","May I + V?",[
"`I'm full` = con no rồi. Không nói `I'm fully`.",
"`May I leave the table?` là câu xin phép lịch sự trong bữa ăn của nhiều gia đình Anh, Mỹ. Bố mẹ có thể đáp: `Yes, you may. Please put your plate in the sink.`"]]
]},

{id:"playtime",g:"toi",t:"19:30",en:"Playtime",vi:"Giờ chơi buổi tối",sp:["K","D"],
scene:"Con xin xem TV, bố giới hạn thời gian và rủ con chơi cờ cá ngựa thay thế.",
tip:"Chơi trò chơi bàn cờ bằng tiếng Anh là cách luyện nói tự nhiên: It's your turn, roll the dice, I won, you lost lặp lại hàng chục lần mỗi ván.",
vocab:[["watch TV","xem tivi"],["board game","trò chơi bàn cờ"],["It's your turn","đến lượt con"],["roll the dice","đổ xúc xắc"],["win / won","thắng"],["lose / lost","thua"]],
L:[
["K","Dad, can I watch TV now?","Bố ơi, giờ con xem tivi được không?","Can I + V + now?",[
"**`watch` hay `see`?** `watch` = xem có chủ đích, theo dõi một thứ đang chuyển động (TV, phim, trận đấu). `see` = nhìn thấy (không chủ đích).",
"`watch TV` không có `the`. Nhưng `turn on the TV` (bật cái tivi) thì có `the` vì nói về thiết bị."]],
["D","You can watch for thirty minutes. After that, we'll read a book.","Con được xem ba mươi phút. Sau đó mình đọc sách nhé.","can + V + for + thời gian   |   After that, + will",[
"`for thirty minutes` = trong ba mươi phút.",
"`After that` = sau đó, đứng đầu câu và có dấu phẩy.",
"`we'll read` = dự định nói ngay lúc đó. Lưu ý `thirty` (30) nhấn âm đầu, `thirteen` (13) nhấn âm cuối."]],
["K","Can we play a board game instead?","Mình chơi cờ thay vào đó được không bố?","Can we + V + instead?",[
"`Can we...?` = mình có thể... không? (đề nghị làm cùng).",
"`instead` cuối câu = thay vì xem TV."]],
["D","Great idea! Which game do you want to play?","Ý hay đấy! Con muốn chơi trò nào?","Which + N + do + you + V?",[
"**`Which` hay `What`?** `which` dùng khi chọn trong **một số lựa chọn có giới hạn** (trong tủ có vài bộ cờ). `what` dùng khi lựa chọn không giới hạn: `What do you want to do?`",
"`Great idea!` = rút gọn của `That's a great idea!`"]],
["K","Let's play ludo! I want to be red.","Chơi cờ cá ngựa đi! Con muốn làm màu đỏ.","Let's + V   |   want to be + N/adj",[
"`ludo` là tên tiếng Anh của cờ cá ngựa.",
"`I want to be red` = con muốn làm phe màu đỏ. `want to + V`."]],
["D","It's your turn. Roll the dice.","Đến lượt con. Đổ xúc xắc đi.","It's + tính từ sở hữu + turn",[
"`It's your turn` = đến lượt con. `It's my turn` = đến lượt bố. Hỏi: `Whose turn is it?`",
"`dice` vốn là số nhiều của `die`, nhưng ngày nay dùng `dice` cho cả một con xúc xắc."]],
["K","Yay! I won! You lost, Dad.","Yeah! Con thắng rồi! Bố thua rồi.","S + V2 (bất quy tắc)",[
"`won` là quá khứ của `win` (win → won → won). `lost` là quá khứ của `lose` (lose → lost → lost).",
"**Vì sao không nói `I win`?** Ván cờ vừa kết thúc, nên dùng quá khứ. Khi đang chơi, nói `I'm winning!` (con đang thắng)."]],
["D","Good game! Let's play again tomorrow.","Ván hay lắm! Mai mình chơi tiếp nhé.","Let's + V + again + thời gian",[
"`Good game!` là câu nói lịch sự sau khi chơi, dù thắng hay thua. Dạy con nói câu này để biết thua đẹp.",
"`again` = lại, lần nữa. Trật tự: động từ + `again` + thời gian."]]
]},

{id:"bath",g:"toi",t:"20:00",en:"Bath Time",vi:"Giờ tắm",sp:["M","K"],
scene:"Mẹ pha nước tắm cho con, gội đầu và lau khô người.",
tip:"Giờ tắm rất hợp để dạy bộ phận cơ thể: ‘Wash your arms, wash your knees...’ vừa nói vừa chỉ.",
vocab:[["bath time","giờ tắm"],["just right","vừa phải"],["splash","té nước"],["soap","xà phòng"],["towel","khăn tắm"],["pajamas","bộ đồ ngủ"]],
L:[
["M","It's bath time! Your bath is ready.","Đến giờ tắm rồi! Nước tắm của con xong rồi.","It's + N + time",[
"`It's + danh từ + time` = đến giờ làm gì: `It's bath time`, `It's story time`, `It's dinner time`.",
"`bath` ở đây là bồn nước tắm đã pha sẵn. `take a bath` = tắm bồn, `take a shower` = tắm vòi sen."]],
["K","Is the water too hot?","Nước có nóng quá không mẹ?","Is + N + too + tính từ?",[
"Câu hỏi với `be`: đảo `Is` lên trước chủ ngữ.",
"`too hot` = nóng quá. Ngược lại: `too cold`."]],
["M","No, it's just right. Get in slowly.","Không, vừa đủ ấm. Từ từ vào nhé.","just right   |   V + trạng từ",[
"`just right` = vừa phải, vừa đúng.",
"`get in` = bước vào (bồn tắm, xe ô tô). Ngược lại: `get out`.",
"`slowly` là trạng từ bổ nghĩa cho `get in`."]],
["K","Can I play with my rubber duck?","Con chơi với vịt cao su được không?","play with + N",[
"`play with` = chơi với (đồ chơi hoặc người): `play with my friends`.",
"`rubber duck`: `rubber` (cao su) là danh từ đứng trước bổ nghĩa như tính từ."]],
["M","Yes, but don't splash water everywhere.","Được, nhưng đừng té nước tung tóe nhé.","Yes, but + don't + V",[
"`but` nối hai ý trái ngược: cho phép nhưng có điều kiện.",
"`everywhere` = khắp nơi. Các từ cùng nhóm: `somewhere`, `anywhere`, `nowhere`."]],
["M","Close your eyes. I'm going to wash your hair.","Nhắm mắt lại. Mẹ gội đầu cho con nhé.","be going to + V",[
"**`be going to` hay `will`?** `be going to` dùng cho việc **sắp làm ngay, đã có kế hoạch hoặc dấu hiệu rõ ràng** (mẹ đã cầm dầu gội). `will` dùng cho quyết định tức thời.",
"`wash your hair` = gội đầu (tiếng Anh không có từ riêng cho ‘gội’)."]],
["K","Ouch! I've got soap in my eyes!","Ui! Xà phòng vào mắt con rồi!","I've got + N + in + N",[
"`Ouch!` là thán từ khi bị đau.",
"`I've got` = `I have`, ở đây chỉ trạng thái đang có xà phòng trong mắt.",
"`soap` không đếm được; một bánh xà phòng là `a bar of soap`."]],
["M","Sorry! Here's a towel. Let's dry you off.","Mẹ xin lỗi! Khăn đây. Mình lau khô người nhé.","Here's + N   |   dry + người + off",[
"`Here's` = `Here is`, dùng khi đưa đồ.",
"`dry off` = lau khô. Với đại từ, đặt ở giữa: `dry you off`."]],
["K","Brr, I'm cold. Where are my pajamas?","Brr, con lạnh. Đồ ngủ của con đâu rồi?","Where are + N số nhiều?",[
"`pajamas` (Mỹ) / `pyjamas` (Anh) luôn ở dạng **số nhiều** (giống `pants`, `jeans`), nên dùng `are`.",
"`Brr` là âm thanh khi run vì lạnh."]]
]},

{id:"bedtime",g:"toi",t:"20:30",en:"Bedtime",vi:"Đi ngủ",sp:["M","K"],
scene:"Mẹ đưa con lên giường, đọc truyện, để đèn ngủ và chúc con ngủ ngon.",
tip:"Kết thúc mỗi ngày bằng cùng một câu: ‘Good night. Sleep tight. I love you.’ Đây sẽ là những câu tiếng Anh con nhớ cả đời.",
vocab:[["It's getting late","muộn rồi"],["time for bed","giờ đi ngủ"],["read a story","đọc truyện"],["night light","đèn ngủ"],["sleep tight","ngủ ngon"],["sweet dreams","chúc mơ đẹp"]],
L:[
["M","It's getting late. Time for bed, sweetie.","Muộn rồi. Đến giờ đi ngủ rồi con yêu.","It's getting + tính từ   |   Time for + N",[
"`It's getting late` = trời đang muộn dần. Thì tiếp diễn với `get` chỉ **sự thay đổi dần dần**: `It's getting dark`, `It's getting cold`.",
"**`Time for bed` hay `Time to bed`?** Sau `time for` là **danh từ** (`bed`). Sau `time to` là **động từ**: `Time to go to bed`, `Time to sleep`.",
"Câu đầy đủ: `It's time for bed.`"]],
["K","Can you read me a story, please?","Mẹ đọc truyện cho con nghe được không?","read + người + vật",[
"`read me a story` = đọc cho con một câu chuyện. `read` có thể nhận hai tân ngữ: người trước, vật sau. Viết cách khác: `read a story to me`.",
"Tương tự: `tell me a story`, `sing me a song`."]],
["M","Sure. Which book would you like tonight?","Được. Tối nay con muốn nghe cuốn nào?","Which + N + would you like?",[
"`Which book` vì chọn trong số sách có trên giá.",
"`would you like` lịch sự hơn `do you want`."]],
["K","The one about the little bear, please.","Cuốn về chú gấu nhỏ ạ.","the one + about + N",[
"`the one` thay cho `the book`, tránh lặp danh từ.",
"`about the little bear` bổ nghĩa cho `the one`: cuốn về chú gấu nhỏ. Dùng `the little bear` vì cả hai đều biết là chú gấu nào trong truyện."]],
["K","Mom, can you leave the light on?","Mẹ ơi, mẹ để đèn sáng được không?","leave + N + on/off",[
"`leave + vật + trạng thái` = để nguyên cái gì ở trạng thái nào: `leave the light on` (để đèn sáng), `leave the door open` (để cửa mở).",
"`on` = đang bật, `off` = tắt."]],
["M","I'll leave the night light on for you.","Mẹ để đèn ngủ cho con nhé.","I'll + V (hứa hẹn)",[
"`I'll` = `I will`, ở đây mang ý **hứa** làm gì cho ai.",
"`night light` = đèn ngủ (đèn nhỏ, mờ để qua đêm)."]],
["M","Good night. Sleep tight. I love you so much.","Chúc con ngủ ngon. Ngủ thật say nhé. Mẹ yêu con nhiều lắm.","Mệnh lệnh dạng lời chúc",[
"`Good night` chỉ dùng khi chào tạm biệt buổi tối hoặc trước khi ngủ. Gặp nhau buổi tối thì nói `Good evening`.",
"`Sleep tight` = ngủ thật ngon, thật say. Đây là câu chúc truyền thống, `tight` dùng như trạng từ.",
"`so much` đặt cuối câu để nhấn mạnh tình cảm."]],
["K","I love you too, Mom. Sweet dreams!","Con cũng yêu mẹ. Chúc mẹ mơ đẹp!","too (cũng, câu khẳng định)",[
"**`too` hay `either`?** Trong câu khẳng định dùng `too`: `I love you too`. Trong câu phủ định dùng `either`: `I don't like it either.`",
"`Sweet dreams!` = Chúc mơ đẹp, dạng rút gọn của `Have sweet dreams`."]]
]},
{id:"supermarket",g:"ngoai",t:"Thứ Bảy",en:"At the Supermarket",vi:"Đi siêu thị",sp:["M","K","C"],
scene:"Mẹ và con đi siêu thị mua đồ. Con đẩy xe, xin mua kem, rồi thanh toán ở quầy thu ngân.",
tip:"Trước khi đi, cùng con viết danh sách mua sắm bằng tiếng Anh. Ở siêu thị, để con tìm và đọc to từng món.",
vocab:[["shopping list","danh sách mua sắm"],["trolley / cart","xe đẩy"],["How much is...?","... giá bao nhiêu?"],["price tag","nhãn giá"],["cashier","thu ngân"],["our own bag","túi của mình"]],
L:[
["M","We need to buy some milk, eggs and bread.","Mình cần mua sữa, trứng và bánh mì.","need to + V + some + N",[
"`need to + V` = cần làm gì.",
"`some` đứng đầu danh sách áp dụng cho cả ba thứ. `milk`, `bread` không đếm được (không thêm `-s`); `eggs` đếm được nên thêm `-s`.",
"Muốn đếm bánh mì: `a loaf of bread` (một ổ), `a slice of bread` (một lát)."]],
["K","Can I push the trolley?","Con đẩy xe được không mẹ?","Can I + V + the + N?",[
"`trolley` (Anh) = `shopping cart` (Mỹ): xe đẩy hàng.",
"`push` = đẩy, `pull` = kéo."]],
["M","Okay, but walk slowly and be careful.","Được, nhưng đi chậm và cẩn thận nhé.","V + trạng từ + and + be + tính từ",[
"Hai mệnh lệnh nối bằng `and`: một cái dùng động từ thường (`walk slowly`), một cái dùng `be + tính từ` (`be careful`).",
"`slowly` (trạng từ) bổ nghĩa cho `walk`; `careful` (tính từ) đi sau `be`."]],
["K","Mom, can we buy some ice cream, please?","Mẹ ơi, mình mua kem được không ạ?","Can we + V + some + N?",[
"`ice cream` không đếm được khi nói chung (`some ice cream`). Khi nói từng que, từng cốc thì đếm được: `two ice creams`.",
"Dùng `some` trong câu xin, vì người hỏi mong được đồng ý."]],
["M","Just one box. We shouldn't eat too much sugar.","Một hộp thôi nhé. Mình không nên ăn quá nhiều đường.","shouldn't + V   |   too much + N không đếm được",[
"`shouldn't` = `should not` = không nên.",
"**`too much` hay `too many`?** `sugar` không đếm được nên dùng `too much`. Với danh từ đếm được: `too many sweets`.",
"`Just one box` là câu rút gọn của `You can have just one box`."]],
["K","How much is this one?","Hộp này bao nhiêu tiền ạ?","How much + is/are + N?",[
"Hỏi giá: `How much is` + vật số ít; `How much are` + vật số nhiều: `How much are these apples?`",
"`this one` = cái này (thay cho danh từ đã rõ)."]],
["M","It's forty thousand dong. Let's check the price tag.","Bốn mươi nghìn đồng. Mình xem nhãn giá nhé.","It's + số tiền",[
"Nói giá: `It's` + số + đơn vị tiền. `thousand` không thêm `-s` khi có số đứng trước: `forty thousand`, không nói `forty thousands`.",
"`price tag` = nhãn giá. `check` = kiểm tra, xem lại.",
"`forty` viết không có `u` (khác `four`, `fourteen`)."]],
["C","That's two hundred fifty thousand dong, please. Do you need a bag?","Tổng cộng hai trăm năm mươi nghìn đồng ạ. Chị có cần túi không?","That's + số tiền   |   Do you need + N?",[
"Thu ngân thường nói `That's...` hoặc `That'll be...` để báo tổng tiền.",
"Tiếng Anh-Mỹ hay bỏ `and` trong số (`two hundred fifty`), tiếng Anh-Anh hay giữ (`two hundred and fifty`). Cả hai đều đúng.",
"`hundred`, `thousand` không thêm `-s` khi có số đứng trước."]],
["M","No, thanks. We brought our own bag.","Không, cảm ơn em. Chị mang túi rồi.","S + V2 + our own + N",[
"`brought` là quá khứ của `bring` (bring → brought → brought). Phân biệt với `bought` (quá khứ của `buy`), hai từ rất dễ nhầm.",
"`our own bag` = túi của chính mình. `own` nhấn mạnh sở hữu, luôn đi sau tính từ sở hữu: `my own`, `your own`.",
"`No, thanks` là cách từ chối lịch sự."]]
]},

{id:"park",g:"ngoai",t:"Chiều CN",en:"At the Park",vi:"Đi chơi công viên",sp:["K","D"],
scene:"Con rủ bố ra công viên. Hai bố con chơi xích đu, cầu trượt và leo trèo.",
tip:"Ở sân chơi, dạy con các từ so sánh: higher, faster, bigger. Khen con bằng ‘You're so brave!’ khi con thử điều mới.",
vocab:[["swings","xích đu"],["slide","cầu trượt"],["hold on tight","bám chặt"],["take turns","lần lượt"],["by myself","tự mình"],["brave","dũng cảm"]],
L:[
["K","Dad, can we go to the park this afternoon?","Bố ơi, chiều nay mình đi công viên được không?","Can we + go to + the + N + thời gian?",[
"`go to the park` có `the` (khác với `go to school`, `go to bed`, `go home` không có `the`).",
"`this afternoon` = chiều nay, không có giới từ đứng trước. Không nói `in this afternoon`."]],
["D","Sure, if it doesn't rain.","Được chứ, nếu trời không mưa.","if + hiện tại đơn (cho tương lai)",[
"**Vì sao `if it doesn't rain` mà không phải `if it won't rain`?** Trong mệnh đề `if` nói về tương lai, tiếng Anh dùng **hiện tại đơn**, không dùng `will`.",
"`it` là chủ ngữ giả khi nói về thời tiết: `It rains`, `It's sunny`.",
"Câu đầy đủ: `Sure, we can go if it doesn't rain.`"]],
["K","I want to go on the swings!","Con muốn chơi xích đu!","go on + the + N (trò chơi)",[
"`go on the swings` = chơi xích đu. Với trò chơi ở công viên, sân chơi dùng `go on`: `go on the slide`, `go on a ride`.",
"`swings` số nhiều vì thường có một dãy xích đu."]],
["D","Hold on tight. Do you want me to push you?","Bám chặt vào nhé. Con có muốn bố đẩy không?","want + người + to + V",[
"`hold on tight` = bám chặt. `tight` ở đây dùng như trạng từ.",
"**Vì sao `want me to push` mà không phải `want that I push`?** Cấu trúc đúng là `want + người + to V`: `I want you to help me.` Tiếng Anh không dùng `want that...`."]],
["K","Higher, Dad! Push me higher!","Cao nữa bố ơi! Đẩy con cao hơn nữa!","tính từ/trạng từ ngắn + -er (so sánh hơn)",[
"`higher` là so sánh hơn của `high`: tính từ một âm tiết thêm `-er`: high → higher, fast → faster.",
"Câu cảm thán rút gọn `Higher, Dad!` rất tự nhiên khi chơi."]],
["D","Let's take turns on the slide. Wait for your turn.","Mình chơi cầu trượt lần lượt nhé. Đợi đến lượt con.","take turns   |   wait for + N",[
"`take turns` = thay phiên nhau, lần lượt.",
"**Vì sao `wait for` mà không phải `wait`?** Khi có tân ngữ (đợi cái gì, đợi ai) phải có `for`: `wait for me`, `wait for the bus`. Không nói `wait your turn` trong câu chuẩn (dù văn nói có gặp)."]],
["K","Look! I can climb to the top all by myself!","Bố nhìn này! Con tự leo lên tới đỉnh được!","can + V   |   by myself",[
"`can` = có khả năng làm gì.",
"`by myself` = tự mình, không cần ai giúp. `all` nhấn mạnh thêm. Tương tự: `by yourself`, `by himself`.",
"`climb` có `b` câm, đọc /klaɪm/."]],
["D","Wow, you're so brave! I'm proud of you.","Ồ, con dũng cảm quá! Bố tự hào về con.","You're so + tính từ",[
"`so + tính từ` = thật là, quá (cảm thán).",
"Khen vào phẩm chất cụ thể (`brave`, `kind`, `patient`) có ích cho trẻ hơn là chỉ nói `good`."]]
]},

{id:"restaurant",g:"ngoai",t:"Tối CN",en:"Eating Out",vi:"Đi ăn nhà hàng",sp:["W","D","K"],
scene:"Cả nhà đi ăn tối ở nhà hàng: nhận bàn, gọi món, gọi đồ uống và xin thanh toán.",
tip:"Ở nhà hàng thật, để con tự gọi món của mình bằng tiếng Anh với câu ‘I'd like..., please.’ Con sẽ rất tự hào.",
vocab:[["a table for three","bàn cho ba người"],["menu","thực đơn"],["order","gọi món"],["I'd like...","Tôi muốn..."],["fries","khoai tây chiên"],["the bill / the check","hóa đơn"]],
L:[
["W","Good evening. A table for three?","Chào buổi tối. Bàn cho ba người ạ?","A table for + số người?",[
"Câu rút gọn của `Would you like a table for three?`. Nhân viên nhà hàng thường nói ngắn gọn như vậy.",
"`Good evening` dùng để chào khi gặp nhau vào buổi tối (khác `Good night` là chào tạm biệt)."]],
["D","Yes, please. Can we sit by the window?","Vâng. Cho chúng tôi ngồi cạnh cửa sổ được không?","Can we + V + by + the + N?",[
"`by the window` = cạnh cửa sổ. `by` = sát bên.",
"Đáp lời mời, đồng ý: `Yes, please.`"]],
["W","Here's the menu. Are you ready to order?","Thực đơn đây ạ. Anh chị đã sẵn sàng gọi món chưa?","be ready to + V",[
"`be ready to + V` = sẵn sàng làm gì.",
"`order` = gọi món. Danh từ cũng là `order`: `Can I take your order?`"]],
["K","I'd like a cheeseburger and some fries, please.","Cháu muốn một bánh mì kẹp phô mai và ít khoai tây chiên ạ.","I'd like + N",[
"`I'd like` = `I would like`, cách gọi món **lịch sự** nhất.",
"**Vì sao không nói `I want`?** `I want a cheeseburger` đúng ngữ pháp nhưng nghe khá thẳng, hơi trống không khi nói với người phục vụ. Dạy con dùng `I'd like` từ nhỏ.",
"`fries` (Mỹ) = `chips` (Anh): khoai tây chiên."]],
["D","And I'll have the grilled fish.","Còn tôi lấy món cá nướng.","I'll have + the + N",[
"`I'll have...` là cách gọi món phổ biến thứ hai, nghĩa là ‘tôi sẽ lấy...’ (quyết định ngay lúc nói nên dùng `will`).",
"`the grilled fish` có `the` vì là món cụ thể trên thực đơn.",
"`grilled` = nướng trên vỉ (quá khứ phân từ của `grill` dùng như tính từ). Tương tự: `fried rice`, `boiled eggs`."]],
["W","Anything to drink?","Anh chị có dùng gì để uống không ạ?","Anything + to + V?",[
"Câu rút gọn của `Would you like anything to drink?`",
"`anything to drink` = thứ gì đó để uống. Cấu trúc `something/anything + to V`: `something to eat`, `nothing to do`."]],
["K","Can I have an orange juice, please?","Cho cháu một cốc nước cam ạ.","Can I have + a/an + N?",[
"**Vì sao `an` mà không phải `a`?** `orange` bắt đầu bằng **âm** nguyên âm /ɒ/ nên dùng `an`. Quy tắc dựa trên âm đọc, không phải chữ cái: `an hour` (h câm), `a university` (âm /j/).",
"`juice` vốn không đếm được, nhưng khi gọi đồ uống, người ta coi như một cốc: `an orange juice`, `two coffees`."]],
["D","Excuse me, could we have the bill, please?","Xin lỗi, cho chúng tôi thanh toán nhé.","Could we have + the + N?",[
"`the bill` (Anh) = `the check` (Mỹ): hóa đơn.",
"`Excuse me` để gọi nhân viên phục vụ một cách lịch sự, thay vì vẫy tay hay gọi to."]]
]},

{id:"weather",g:"ngoai",t:"Mỗi ngày",en:"What's the Weather Like?",vi:"Nói về thời tiết",sp:["K","D"],
scene:"Sáng nắng, chiều mưa to rồi có cầu vồng. Hai bố con nói chuyện về thời tiết.",
tip:"Mỗi sáng hỏi con ‘What's the weather like today?’ và để con nhìn ra cửa sổ trả lời. Đây là thói quen nhỏ mà rất hiệu quả.",
vocab:[["sunny","nắng"],["rain","mưa"],["umbrella","ô"],["raining cats and dogs","mưa như trút"],["until","cho đến khi"],["rainbow","cầu vồng"]],
L:[
["K","What's the weather like today?","Hôm nay thời tiết thế nào hả bố?","What + is + N + like?",[
"`What's... like?` hỏi về **đặc điểm, tính chất** của cái gì: `What's your teacher like?` (Cô giáo con thế nào?).",
"**Chú ý:** `like` ở đây là giới từ nghĩa là ‘giống như’, không phải động từ ‘thích’. Không trả lời `I like...`.",
"Câu hỏi khác cùng nghĩa: `How's the weather today?`"]],
["D","It's sunny, but it might rain this afternoon.","Trời nắng, nhưng chiều nay có thể mưa đấy.","It's + tính từ thời tiết   |   it might + V",[
