"`That's it` = đúng rồi, chính nó.",
"`turn it on`: đại từ `it` đứng giữa cụm động từ."]],
["K","It works! You can fix anything, Dad!","Chạy rồi! Bố sửa được mọi thứ!","You can + V + anything",[
"`anything` trong câu khẳng định = bất cứ thứ gì.",
"`can` ở đây chỉ khả năng."]]
]},

{id:"baby",g:"nha",t:"Mỗi ngày",en:"Helping with the Baby",vi:"Giúp mẹ chăm em bé",sp:["K","M"],
scene:"Em bé khóc vì đói. Con lấy bình sữa giúp mẹ rồi được bế em.",
tip:"Phân biệt bring và take: bring là mang lại phía người nói, take là mang đi chỗ khác.",
vocab:[["crying","đang khóc"],["hungry","đói"],["bottle","bình sữa"],["hold","bế, cầm"],["gentle","nhẹ nhàng"],["smile at","mỉm cười với"]],
L:[
["K","Mom, the baby is crying.","Mẹ ơi, em bé đang khóc.","the + N + is + V-ing",[
"Hiện tại tiếp diễn cho việc đang xảy ra ngay lúc nói."]],
["M","He's probably hungry. Can you bring me his bottle?","Chắc em đói. Con mang bình sữa lại cho mẹ nhé?","bring + sb + sth",[
"`probably` = có lẽ, khá chắc chắn.",
"**Vì sao `bring` mà không phải `take`?** `bring` = mang lại chỗ người nói (về phía mẹ); `take` = mang đi chỗ khác."]],
["K","Here it is. Can I hold him?","Đây ạ. Con bế em được không?","Here it is. / Can I + V + him?",[
"`Here it is` = nó đây (khi tìm thấy hoặc đưa đồ). `Here you are` nhấn vào người nhận.",
"`hold` = bế, cầm."]],
["M","Yes, sit down first and support his head.","Được, ngồi xuống trước đã rồi đỡ đầu em.","V + first + and + V",[
"`first` = trước đã.",
"`support` = đỡ, giữ."]],
["K","He's so small and soft.","Em bé nhỏ và mềm quá.","He's + so + tính từ + and + tính từ",[
"Nối hai tính từ bằng `and`: `small and soft`."]],
["M","Be gentle with him.","Nhẹ tay với em nhé.","Be + tính từ + with + sb",[
"Mệnh lệnh với tính từ: `Be gentle`, `Be careful`.",
"`gentle` là tính từ; trạng từ là `gently`: `Hold him gently.`"]],
["K","Look, he's smiling at me!","Mẹ nhìn kìa, em đang cười với con!","smile at + sb",[
"`smile at` + người = cười với ai. Không nói `smile to me`."]],
["M","He loves you already.","Em đã yêu con rồi đấy.","S + V + O + already",[
"`already` = đã rồi (sớm hơn mong đợi), thường đứng cuối câu hoặc trước động từ chính."]]
]},

{id:"hot-day",g:"nha",t:"Mùa hè",en:"It's So Hot!",vi:"Trời nóng quá",sp:["K","D"],
scene:"Một ngày hè oi bức, con đổ mồ hôi. Bố bật điều hòa và nhắc con uống nhiều nước.",
tip:"Dùng tình huống này để dạy cặp remember to V (nhớ phải làm) và remember V-ing (nhớ đã làm).",
vocab:[["sweat","đổ mồ hôi"],["air conditioner","điều hòa"],["cool","mát"],["take a shower","tắm vòi sen"],["light","mỏng nhẹ (quần áo)"],["lots of","nhiều"]],
L:[
["K","It's so hot today. I'm sweating.","Hôm nay nóng quá. Con đổ mồ hôi rồi.","It's + so + tính từ. / I'm + V-ing",[
"`sweat` = đổ mồ hôi. Viết `sweating`, không gấp đôi `t` vì trước `t` có hai nguyên âm `ea`."]],
["D","Let's turn on the air conditioner.","Mình bật điều hòa lên nhé.","Let's + turn on + the + N",[
"`air conditioner` = điều hòa, nói tắt là `AC`.",
"`turn on` = bật."]],
["K","Can I have some cold water, please?","Cho con xin cốc nước lạnh được không ạ?","Can I have + some + N?",[
"**Vì sao dùng `some` trong câu hỏi?** Khi xin hoặc mời thì vẫn dùng `some`. `any` dùng cho câu hỏi thông thường: `Is there any water?`"]],
["D","Here you go. Drink slowly.","Đây con. Uống từ từ thôi.","Here you go. / V + trạng từ",[
"`Here you go` = `Here you are` = đây (khi đưa đồ).",
"`slowly` là trạng từ bổ nghĩa cho `drink`."]],
["K","Can I take a cool shower?","Con tắm nước mát được không ạ?","Can I + take a shower?",[
"`take a shower` = tắm vòi sen; `take a bath` = tắm bồn.",
"`cool` = mát (dễ chịu); `cold` = lạnh."]],
["D","Good idea. And wear something light.","Ý hay đấy. Rồi mặc đồ gì mỏng mát thôi.","something + tính từ",[
"**Trật tự từ:** tính từ đứng **sau** `something`, `anything`, `nothing`: `something light`, không nói `light something`.",
"`light` ở đây = mỏng, nhẹ."]],
["K","I feel much better now.","Giờ con thấy dễ chịu hơn nhiều rồi.","feel + much + so sánh hơn",[
"`feel` + tính từ. `much` nhấn mạnh so sánh hơn: `much better`."]],
["D","Remember to drink lots of water in summer.","Nhớ uống thật nhiều nước vào mùa hè nhé.","remember + to V",[
"`remember + to V` = nhớ phải làm (việc chưa làm). `remember + V-ing` = nhớ là đã làm: `I remember drinking it.`",
"`lots of` dùng được với cả đếm được và không đếm được.",
"Mùa đi với `in`: `in summer`, `in winter`."]]
]},

{id:"weekend-plan",g:"nha",t:"Tối thứ Sáu",en:"Planning the Weekend",vi:"Lên kế hoạch cuối tuần",sp:["D","K","M"],
scene:"Tối thứ Sáu, cả nhà bàn xem cuối tuần làm gì, tùy theo dự báo thời tiết.",
tip:"Đây là bài rất hay để so sánh ba cách nói về tương lai: will, be going to và hiện tại tiếp diễn.",
vocab:[["this weekend","cuối tuần này"],["go camping","đi cắm trại"],["How about...?","thế còn... thì sao?"],["sunny","nắng"],["calendar","lịch"],["I can't wait","háo hức quá"]],
L:[
["D","What should we do this weekend?","Cuối tuần này mình làm gì nhỉ?","What should we + V + this weekend?",[
"Trước `this`, `next`, `last` **không** dùng giới từ: `this weekend`, không nói `on this weekend`."]],
["K","Can we go camping?","Mình đi cắm trại được không ạ?","go + V-ing",[
"`go + V-ing` cho hoạt động giải trí: `go camping`, `go swimming`, `go shopping`."]],
["M","It's going to rain on Saturday.","Thứ Bảy trời sẽ mưa đấy.","be going to + V (dự đoán có căn cứ)",[
"`be going to` dùng để dự đoán khi **có dấu hiệu**, ví dụ dự báo thời tiết.",
"Thứ trong tuần đi với `on`: `on Saturday`."]],
["D","How about Sunday? The weather will be sunny.","Thế Chủ Nhật thì sao? Trời sẽ nắng.","How about + N? / will + be + tính từ",[
"`How about + N/V-ing?` = thế còn... thì sao? dùng để gợi ý.",
"`will` dùng cho dự đoán chung về tương lai."]],
["K","Yes! We're going camping on Sunday!","Hay quá! Chủ Nhật mình đi cắm trại!","Hiện tại tiếp diễn = kế hoạch đã định",[
"**Hiện tại tiếp diễn** có thể nói về **kế hoạch đã sắp xếp** trong tương lai gần: `We're going camping on Sunday.`"]],
["M","Then on Saturday we can visit Grandma.","Vậy thứ Bảy mình đi thăm bà.","Then + on + ngày + S + can + V",[
"`Then` đầu câu = vậy thì.",
"`visit` + người/nơi, không cần giới từ: `visit Grandma`."]],
["D","Great plan. Let's write it on the calendar.","Kế hoạch hay đấy. Ghi lên lịch thôi.","Let's + V + it + on + the + N",[
"`on the calendar` = trên lịch. Có thể nói `put it on the calendar`."]],
["K","I can't wait!","Con háo hức quá!","I can't wait!",[
"`I can't wait!` = không chờ nổi nữa, rất háo hức. Muốn nói rõ: `I can't wait to go camping!` (`can't wait to + V`)."]]
]},
{id:"zoo",g:"ngoai",t:"Cuối tuần",en:"At the Zoo",vi:"Đi sở thú",sp:["K","D","O"],
scene:"Bố con đi sở thú, ngắm voi, muốn cho khỉ ăn nhưng bị nhân viên nhắc, rồi đi xem sư tử.",
tip:"Ở sở thú, chơi trò so sánh: ‘Which is bigger, the elephant or the lion?’. Con luyện so sánh hơn và so sánh nhất rất tự nhiên.",
vocab:[["elephant","con voi"],["the biggest","to nhất"],["feed","cho ăn"],["Why not?","Sao lại không?"],["make them sick","làm chúng bị ốm"],["scared","sợ"]],
L:[
["K","Look, Dad! The elephant is so big!","Bố nhìn kìa! Con voi to quá!","The + N + is + so + tính từ",[
"`so big` = to quá (cảm thán).",
"`The elephant`: dùng `the` vì là con voi cụ thể đang đứng trước mặt."]],
["D","Yes, elephants are the biggest animals on land.","Ừ, voi là loài vật lớn nhất trên cạn đấy.","the + tính từ-est + N",[
"So sánh nhất của tính từ ngắn: `the` + tính từ + `-est`. `big` → `the biggest` (gấp đôi `g`).",
"`elephants` không có `the` vì nói về loài voi nói chung.",
"`on land` = trên cạn; `in the sea` = dưới biển."]],
["K","Can we feed the monkeys?","Mình cho khỉ ăn được không bố?","Can we + V + the + N?",[
"`feed` = cho ăn. `the monkeys` = những con khỉ ở đây.",
"`monkey` số nhiều chỉ thêm `-s` (vì trước `y` là nguyên âm `e`). So sánh: `baby` → `babies`."]],
["O","Sorry, you can't feed the animals here.","Xin lỗi, ở đây không được cho thú ăn.","S + can't + V (không được phép)",[
"`can't` ở đây mang nghĩa **không được phép**, không phải không có khả năng.",
"Nói `Sorry` trước khi từ chối giúp câu nhẹ nhàng hơn."]],
["K","Why not?","Sao lại không ạ?","Why not?",[
"`Why not?` = Tại sao lại không? Câu rút gọn của `Why can't we feed them?`",
"Cùng câu này còn có nghĩa ‘Sao không chứ, được thôi!’ khi đồng ý một đề nghị."]],
["O","Human food can make them sick.","Đồ ăn của người có thể làm chúng bị ốm.","make + O + tính từ",[
"`make + tân ngữ + tính từ` = khiến ai/cái gì trở nên thế nào: `make them sick`, `make me happy`.",
"`can` ở đây = có thể (khả năng xảy ra)."]],
["D","Let's go and see the lions next.","Tiếp theo mình đi xem sư tử nhé.","Let's go and + V + next",[
"`go and see` = đi xem. Văn nói hay nối hai động từ bằng `and`.",
"`next` cuối câu = tiếp theo."]],
["K","I'm a little scared, but I want to see them.","Con hơi sợ, nhưng con muốn xem.","a little + tính từ, but + mệnh đề",[
"**`scared` hay `scary`?** `scared` = cảm thấy sợ (người). `scary` = đáng sợ (sự vật): `Lions are scary.`",
"`but` nối hai ý trái ngược."]]
]},

{id:"cinema",g:"ngoai",t:"Cuối tuần",en:"At the Cinema",vi:"Đi xem phim",sp:["M","O","K"],
scene:"Mẹ mua vé phim hoạt hình, chọn chỗ ngồi, mua bỏng ngô, xem phim xong hai mẹ con nói chuyện về phim.",
tip:"Sau mỗi bộ phim, hỏi con ‘Which part did you like best?’. Con sẽ phải kể lại bằng tiếng Anh, dù chỉ vài từ.",
vocab:[["ticket","vé"],["in the middle","ở giữa"],["popcorn","bỏng ngô"],["share","chia nhau"],["be quiet","giữ yên lặng"],["like best","thích nhất"]],
L:[
["M","Two tickets for the cartoon at three o'clock, please.","Cho tôi hai vé phim hoạt hình suất ba giờ.","số + tickets + for + phim + at + giờ",[
"Khi mua vé, chỉ cần nói ngắn: số lượng + `tickets for` + phim + giờ + `please`.",
"`cartoon` = phim hoạt hình."]],
["O","Sure. Where would you like to sit?","Vâng. Chị muốn ngồi ở đâu ạ?","Where + would you like + to V?",[
"`Would you like to + V?` hỏi ý muốn một cách lịch sự.",
"`sit` = ngồi; `seat` = cái ghế, chỗ ngồi."]],
["M","In the middle, please.","Ở giữa nhé.","In the middle",[
"`in the middle` = ở giữa. Các vị trí khác: `at the front` (phía trước), `at the back` (phía sau).",
"Câu rút gọn của `We'd like to sit in the middle.`"]],
["K","Mom, can we get some popcorn?","Mẹ ơi, mình mua bỏng ngô được không?","Can we get + some + N?",[
"`popcorn` không đếm được → `some popcorn`.",
"`get` = mua, lấy (văn nói)."]],
["M","Yes, a small one to share.","Được, một hộp nhỏ để chia nhau nhé.","N + to V (mục đích)",[
"`to share` = để chia nhau. `to + V` sau danh từ chỉ **mục đích**.",
"`a small one` = một hộp nhỏ (`one` thay cho hộp bỏng ngô)."]],
["M","Shh, the movie is starting. We need to be quiet now.","Suỵt, phim bắt đầu rồi. Giờ mình phải giữ yên lặng.","need to be + tính từ",[
"`is starting` = đang bắt đầu (ngay lúc này).",
"`movie` (Mỹ) = `film` (Anh). `be quiet` = giữ yên lặng."]],
["K","That was so funny! I loved it.","Phim buồn cười quá! Con thích lắm.","That was + tính từ   |   I loved it",[
"Dùng quá khứ (`was`, `loved`) vì phim vừa kết thúc.",
"`funny` = buồn cười. Phân biệt `fun` = vui (hoạt động vui): `The trip was fun.`"]],
["M","Me too. Which part did you like best?","Mẹ cũng thế. Con thích đoạn nào nhất?","Which + N + did you like best?",[
"`Me too` = mẹ cũng vậy.",
"`like best` = thích nhất. `best` là so sánh nhất của `well`."]]
]},

{id:"haircut",g:"ngoai",t:"Thứ Bảy",en:"Getting a Haircut",vi:"Đi cắt tóc",sp:["H","M","K"],
scene:"Ở tiệm cắt tóc, mẹ dặn cắt ngắn hơn một chút, thợ nhắc con ngồi yên, con thích kiểu tóc mới.",
tip:"Đóng vai tiệm cắt tóc ở nhà với cái lược và bình xịt nước. Con làm thợ, bố mẹ làm khách, rồi đổi vai.",
vocab:[["haircut","việc cắt tóc"],["shorter","ngắn hơn"],["sit still","ngồi yên"],["tickle","buồn, nhột"],["spray","xịt"],["cool","ngầu"]],
L:[
["H","Hello! How would you like your hair today?","Chào cháu! Hôm nay cắt tóc kiểu gì nào?","How would you like + N?",[
"`How would you like your hair?` = Bạn muốn tóc thế nào? Câu quen thuộc ở tiệm tóc.",
"Cùng mẫu trong nhà hàng: `How would you like your steak?`"]],
["M","Just a little shorter, please.","Cắt ngắn đi một chút thôi.","a little + so sánh hơn",[
"`a little` + so sánh hơn = hơn một chút: `a little shorter`, `a little bigger`.",
"`short` → `shorter` (tính từ ngắn thêm `-er`)."]],
["H","Sit still, please. Don't move your head.","Cháu ngồi yên nhé. Đừng cử động đầu.","Sit still   |   Don't + V",[
"`sit still` = ngồi yên. `still` ở đây là tính từ nghĩa là yên, không động đậy.",
"`move` = cử động, di chuyển."]],
["K","It tickles!","Nhột quá!","It + tickles",[
"`tickle` = làm nhột, gây buồn buồn. `It tickles!` = nhột quá!",
"Thêm `-s` vì chủ ngữ `It`."]],
["H","Okay, close your eyes. I'm going to spray some water.","Được rồi, nhắm mắt lại. Chú xịt nước nhé.","be going to + V",[
"`be going to` vì thợ đã cầm bình xịt, việc sắp xảy ra ngay.",
"`spray` = xịt."]],
["H","All done! Do you like it?","Xong rồi! Cháu có thích không?","Do you like + it?",[
"`All done!` = xong hết rồi.",
"`it` thay cho kiểu tóc mới."]],
["K","Yes! I look so cool!","Có ạ! Trông con ngầu quá!","look + so + tính từ",[
"`cool` trong văn nói = ngầu, tuyệt. (Nghĩa gốc: mát.)",
"Lại là `look + tính từ`."]],
["M","Thank you. How much is it?","Cảm ơn anh. Hết bao nhiêu tiền ạ?","How much + is it?",[
"`How much is it?` = Bao nhiêu tiền?",
"Hỏi giá dịch vụ hoặc đồ vật đều dùng được."]]
]},

{id:"clothes-shop",g:"ngoai",t:"Cuối tuần",en:"Buying New Clothes",vi:"Mua quần áo mới",sp:["A","M","K"],
scene:"Mẹ đưa con đi mua áo khoác. Con mặc thử áo quá rộng, đổi cỡ nhỏ hơn thì vừa.",
tip:"Khi thử đồ, để con tự nói ‘It's too big’ hoặc ‘It fits!’. Mua đồ thật là bài học tiếng Anh dễ nhớ nhất.",
vocab:[["Can I help you?","Tôi giúp gì được ạ?"],["look for","tìm"],["size","cỡ"],["try on","mặc thử"],["fit","vừa"],["We'll take it","chúng tôi lấy cái này"]],
L:[
["A","Hi! Can I help you?","Chào chị! Em giúp gì được ạ?","Can I help you?",[
"Câu mở đầu quen thuộc của người bán hàng. Muốn tự xem thì đáp: `No, thanks. I'm just looking.`",
"`Can I` ở đây là **đề nghị giúp**, không phải xin phép."]],
["M","Yes, we're looking for a jacket for my son.","Có, chị đang tìm một cái áo khoác cho con trai.","be looking for + N + for + người",[
"`be looking for` = đang tìm.",
"Hai chữ `for` khác nghĩa: `look for` (tìm) và `for my son` (cho con trai)."]],
["A","What size is he?","Bé mặc cỡ nào ạ?","What size + is + S?",[
"`What size` = cỡ nào. Có thể hỏi `What size does he wear?`",
"Cỡ áo: `small`, `medium`, `large`."]],
["M","I'm not sure. Can he try this one on?","Chị không chắc. Cho bé mặc thử cái này được không?","try + N + on",[
"`try on` = mặc thử. Với `this one`, có thể đặt giữa: `try this one on`.",
"`I'm not sure` = tôi không chắc."]],
["K","Mom, it's too big. The sleeves are too long.","Mẹ ơi, áo rộng quá. Tay áo dài quá.","too + tính từ",[
"`too big` = to quá, rộng quá (không mặc được). Đây là nghĩa tiêu cực của `too`.",
"`sleeves` = tay áo, số nhiều `are`."]],
["A","Here's a smaller size. Try this one.","Đây là cỡ nhỏ hơn. Bé thử cái này nhé.","a + so sánh hơn + N",[
"`smaller` = nhỏ hơn. `a smaller size` = một cỡ nhỏ hơn.",
"`Here's` = `Here is`, dùng khi đưa đồ."]],
["K","This one fits perfectly!","Cái này vừa khít luôn!","N + fits + trạng từ",[
"**`fit` hay `suit`?** `fit` = vừa **kích cỡ**. `suit` = **hợp** về kiểu dáng, màu sắc: `Blue suits you.`",
"`perfectly` = hoàn hảo (trạng từ bổ nghĩa cho `fits`)."]],
["M","Great. We'll take it.","Tốt quá. Chị lấy cái này.","We'll take it",[
"`I'll take it` / `We'll take it` = tôi mua cái này. Câu chốt khi mua hàng.",
"`will` vì quyết định ngay lúc nói."]]
]},

{id:"swimming",g:"ngoai",t:"Chủ Nhật",en:"Swimming Lesson",vi:"Học bơi",sp:["Q","K","D"],
scene:"Thầy dạy bơi hướng dẫn con xuống nước, con sợ lúc đầu rồi bơi được, bố đứng xem và cổ vũ.",
tip:"Cổ vũ con bằng tiếng Anh khi tập thể thao: ‘You can do it!’, ‘Keep going!’, ‘Well done!’.",
vocab:[["goggles","kính bơi"],["deep","sâu"],["right here","ngay đây"],["kick","đạp chân"],["do well","làm tốt"],["float","phao"]],
L:[
["Q","Put on your goggles and get into the water slowly.","Đeo kính bơi vào và từ từ xuống nước nhé.","Put on + N + and + get into + the + N",[
"`goggles` luôn số nhiều (giống `glasses`).",
"`get into the water` = xuống nước. `into` chỉ chuyển động từ ngoài vào trong."]],
["K","I'm afraid. The water is deep.","Con sợ. Nước sâu quá.","I'm + afraid   |   N + is + deep",[
"`afraid` chỉ đứng sau `be`. Muốn nói sợ cái gì: `afraid of + N`: `I'm afraid of deep water.`",
"`deep` = sâu; ngược lại `shallow` = nông."]],
["Q","Don't worry. I'm right here with you.","Đừng lo. Thầy ở ngay đây với con.","right + here",[
"`right here` = ngay đây. `right` nhấn mạnh vị trí: `right now` (ngay bây giờ), `right there` (ngay đó)."]],
["Q","Kick your legs and move your arms like this.","Đạp chân và quạt tay như thế này.","V + your + N + like this",[
"`like this` = như thế này (vừa nói vừa làm mẫu).",
"Bộ phận cơ thể luôn có `your`: `your legs`, `your arms`."]],
["K","Look, Dad! I'm swimming!","Bố nhìn kìa! Con bơi được rồi!","I'm + V-ing",[
"Hiện tại tiếp diễn: con đang bơi ngay lúc này.",
"`swimming`: gấp đôi `m` khi thêm `-ing`."]],
["D","Amazing! You're doing really well.","Tuyệt quá! Con bơi giỏi lắm.","be doing + well",[
"`You're doing well` = con đang làm tốt lắm. Dùng `well` (trạng từ), không dùng `good`.",
"`really` nhấn mạnh."]],
["K","Can I try without the float?","Con thử không cần phao được không ạ?","try + without + N",[
"`without` = không có. Sau `without` là danh từ hoặc `V-ing`.",
"`float` = phao."]],
["Q","Not today. Maybe next week.","Hôm nay chưa được. Có lẽ tuần sau nhé.","Not + thời gian",[
"`Not today` = hôm nay thì không. Cách từ chối nhẹ nhàng.",
"`next week` không có giới từ."]]
]},

{id:"street-safety",g:"ngoai",t:"Mỗi ngày",en:"Crossing the Street",vi:"Qua đường an toàn",sp:["D","K"],
scene:"Bố dạy con nắm tay khi qua đường, đợi đèn xanh, nhìn hai bên và không chạy.",
tip:"Mỗi lần qua đường thật, cùng con nói to các bước bằng tiếng Anh: Stop, look left, look right, walk.",
vocab:[["cross the street","qua đường"],["traffic light","đèn giao thông"],["the green man","đèn hình người xanh"],["look left and right","nhìn hai bên"],["safe","an toàn"],["never","không bao giờ"]],
L:[
["D","Hold my hand when we cross the street.","Nắm tay bố khi mình qua đường nhé.","V + ... + when + S + V (hiện tại)",[
"`when` + hiện tại đơn, dù đang nói về việc sắp làm.",
"`cross the street` = qua đường. `street` (đường phố) = `road`."]],
["K","Why do we have to stop here?","Sao mình phải dừng ở đây hả bố?","Why + do + S + have to + V?",[
"`have to` = phải (do quy định bên ngoài). Câu hỏi: `Do we have to...?`"]],
["D","Because the light is red. We must wait for the green man.","Vì đèn đang đỏ. Mình phải đợi đèn hình người màu xanh.","Because + mệnh đề   |   must + V",[
"`Because` trả lời cho câu hỏi `Why`.",
"`must` dùng cho **luật lệ**, điều bắt buộc mạnh.",
"`the green man` = đèn tín hiệu hình người đi bộ màu xanh (cách nói ở Anh)."]],
["K","Now it's green! Can we go?","Giờ xanh rồi! Mình đi được chưa?","Now + it's + màu",[
"`it` thay cho đèn. Màu sắc là tính từ: `It's green.`"]],
["D","Look left and right first. Is it safe?","Nhìn bên trái và bên phải trước đã. Có an toàn không?","Look + left and right + first",[
"`left and right` = trái và phải. Ở Việt Nam xe đi bên phải nên nhìn trái trước.",
"`safe` = an toàn; `dangerous` = nguy hiểm."]],
["K","No cars are coming. It's safe now.","Không có xe nào đang tới. Giờ an toàn rồi.","No + N số nhiều + are + V-ing",[
"`No + danh từ` = không có cái nào: `No cars are coming.`",
"Có thể nói: `There are no cars coming.`"]],
["D","Good. Always walk, never run across the road.","Tốt. Luôn đi bộ, đừng bao giờ chạy qua đường.","Always + V   |   never + V",[
"`Always` và `never` đứng đầu câu mệnh lệnh để thành quy tắc.",
"`run across` = chạy băng qua."]],
["K","And I should never play near the road.","Và con không bao giờ được chơi gần đường.","should + never + V",[
"`should never` = không bao giờ nên.",
"`near the road` = gần đường."]]
]},

{id:"tet",g:"ngoai",t:"Tháng Giêng",en:"Lunar New Year",vi:"Ngày Tết",sp:["M","K","G"],
scene:"Cả nhà chuẩn bị Tết, trang trí cây đào. Con chúc Tết bà và được bà lì xì.",
tip:"Dạy con một câu chúc Tết bằng tiếng Anh để chúc ông bà. Cả nhà sẽ rất vui và con có động lực học.",
vocab:[["Lunar New Year","Tết Nguyên đán"],["decorate","trang trí"],["peach tree","cây đào"],["good health","sức khỏe tốt"],["lucky money","tiền lì xì"],["piggy bank","heo đất"]],
L:[
["M","Tet is coming! Let's clean the house and buy some flowers.","Sắp Tết rồi! Mình dọn nhà và mua hoa nhé.","N + is coming",[
"`is coming` = sắp đến. Hiện tại tiếp diễn chỉ điều sắp xảy ra.",
"Tết có thể gọi là `Tet` hoặc `Lunar New Year`."]],
["K","Can I help decorate the peach tree?","Con giúp trang trí cây đào được không?","help + V (nguyên mẫu)",[
"`help + V` không cần `to`: `help decorate`.",
"`peach tree` = cây đào; `kumquat tree` = cây quất."]],
["G","Happy New Year, my dear! I wish you good health.","Chúc mừng năm mới cháu yêu! Bà chúc cháu mạnh khỏe.","wish + người + điều chúc",[
"**`I wish you...` khác `I wish...`:** `wish + người + danh từ` là **lời chúc**: `I wish you good health.` Còn `I wish + mệnh đề` là ước điều không có thật (như ở chủ đề sinh nhật).",
"`health` không đếm được."]],
["K","Happy New Year, Grandma! I wish you a long and happy life.","Chúc mừng năm mới bà! Cháu chúc bà sống lâu và hạnh phúc.","wish + you + a + tính từ + and + tính từ + N",[
"Hai tính từ nối bằng `and` đứng trước danh từ: `a long and happy life`.",
"`life` đếm được ở đây vì nói về một cuộc đời."]],
["G","Here's some lucky money for you.","Đây là tiền lì xì cho cháu.","Here's + some + N không đếm được",[
"`money` **không đếm được**: `some money`, không nói `a money` hay `moneys`.",
"`lucky money` = tiền lì xì (tiền may mắn)."]],
["K","Thank you, Grandma! I'll save it in my piggy bank.","Cháu cảm ơn bà! Cháu sẽ bỏ vào heo đất.","I'll + V + it",[
"`it` thay cho `money` (không đếm được dùng `it`).",
"`save` = để dành, tiết kiệm."]],
["M","What do you say when you get lucky money?","Khi nhận lì xì con nói gì nào?","What + do + you + V + when + S + V?",[
"Hiện tại đơn vì đây là **thói quen, quy tắc** mỗi năm.",
"`get` = nhận được."]],
["K","I say thank you and take it with both hands.","Con nói cảm ơn và nhận bằng hai tay ạ.","S + V + and + V + with + both hands",[
"`say thank you` = nói lời cảm ơn.",
"`with both hands` = bằng cả hai tay, cách nhận đồ lễ phép của người Việt."]]
]},

{id:"packing",g:"dulich",t:"Trước chuyến đi",en:"Packing for a Trip",vi:"Xếp vali đi du lịch",sp:["M","K"],
scene:"Thứ Bảy cả nhà đi biển. Mẹ và con cùng xếp vali, đếm quần áo và kiểm tra vali có nặng không.",
tip:"Để con tự viết danh sách đồ cần mang bằng tiếng Anh, rồi đọc to từng món khi bỏ vào vali.",
vocab:[["pack","xếp đồ"],["suitcase","vali"],["pair of shorts","cái quần đùi"],["What else?","còn gì nữa?"],["favorite","yêu thích"],["heavy","nặng"]],
L:[
["M","We're going to the beach on Saturday. Let's pack our suitcase.","Thứ Bảy mình đi biển. Xếp vali thôi.","be going to + nơi + on + thứ",[
"`We're going to the beach` = hiện tại tiếp diễn cho kế hoạch đã định. Ở đây `going` là động từ ‘đi’, không phải cấu trúc `be going to + V`.",
"Thứ trong tuần đi với `on`: `on Saturday`, `on Monday`."]],
["K","How many T-shirts should I bring?","Con nên mang bao nhiêu áo phông ạ?","How many + N số nhiều + should I + V?",[
"`How many` vì `T-shirts` đếm được.",
"`bring` = mang theo."]],
["M","Bring four T-shirts and two pairs of shorts.","Mang bốn áo phông và hai cái quần đùi.","số + pairs of + N",[
"`shorts` (quần đùi) luôn số nhiều. Muốn đếm phải dùng `a pair of shorts`, `two pairs of shorts`.",
"Cùng kiểu: `a pair of pants`, `a pair of glasses`, `a pair of shoes`."]],
["K","Don't forget my swimsuit and my hat!","Đừng quên đồ bơi và mũ của con nhé!","Don't forget + N",[
"Con nhắc lại mẹ bằng đúng câu mẹ hay nhắc con.",
"`hat` = mũ có vành; `cap` = mũ lưỡi trai."]],
["M","Good thinking. What else do we need?","Con nghĩ chu đáo đấy. Mình còn cần gì nữa?","What else + do + S + V?",[
"`Good thinking` = nghĩ hay đấy, chu đáo đấy.",
"`What else` = còn gì nữa. `else` đứng ngay sau từ để hỏi: `who else`, `where else`."]],
["K","Sunscreen, a toothbrush and my favorite book.","Kem chống nắng, bàn chải đánh răng và cuốn sách con thích nhất.","N, a + N + and + my + tính từ + N",[
"`sunscreen` không đếm được nên không có `a`; `toothbrush` đếm được nên có `a`.",
"`favorite` (Mỹ) = `favourite` (Anh): yêu thích nhất."]],
["M","Is your suitcase too heavy?","Vali của con có nặng quá không?","Is + N + too + tính từ?",[
"`too heavy` = nặng quá (đến mức khó mang).",
"`heavy` ↔ `light` (nhẹ)."]],
["K","No, I can carry it by myself.","Không ạ, con tự xách được.","can + V + it + by myself",[
"`carry` = mang, xách.",
"`by myself` = tự mình."]]
]},

{id:"directions",g:"dulich",t:"Kỳ nghỉ",en:"Asking for Directions",vi:"Hỏi đường",sp:["D","L","K"],
scene:"Đi du lịch, bố hỏi đường đến chợ đêm. Người đi đường chỉ đường, con lo bị lạc.",
tip:"Ở nhà, giấu đồ rồi chỉ đường cho con bằng tiếng Anh: go straight, turn left, turn right. Con sẽ nhớ hướng đi rất nhanh.",
vocab:[["How do I get to...?","Đi đến... thế nào?"],["go straight","đi thẳng"],["turn left","rẽ trái"],["traffic lights","đèn giao thông"],["far from","xa"],["almost there","sắp tới nơi"]],
L:[
["D","Excuse me, how do I get to the night market?","Xin lỗi, cho tôi hỏi đường đến chợ đêm đi thế nào?","How do I get to + nơi?",[
"`How do I get to...?` = Làm sao để đến...? Đây là câu hỏi đường phổ biến nhất.",
"`Excuse me` mở đầu để bắt chuyện lịch sự với người lạ."]],
["L","Go straight ahead, then turn left at the traffic lights.","Anh đi thẳng, rồi rẽ trái ở chỗ đèn giao thông.","Go straight ahead, then turn + left/right + at + N",[
"Chỉ đường dùng câu mệnh lệnh: `Go straight`, `Turn left`, `Turn right`.",
"`at the traffic lights` = ở chỗ đèn giao thông. Điểm cụ thể dùng `at`."]],
["D","Is it far from here?","Từ đây đến đó có xa không?","Is it far from + nơi?",[
"`far from` = xa so với đâu. `far` thường dùng trong câu hỏi và phủ định; câu khẳng định hay nói `a long way`."]],
["L","No, it's about a five-minute walk.","Không, đi bộ khoảng năm phút thôi.","a + số-N (tính từ ghép) + N",[
"**Vì sao `five-minute` không có `-s`?** Khi số + danh từ ghép lại thành **tính từ** đứng trước danh từ (có gạch nối) thì danh từ không thêm `-s`: `a five-minute walk`, `a ten-year-old boy`.",
"`about` = khoảng."]],
["D","Thank you very much.","Cảm ơn anh nhiều.","Thank you very much",[
"`Thank you very much` lịch sự hơn `Thanks`."]],
["L","You're welcome. Enjoy your evening!","Không có gì. Chúc gia đình buổi tối vui vẻ!","You're welcome   |   Enjoy + N",[
"`You're welcome` = không có gì (đáp lại lời cảm ơn).",
"`Enjoy your evening!` = chúc buổi tối vui vẻ. `enjoy` luôn cần tân ngữ: `enjoy the trip`, `enjoy yourself`."]],
["K","Dad, are we lost?","Bố ơi, mình bị lạc à?","be + lost",[
"`lost` ở đây là tính từ: bị lạc. `We're lost` = chúng ta bị lạc rồi.",
"`get lost` = đi lạc."]],
["D","No, we're almost there. I can see the lights!","Không, mình sắp tới rồi. Bố nhìn thấy đèn rồi kìa!","be + almost there",[
"`almost there` = gần tới nơi.",
"`can see` = nhìn thấy được. Với động từ giác quan, người bản xứ hay dùng `can`: `I can hear it`, `I can smell it`."]]
]},

{id:"taxi",g:"dulich",t:"Kỳ nghỉ",en:"Taking a Taxi",vi:"Đi taxi",sp:["V","M","K"],
scene:"Mẹ con đi taxi về khách sạn: nói điểm đến, thắt dây an toàn, hỏi thời gian và trả tiền.",
tip:"Khi đi taxi, để con nói điểm đến với tài xế: ‘To the ... Hotel, please.’ Câu ngắn nhưng con sẽ rất tự tin.",
vocab:[["Where to?","Đi đâu ạ?"],["fasten your seat belt","thắt dây an toàn"],["traffic","giao thông, kẹt xe"],["air conditioner","máy lạnh"],["Here we are","đến nơi rồi"],["keep the change","khỏi thối tiền"]],
L:[
["V","Hello! Where to?","Xin chào! Chị đi đâu ạ?","Where to?",[
"`Where to?` là câu rút gọn của `Where do you want to go?`. Tài xế hay hỏi ngắn như vậy."]],
["M","To the Sunrise Hotel, please.","Cho tôi đến khách sạn Sunrise.","To + the + nơi, please",[
"Trả lời ngắn: `To` + địa điểm + `please`.",
"Tên khách sạn thường có `the`: `the Sunrise Hotel`."]],
["V","Please fasten your seat belts.","Mọi người thắt dây an toàn nhé.","Please + V + your + N",[
"`fasten` đọc /ˈfæsən/, chữ `t` câm.",
"`seat belts` số nhiều vì có nhiều người."]],
["K","How long will it take?","Đi mất bao lâu ạ?","How long + will + it + take?",[
"`take` + thời gian = mất bao lâu. Câu hỏi tương lai: `How long will it take?`"]],
["V","About twenty minutes if there's no traffic.","Khoảng hai mươi phút nếu không kẹt xe.","if + there's no + N",[
"`if` + hiện tại đơn cho điều kiện ở tương lai.",
"`traffic` không đếm được. `there's no traffic` = không kẹt xe. Kẹt xe: `traffic jam`."]],
["M","Could you turn on the air conditioner, please?","Anh bật điều hòa giúp tôi được không?","Could you + turn on + the + N?",[
"`turn on` = bật; `turn off` = tắt; `turn up/down` = tăng/giảm.",
"`air conditioner` thường nói gọn là `the AC`."]],
["V","Here we are. That's one hundred thousand dong.","Đến nơi rồi. Hết một trăm nghìn đồng ạ.","Here we are   |   That's + số tiền",[
"`Here we are` = mình đến nơi rồi. (Khác `Here you are` = của bạn đây.)",
"`one hundred thousand` = 100.000. `hundred`, `thousand` không thêm `-s`."]],
["M","Here you are. Keep the change.","Đây anh. Khỏi thối lại nhé.","Here you are   |   Keep the change",[
"`Keep the change` = giữ lại tiền thừa.",
"`change` ở đây là danh từ: tiền thối lại."]]
]},

{id:"fall-down",g:"khac",t:"Khi con ngã",en:"I Fell Down",vi:"Bị ngã",sp:["K","D"],
scene:"Con chạy và bị ngã trầy đầu gối. Bố an ủi, rửa vết thương và dán băng.",
tip:"Khi con bị đau nhẹ, an ủi con bằng tiếng Anh. Những câu nói trong lúc có cảm xúc mạnh con nhớ rất lâu.",
vocab:[["fall down (fell)","ngã"],["Are you okay?","Con có sao không?"],["bleed","chảy máu"],["cut","vết đứt, trầy"],["plaster / Band-Aid","băng dán"],["more careful","cẩn thận hơn"]],
L:[
["K","Ouch! Dad, I fell down!","Ui! Bố ơi, con bị ngã!","S + fell down",[
"`fell` là quá khứ của `fall` (fall → fell → fallen).",
"**Đừng nhầm:** `fell` (ngã) khác `felt` (quá khứ của `feel`, cảm thấy)."]],
["D","Oh no! Are you okay? Let me see.","Ôi không! Con có sao không? Để bố xem nào.","Are you okay?   |   Let me + V",[
"`Are you okay?` = Con có sao không? Câu hỏi đầu tiên khi ai đó bị ngã.",
"`Let me see` = để bố xem."]],
["K","My knee is bleeding. It hurts a lot.","Đầu gối con chảy máu. Đau lắm.","N + is + V-ing   |   It hurts + a lot",[
"`bleeding` = đang chảy máu (`bleed`).",
"`knee` có chữ `k` câm, đọc /niː/."]],
["D","It's just a small cut. Don't cry, you're very brave.","Chỉ là vết trầy nhỏ thôi. Đừng khóc, con dũng cảm lắm.","It's just + a + tính từ + N",[
"`just` = chỉ (giảm nhẹ mức độ).",
"`cut` ở đây là danh từ: vết đứt, vết trầy."]],
["D","I'll clean it and put a plaster on it.","Bố sẽ rửa sạch rồi dán băng lên.","I'll + V + it + and + V + a + N + on + it",[
"`plaster` (Anh) = `Band-Aid` (Mỹ): băng dán cá nhân.",
"`put ... on it` = dán lên chỗ đó."]],
["K","Will it hurt?","Có đau không bố?","Will + it + V?",[
"Câu hỏi tương lai với `will`: đảo `Will` lên đầu.",
"`hurt` ở đây = làm đau."]],
["D","Only a little. There, all better!","Chỉ hơi đau thôi. Đấy, xong rồi, khỏi rồi!","Only a little   |   There, + ...",[
"`There,` đầu câu = đấy, xong rồi (khi vừa làm xong việc gì cho ai).",
"`all better` = khỏi rồi, ổn rồi (cách nói với trẻ con)."]],
["K","Thanks, Dad. I'll be more careful next time.","Con cảm ơn bố. Lần sau con sẽ cẩn thận hơn.","more + tính từ dài (so sánh hơn)",[
"**Vì sao `more careful` mà không phải `carefuller`?** Tính từ có **hai âm tiết trở lên** (đa số) dùng `more` để so sánh hơn: `more careful`, `more beautiful`.",
"`I'll` ở đây là lời hứa."]]
]},

{id:"dentist",g:"khac",t:"6 tháng một lần",en:"At the Dentist",vi:"Đi khám răng",sp:["N","K","M"],
scene:"Nha sĩ khám răng cho con, phát hiện một lỗ sâu nhỏ và khuyên ăn ít kẹo.",
tip:"Trước khi đi khám răng, đọc trước đoạn hội thoại này với con để con bớt sợ và biết sẽ có gì xảy ra.",
vocab:[["open wide","há to miệng"],["pull out","nhổ"],["check","kiểm tra"],["hole","lỗ sâu"],["less","ít hơn"],["promise","hứa"]],
L:[
["N","Hello! Open wide, please. Let me look at your teeth.","Chào cháu! Há miệng to ra nào. Để cô xem răng cháu.","Open wide   |   Let me + look at + N",[
"`Open wide` = há to miệng (câu cố định ở nha sĩ).",
"**`look at` hay `see`?** `look at` = nhìn vào có chủ đích. `see` = nhìn thấy."]],
["K","Are you going to pull my tooth out?","Cô có nhổ răng cháu không ạ?","Are you going to + V + N + out?",[
"`be going to` hỏi về dự định.",
"`pull out` = nhổ ra. `tooth` số ít (một cái răng)."]],
["N","No, I'm just going to check them.","Không đâu, cô chỉ kiểm tra thôi.","be just going to + V",[
"`just` = chỉ thôi, làm câu nói nhẹ nhàng.",
"`them` thay cho `your teeth`."]],
["N","You have one small hole here. Do you eat a lot of sweets?","Ở đây có một lỗ sâu nhỏ. Cháu có ăn nhiều kẹo không?","Do you + V + a lot of + N?",[
"Hiện tại đơn hỏi về **thói quen**.",
"`sweets` (Anh) = `candy` (Mỹ): kẹo."]],
["K","Yes, I love candy.","Có ạ, cháu thích kẹo lắm.","S + love + N",[
"`candy` (Mỹ) thường không đếm được khi nói chung. Từng viên: `a piece of candy`.",
"`love` mạnh hơn `like`."]],
["N","Try to eat less candy and brush twice a day.","Cố gắng ăn ít kẹo hơn và đánh răng ngày hai lần nhé.","try to + V   |   less + N không đếm được",[
"`try to + V` = cố gắng làm gì.",
"**`less` hay `fewer`?** `less` + danh từ không đếm được (`less candy`). `fewer` + danh từ đếm được số nhiều (`fewer sweets`).",
"`twice a day` = ngày hai lần."]],
["M","Did you hear that? No more candy before bed!","Con nghe rồi đấy nhé? Không ăn kẹo trước khi ngủ nữa!","No more + N",[
"`No more + N` = không ... nữa.",
"`before bed` = trước khi đi ngủ."]],
["K","Okay, I promise.","Vâng, con hứa.","I promise",[
"`promise` = hứa. Mở rộng: `I promise to brush my teeth.`"]]
]},

{id:"nightmare",g:"khac",t:"Nửa đêm",en:"A Bad Dream",vi:"Gặp ác mộng",sp:["K","M"],
scene:"Nửa đêm con tỉnh dậy vì ác mộng. Mẹ dỗ dành, cùng hít thở sâu và ở bên đến khi con ngủ lại.",
tip:"Giọng nói nhẹ nhàng và câu ngắn quan trọng hơn ngữ pháp trong lúc này. Những câu này cũng dùng được khi con sợ sấm sét, sợ bóng tối.",
vocab:[["bad dream / nightmare","ác mộng"],["dream about","mơ về"],["chase","đuổi theo"],["real","có thật"],["fall asleep","ngủ thiếp đi"],["deep breath","hơi thở sâu"]],
L:[
["K","Mom! Mom! I had a bad dream.","Mẹ ơi! Mẹ ơi! Con gặp ác mộng.","S + had + a + bad dream",[
"`have a bad dream` = gặp ác mộng. Cũng nói `have a nightmare`.",
"Quá khứ `had` vì giấc mơ vừa kết thúc."]],
["M","Shh, it's okay. I'm here. What did you dream about?","Suỵt, không sao đâu. Mẹ đây rồi. Con mơ thấy gì?","What + did + you + dream about?",[
"`dream about` = mơ về. Giới từ `about` để cuối câu hỏi là bình thường trong tiếng Anh.",
"`I'm here` = mẹ ở đây."]],
["K","A big monster was chasing me.","Có một con quái vật to đuổi theo con.","S + was + V-ing (quá khứ tiếp diễn)",[
"**Quá khứ tiếp diễn** (`was/were + V-ing`) tả hành động **đang diễn ra** trong quá khứ, như một cảnh trong giấc mơ.",
"`chase` = đuổi theo."]],
["M","It was just a dream. Monsters aren't real.","Đó chỉ là giấc mơ thôi. Quái vật không có thật đâu.","Monsters + aren't + tính từ",[
"`aren't` = `are not`. Hiện tại đơn cho sự thật chung.",
"`Monsters` không có `the` vì nói về quái vật nói chung."]],
["K","Can you stay with me until I fall asleep?","Mẹ ở với con đến khi con ngủ được không?","until + S + V (hiện tại)",[
"Sau `until` dùng hiện tại đơn dù nói về tương lai.",
"`fall asleep` = ngủ thiếp đi (quá trình). `be asleep` = đang ngủ (trạng thái)."]],
["M","Of course. Let's take some deep breaths together.","Tất nhiên rồi. Mình cùng hít thở sâu nhé.","take + a deep breath",[
"`take a deep breath` = hít một hơi thật sâu. `breath` (danh từ, /breθ/) khác `breathe` (động từ, /briːð/)."]],
["K","I feel better now.","Giờ con thấy đỡ hơn rồi.","feel + so sánh hơn",[
"`better` là so sánh hơn của `good/well`. `feel better` = thấy đỡ hơn."]],
["M","Good. Close your eyes and think of something happy.","Tốt rồi. Nhắm mắt lại và nghĩ về điều gì đó vui vẻ nhé.","something + tính từ",[
"**Vì sao `something happy` mà không phải `happy something`?** Với `something`, `anything`, `nothing`, `someone`, tính từ đứng **sau**: `something new`, `nothing special`.",
"`think of` = nghĩ đến."]]
]},

{id:"piggy-bank",g:"khac",t:"Khi con muốn mua đồ",en:"Saving Money",vi:"Tiết kiệm tiền",sp:["K","D"],
scene:"Con muốn mua ô tô đồ chơi. Bố cùng con tính tiền trong heo đất và bàn cách kiếm thêm.",
tip:"Cho con đếm tiền thật bằng tiếng Anh. Vừa học số đếm lớn, vừa học giá trị của tiền.",
vocab:[["cost","có giá"],["How much...?","bao nhiêu?"],["piggy bank","heo đất"],["more","thêm"],["earn","kiếm (tiền)"],["patience","sự kiên nhẫn"]],
L:[
["K","Dad, I want to buy a new toy car.","Bố ơi, con muốn mua ô tô đồ chơi mới.","want to + V + a + tính từ + N",[
"`toy car` = ô tô đồ chơi; `toy` đứng trước bổ nghĩa cho `car`.",
"Thứ tự: `a new toy car` (tính từ `new` trước danh từ ghép)."]],
["D","How much does it cost?","Nó giá bao nhiêu?","How much + does + it + cost?",[
"`cost` là động từ: có giá. Câu hỏi: `How much does it cost?` Tương đương `How much is it?`",
"Sau `does` dùng `cost` nguyên mẫu."]],
["K","It costs two hundred thousand dong.","Nó giá hai trăm nghìn đồng.","It + costs + số tiền",[
"`costs` thêm `-s` vì chủ ngữ `It`.",
"`two hundred thousand` không có `-s` ở `hundred` và `thousand`."]],
["D","How much money do you have in your piggy bank?","Trong heo đất con có bao nhiêu tiền?","How much money + do + you + have?",[
"`money` không đếm được nên dùng `How much money`."]],
["K","I have one hundred and fifty thousand.","Con có một trăm năm mươi nghìn.","số (Anh-Anh có and)",[
"Kiểu Anh: `one hundred and fifty`; kiểu Mỹ: `one hundred fifty`. Cả hai đều đúng."]],
["D","So you need fifty thousand more.","Vậy con cần thêm năm mươi nghìn nữa.","need + số + more",[
"`So` đầu câu = vậy thì, kết luận.",
"`số + more` = thêm bao nhiêu nữa: `fifty thousand more`, `two more days`."]],
["K","If I help with the chores, can I earn some money?","Nếu con giúp việc nhà, con có được tiền không?","If + hiện tại, + can + S + V?",[
"Câu điều kiện loại 1: `If` + hiện tại đơn, mệnh đề chính dùng `can/will`.",
"`help with the chores` = giúp việc nhà. `earn` = kiếm được (bằng công sức)."]],
["D","Good idea! Saving money takes patience.","Ý hay đấy! Tiết kiệm tiền cần sự kiên nhẫn.","V-ing (chủ ngữ) + takes + N",[
"`Saving money` là **danh động từ** (V-ing) làm chủ ngữ, được coi là số ít → `takes`.",
"`take` ở đây = cần, đòi hỏi: `It takes time.`"]]
]},
{id:"shopping-list",g:"nha",t:"Tối thứ Sáu",en:"Making a Shopping List",vi:"Viết danh sách đi chợ",sp:["M","K"],
scene:"Mẹ mở tủ lạnh, cùng con xem nhà còn gì, hết gì rồi viết danh sách mua sắm.",
tip:"Cho con cầm bút viết danh sách bằng tiếng Anh. Đây là lúc tuyệt vời để luyện some/any và đếm được/không đếm được.",
vocab:[["fridge","tủ lạnh"],["run out of","hết (cái gì)"],["any","nào, chút nào"],["left","còn lại"],["a carton of","một hộp (sữa)"],["write down","ghi lại"]],
L:[
["M","Let's check what we need from the store.","Mình xem cần mua gì ở cửa hàng nhé.","Let's check + what + S + V",[
"`what we need` là mệnh đề danh từ làm tân ngữ. Trật tự **S + V** bình thường, không đảo: không nói `what do we need`."]],
["K","Is there any milk in the fridge?","Trong tủ lạnh còn sữa không mẹ?","Is there any + N không đếm được?",[
"`any` dùng trong câu hỏi và phủ định. `milk` không đếm được nên dùng `Is there`, không phải `Are there`."]],
["M","No, we've run out of milk.","Không, nhà mình hết sữa rồi.","have run out of + N",[
"`run out of` = hết, cạn. Dùng **hiện tại hoàn thành** vì kết quả còn ở hiện tại (bây giờ không có sữa).",
"`run – ran – run`: phân từ hai giống nguyên mẫu."]],
["K","How many eggs are left?","Còn lại bao nhiêu quả trứng ạ?","How many + N số nhiều + are left?",[
"`eggs` đếm được nên `How many`.",
"`left` ở đây là quá khứ phân từ của `leave`, nghĩa là ‘còn lại’, không phải ‘bên trái’."]],
["M","Only two. Please write down eggs and milk.","Chỉ còn hai quả. Con ghi trứng với sữa vào nhé.","write down + N",[
"`write down` = ghi lại, chép xuống. `Only two` = chỉ có hai (ít)."]],
["K","Can we buy some apples too?","Mình mua thêm táo được không mẹ?","Can we + V + some + N?",[
"Dùng `some` trong câu hỏi khi **đề nghị, xin**: `Can we buy some apples?`"]],
["M","Okay. And a carton of orange juice.","Được. Và một hộp nước cam nữa.","a + carton of + N",[
"Danh từ không đếm được đếm bằng đơn vị: `a carton of juice`, `a bottle of water`, `a bag of rice`, `a loaf of bread`."]],
["K","Done! I wrote everything down.","Xong rồi! Con ghi hết rồi.","I + V quá khứ + everything + down",[
"`wrote` là quá khứ của `write`. Tân ngữ `everything` có thể đứng giữa `wrote ... down`."]]
]},

{id:"setting-table",g:"toi",t:"18:30",en:"Setting the Table",vi:"Dọn bàn ăn",sp:["M","K"],
scene:"Trước bữa tối, con giúp mẹ bày bát đũa, thìa và cốc lên bàn.",
tip:"Đếm bát đũa cùng con bằng tiếng Anh: ‘one bowl for Dad, one for Mom...’ để con luyện số và cấu trúc for + người.",
vocab:[["set the table","dọn bàn ăn"],["chopsticks","đôi đũa"],["spoon","thìa"],["napkin","khăn ăn"],["each","mỗi"],["pour","rót"]],
L:[
["M","Dinner's almost ready. Can you set the table?","Sắp có cơm rồi. Con dọn bàn giúp mẹ nhé?","Can you + set the table?",[
"`set the table` = bày bát đũa lên bàn trước bữa ăn; `clear the table` = dọn bàn sau bữa ăn.",
"`almost` = gần như, sắp."]],
["K","How many bowls do we need?","Mình cần bao nhiêu cái bát ạ?","How many + N + do we need?",[
"`bowls` đếm được nên dùng `How many`."]],
["M","Four bowls. One for each person.","Bốn cái. Mỗi người một cái.","One for each + N số ít",[
"`each` + danh từ **số ít**: `each person`. Còn `every person` cũng số ít, nhưng `each` nhấn vào từng người riêng lẻ.",
"`one` thay cho `bowl` để khỏi lặp lại."]],
["K","Where are the chopsticks?","Đũa ở đâu ạ?","Where are + the + N số nhiều?",[
"`chopsticks` luôn số nhiều khi nói về đôi đũa: `a pair of chopsticks`."]],
["M","In the drawer, next to the spoons.","Trong ngăn kéo, cạnh mấy cái thìa.","In + the + N, next to + the + N",[
"Câu trả lời ngắn không cần chủ ngữ và động từ: `(They're) in the drawer.`"]],
["K","Should I put a cup next to each bowl?","Con đặt mỗi bát một cái cốc nhé?","Should I + put + N + next to + each + N?",[
"`put` không đổi ở mọi thì: `put – put – put`."]],
["M","Yes, and please pour some water.","Ừ, và con rót nước nữa nhé.","please + V + some + N",[
"`pour` = rót (chất lỏng). Đọc giống `poor` /pɔːr/."]],
["K","The table is ready! Let's eat!","Bàn xong rồi! Ăn cơm thôi!","The + N + is ready! Let's + V!",[
"`ready` = sẵn sàng. `Let's eat!` = mời cả nhà ăn cơm (rất tự nhiên)."]]
]},

{id:"picky-eater",g:"toi",t:"Bữa tối",en:"I Don't Like Vegetables",vi:"Con không thích ăn rau",sp:["K","D"],
scene:"Con không muốn ăn rau. Bố khéo léo động viên con thử một miếng.",
tip:"Đừng ép, hãy dùng ‘Just try one bite’. Câu ngắn, dễ nhớ và giúp con quen cấu trúc mệnh lệnh nhẹ nhàng.",
vocab:[["vegetables","rau"],["broccoli","bông cải xanh"],["try","thử"],["bite","miếng (cắn)"],["healthy","tốt cho sức khỏe"],["strong","khỏe mạnh"]],
L:[
["K","I don't like broccoli.","Con không thích bông cải xanh.","I don't like + N",[
"Phủ định hiện tại đơn: `don't + V nguyên mẫu`. `broccoli` không đếm được, không thêm `-s`."]],
["D","Have you ever tried it?","Con đã bao giờ ăn thử chưa?","Have you ever + V3?",[
"**Hiện tại hoàn thành** + `ever` hỏi về kinh nghiệm từ trước tới nay.",
"**Vì sao không dùng `Did you try`?** `Did you try` hỏi về một lần cụ thể trong quá khứ (ví dụ: hôm qua)."]],
["K","No, but it looks yucky.","Chưa, nhưng trông nó ghê ghê.","it looks + tính từ",[
"`yucky` = ghê, không ngon (từ trẻ con hay dùng). Ngược lại là `yummy`."]],
["D","Just try one bite.","Thử một miếng thôi con.","Just + V + one + N",[
"`Just` làm câu nghe nhẹ nhàng, không ép buộc."]],
["D","Vegetables make you healthy and strong.","Rau giúp con khỏe mạnh.","make + O + tính từ",[
"`make + người + tính từ` = làm cho ai trở nên thế nào.",
"`Vegetables` số nhiều nên `make` không thêm `-s`."]],
["K","Hmm... It's not as bad as I thought.","Ừm... Không dở như con nghĩ.","not as + tính từ + as + S + V",[
"So sánh không bằng: `not as + adj + as`.",
"`thought` là quá khứ của `think`."]],
["D","See? You might like it after all.","Thấy chưa? Hóa ra con cũng thích đấy chứ.","might + V / after all",[
"`might` = có thể (khả năng không chắc chắn).",
"`after all` = rốt cuộc, hóa ra."]],
["K","Can I have some more carrots too?","Con ăn thêm cà rốt được không ạ?","some more + N",[
"`some more` = thêm một ít nữa."]]
]},

{id:"blocks",g:"nha",t:"Ngày nghỉ",en:"Building Blocks",vi:"Chơi xếp hình",sp:["K","D"],
scene:"Bố và con xếp một tòa tháp bằng các khối màu, vừa chơi vừa học màu sắc và hình khối.",
tip:"Đồ chơi xếp hình là cách dễ nhất để dạy màu, hình dạng và so sánh: taller, bigger, the tallest.",
vocab:[["block","khối xếp hình"],["tower","tòa tháp"],["square","hình vuông"],["triangle","hình tam giác"],["on top","ở trên cùng"],["fall down","đổ xuống"]],
L:[
["K","Let's build a tall tower!","Mình xây tháp thật cao đi!","Let's + V + a + tính từ + N",[
"Tính từ đứng **trước** danh từ: `a tall tower`."]],
["D","Okay. Which block should we use first?","Được. Mình dùng khối nào trước nhỉ?","Which + N + should we + V?",[
"`Which` dùng khi chọn trong một số lựa chọn có sẵn; `What` khi lựa chọn không giới hạn."]],
["K","The big red square.","Khối vuông to màu đỏ.","the + size + color + shape",[
"**Thứ tự tính từ:** kích thước → màu sắc → danh từ: `big red square`. Không nói `red big square`."]],
["D","Now put the blue one on top.","Giờ đặt khối xanh lên trên cùng.","put + the + màu + one + on top",[
"`one` thay cho `block` để khỏi lặp.",
"`on top` = ở trên cùng."]],
["K","Can I add the yellow triangle?","Con thêm khối tam giác vàng được không?","Can I + add + the + N?",[
"`triangle` = hình tam giác; `circle` = tròn; `rectangle` = chữ nhật."]],
["D","Careful! It's getting wobbly.","Cẩn thận! Nó bắt đầu lung lay rồi.","It's getting + tính từ",[
"`get + tính từ` dạng tiếp diễn = đang dần trở nên: `getting wobbly`, `getting dark`."]],
["K","Oh no, it fell down!","Ôi không, đổ mất rồi!","it + fell down",[
"`fell` là quá khứ của `fall`. **Đừng nhầm** với `feel – felt` (cảm thấy)."]],
["D","Let's build it again. This time even taller!","Mình xây lại. Lần này còn cao hơn nữa!","even + so sánh hơn",[
"`even taller` = còn cao hơn nữa. `even` nhấn mạnh so sánh hơn, giống `much`."]]
]},

{id:"puzzle",g:"nha",t:"Chiều CN",en:"Doing a Puzzle",vi:"Ghép tranh cùng bà",sp:["G","K"],
scene:"Bà và cháu ghép một bức tranh 100 mảnh hình con voi.",
tip:"Khi ghép tranh, hỏi con ‘Does this piece fit?’ Con sẽ học cách hỏi Yes/No với does.",
vocab:[["puzzle","trò ghép hình"],["piece","mảnh"],["fit","vừa, khớp"],["corner","góc"],["edge","cạnh, mép"],["missing","bị thiếu"]],
L:[
["G","Shall we do this puzzle together?","Mình cùng ghép bức tranh này nhé?","Shall we + V?",[
"`Shall we...?` = mình... nhé? dùng để rủ, lịch sự và hơi trang trọng (bà hay dùng)."]],
["K","Yes! How many pieces are there?","Vâng! Có bao nhiêu mảnh ạ?","How many + N + are there?",[
"Mẫu hỏi số lượng: `How many + N số nhiều + are there?`"]],
["G","One hundred. Let's start with the corners.","Một trăm mảnh. Bắt đầu từ các góc nhé.","Let's start with + the + N",[
"`start with` = bắt đầu bằng."]],
["K","Does this piece fit here?","Mảnh này có vừa chỗ này không bà?","Does + this + N + V?",[
"`this piece` số ít nên dùng `Does`. Sau `Does` động từ ở nguyên mẫu: `fit`, không nói `fits`."]],
["G","No, try turning it around.","Không, thử xoay nó lại xem.","try + V-ing",[
"`try + V-ing` = thử làm cách đó xem có được không. `try + to V` = cố gắng làm (việc khó).",
"`turn around` = xoay lại."]],
["K","It fits! I found it!","Vừa rồi! Cháu tìm được rồi!","It fits! / I found it!",[
"`found` là quá khứ của `find`."]],
["G","Look, it's an elephant!","Nhìn này, là con voi!","it's + an + N",[
"`an` trước âm nguyên âm: `an elephant`."]],
["K","Oh no, one piece is missing!","Ôi không, thiếu một mảnh!","N + is + missing",[
"`missing` = bị thiếu, bị mất. Đây là tính từ, không phải động từ đang diễn ra."]]
]},

{id:"music",g:"nha",t:"Chiều",en:"Piano Practice",vi:"Tập đàn",sp:["M","K"],
scene:"Con không muốn tập đàn. Mẹ khuyến khích con tập mười phút rồi cùng hát.",
tip:"Dùng các bài hát tiếng Anh đơn giản khi tập đàn. Câu ‘Practice makes perfect’ là câu rất đáng nhớ.",
vocab:[["practice","luyện tập"],["piano","đàn piano"],["song","bài hát"],["mistake","lỗi"],["Practice makes perfect","Có công mài sắt có ngày nên kim"],["sing along","hát theo"]],
L:[
["M","It's time for your piano practice.","Đến giờ con tập đàn rồi.","It's time for + N",[
"`It's time for + N` hoặc `It's time to + V`: `It's time to practice.`"]],
["K","Do I have to? I'm tired.","Con có phải tập không ạ? Con mệt.","Do I have to?",[
"`Do I have to?` = con có bắt buộc phải làm không? Câu rút gọn, bỏ động từ phía sau."]],
["M","Just ten minutes. Then we can sing together.","Chỉ mười phút thôi. Rồi mình cùng hát.","Just + thời gian. Then + S + can + V",[
"`Then` = sau đó."]],
["K","I keep making mistakes.","Con cứ bị sai hoài.","keep + V-ing",[
"`keep + V-ing` = cứ tiếp tục làm (thường việc lặp lại, không mong muốn).",
"`make a mistake` = mắc lỗi. Không nói `do a mistake`."]],
["M","That's okay. Practice makes perfect.","Không sao. Có luyện tập mới giỏi được.","Practice makes perfect",[
"Câu tục ngữ: luyện tập tạo nên sự hoàn hảo. `Practice` là danh từ số ít nên `makes`."]],
["K","Can you play it with me?","Mẹ chơi cùng con được không?","Can you + V + it + with me?",[
"`play` với nhạc cụ: `play the piano`, `play the guitar` (có `the`); với thể thao thì không: `play football`."]],
["M","Sure. You play, and I'll sing along.","Được. Con đàn, mẹ hát theo.","You + V, and I'll + V",[
"`sing along` = hát theo nhạc."]],
["K","That was fun! I played it without mistakes!","Vui quá! Con chơi không sai nốt nào!","without + N",[
"`without` = không có. Sau `without` là danh từ hoặc V-ing: `without making mistakes`."]]
]},

{id:"exercise",g:"sang",t:"6:40",en:"Morning Exercise",vi:"Tập thể dục buổi sáng",sp:["D","K"],
scene:"Bố và con tập thể dục buổi sáng, vừa tập vừa học các bộ phận cơ thể.",
tip:"Tập thể dục là lúc học từ chỉ bộ phận cơ thể và động từ hành động: touch, stretch, jump, bend.",
vocab:[["stretch","duỗi người"],["touch","chạm"],["toes","ngón chân"],["jump","nhảy"],["bend","cúi, gập"],["deep breath","hít thở sâu"]],
L:[
["D","Let's do some exercise before breakfast.","Mình tập thể dục trước khi ăn sáng nhé.","do exercise / before + N",[
"`do exercise` (không đếm được) = tập thể dục nói chung. `do exercises` = làm các bài tập cụ thể.",
"`before breakfast` không có `the`: bữa ăn không dùng mạo từ."]],
["D","Stand up straight and stretch your arms.","Đứng thẳng và duỗi tay ra.","V + up + straight + and + V + your + N",[
"`straight` ở đây là trạng từ = thẳng."]],
["K","Like this, Dad?","Như thế này hả bố?","Like this?",[
"`like this` = như thế này. `like` ở đây là giới từ, không phải ‘thích’."]],
["D","Good! Now bend down and touch your toes.","Tốt lắm! Giờ cúi xuống chạm ngón chân.","bend down + and + touch + your + N",[
"`toes` = ngón chân; `fingers` = ngón tay."]],
["K","I can't reach them!","Con không với tới!","I can't + V + them",[
"`reach` = với tới. `them` = `my toes`."]],
["D","Bend your knees a little. Now jump ten times!","Hơi chùng gối xuống. Giờ nhảy mười cái!","số + times",[
"`ten times` = mười lần. `time` = lần thì đếm được: `one time`, `twice`, `three times`."]],
["K","One, two, three... I'm out of breath!","Một, hai, ba... Con hết hơi rồi!","I'm out of + N",[
"`out of breath` = hụt hơi, thở không ra hơi. `out of` = hết."]],
["D","Take a deep breath. Great job!","Hít thở thật sâu. Giỏi lắm!","Take + a + deep + breath",[
"`breath` (danh từ, đọc /breθ/) ≠ `breathe` (động từ, đọc /briːð/)."]]
]},

{id:"nails",g:"toi",t:"Chủ Nhật",en:"Cutting Nails",vi:"Cắt móng tay",sp:["M","K"],
scene:"Móng tay con dài rồi. Mẹ cắt móng tay cho con, con hơi sợ.",
tip:"Hỏi con ‘Does it hurt?’ trong lúc cắt. Câu hỏi ngắn, con trả lời ngay được.",
vocab:[["nails","móng tay"],["nail clippers","bấm móng tay"],["long","dài"],["hurt","làm đau"],["hold still","ngồi yên"],["dirty","bẩn"]],
L:[
["M","Your nails are too long. Let's cut them.","Móng tay con dài quá rồi. Cắt đi nhé.","too + tính từ",[
"`too long` = quá dài (đến mức không ổn). Khác `very long` = rất dài (chưa chắc là xấu)."]],
["K","Will it hurt?","Có đau không mẹ?","Will it + V?",[
"`hurt` = làm đau. Quá khứ vẫn là `hurt`."]],
["M","No, it won't. Hold still, please.","Không đau đâu. Con ngồi yên nhé.","Hold still",[
"`Hold still` = ngồi yên, đừng cựa quậy. `still` ở đây là tính từ = đứng yên, không phải ‘vẫn còn’."]],
["K","Why do I have to cut them?","Sao con phải cắt móng ạ?","Why do I have to + V?",[
"`have to` trong câu hỏi cần trợ động từ `do`: `Why do I have to...?`"]],
["M","Because dirt gets under long nails.","Vì đất bẩn dễ chui vào móng dài.","Because + N + gets under + N",[
"`dirt` (danh từ không đếm được) = đất bẩn; `dirty` là tính từ."]],
["M","Now give me your other hand.","Giờ đưa mẹ tay bên kia.","give + sb + your other + N",[
"`other` = còn lại (một trong hai). `the other hand` = bàn tay kia."]],
["K","That tickles!","Nhột quá!","That tickles!",[
"`tickle` = làm nhột. `That tickles!` = nhột quá!"]],
["M","All done. Now your hands are clean and neat.","Xong rồi. Tay con sạch và gọn rồi.","All done. / are + tính từ + and + tính từ",[
"`neat` = gọn gàng."]]
]},

{id:"sibling-fight",g:"nha",t:"Ngày nghỉ",en:"A Sibling Fight",vi:"Hai chị em cãi nhau",sp:["S","K","M"],
scene:"Hai chị em cãi nhau vì cái điều khiển TV. Mẹ giúp hai đứa nói chuyện và làm lành.",
tip:"Dạy con dùng ‘I feel... when you...’ thay vì la hét. Đây là cách nói về cảm xúc rất văn minh.",
vocab:[["remote","điều khiển TV"],["grab","giật lấy"],["fair","công bằng"],["take turns","thay phiên nhau"],["make up","làm lành"],["apologize","xin lỗi"]],
L:[
["S","Give me the remote! It's my turn!","Đưa chị điều khiển! Đến lượt chị!","Give + me + the + N! / It's my turn!",[
"`It's my turn` = đến lượt tôi."]],
["K","No! I had it first!","Không! Em cầm trước mà!","I had it first",[
"`had` quá khứ của `have`. `first` = trước (người khác)."]],
["M","Stop shouting, both of you.","Hai đứa thôi la hét đi.","Stop + V-ing",[
"**Vì sao `stop shouting` mà không phải `stop to shout`?** `stop + V-ing` = ngừng làm việc đó; `stop + to V` = dừng lại để làm việc khác."]],
["M","Tell me what happened.","Kể mẹ nghe chuyện gì đã xảy ra.","Tell me + what + happened",[
"`what happened` = chuyện gì đã xảy ra. Ở đây `what` là chủ ngữ nên không cần `did`."]],
["K","I feel sad when you grab things from me.","Em buồn khi chị giật đồ của em.","I feel + tính từ + when + S + V",[
"Mẫu nói cảm xúc: `I feel + adj + when you + V`.",
"`grab` = giật lấy, chụp lấy."]],
["S","Sorry. I shouldn't have grabbed it.","Chị xin lỗi. Lẽ ra chị không nên giật.","shouldn't have + V3",[
"`shouldn't have + V3` = lẽ ra không nên làm (nhưng đã làm rồi). Dùng để nhận lỗi."]],
["M","How about taking turns? Thirty minutes each.","Hay là thay phiên nhau? Mỗi đứa ba mươi phút.","How about + V-ing?",[
"`take turns` = thay phiên nhau.",
"`each` cuối câu = mỗi người."]],
["K","Okay. You can go first.","Vâng. Chị chọn trước đi.","You can go first",[
"`go first` = đi trước, làm trước. Nhường người khác là phép lịch sự."]]
]},

{id:"neighbor",g:"nha",t:"Cuối tuần",en:"The Neighbor Visits",vi:"Bác hàng xóm sang chơi",sp:["E","K","D"],
scene:"Bác hàng xóm sang mượn cái thang. Con chào hỏi và gọi bố.",
tip:"Dạy con chào hỏi người lớn lịch sự bằng ‘Good morning’ và ‘Nice to see you’.",
vocab:[["neighbor","hàng xóm"],["borrow","mượn"],["lend","cho mượn"],["ladder","cái thang"],["give back","trả lại"],["anytime","bất cứ lúc nào"]],
L:[
["E","Good morning! Is your dad home?","Chào cháu! Bố cháu có nhà không?","Is + N + home?",[
"`be home` = ở nhà. Không cần `at`: `Is your dad home?` (hoặc `at home`)."]],
["K","Good morning! Yes, please wait a moment.","Cháu chào bác! Có ạ, bác đợi một chút.","please wait + a moment",[
"`Good morning` dùng đến khoảng 12 giờ trưa; sau đó `Good afternoon`."]],
["D","Hi! Nice to see you. How can I help?","Chào anh! Rất vui gặp anh. Tôi giúp gì được?","How can I help?",[
"`Nice to see you` dùng khi gặp lại người đã quen; `Nice to meet you` khi gặp lần đầu."]],
["E","Could I borrow your ladder?","Tôi mượn cái thang được không?","Could I + borrow + N?",[
"**`borrow` hay `lend`?** `borrow` = mượn (lấy về phía mình); `lend` = cho mượn: `Could you lend me your ladder?`",
"`Could` lịch sự hơn `Can`."]],
["D","Of course. It's in the garage.","Tất nhiên rồi. Nó ở trong ga-ra.","Of course. It's in + the + N",[
"`Of course` = tất nhiên rồi."]],
["E","Thanks! I'll give it back tomorrow.","Cảm ơn! Mai tôi trả.","give it back",[
"`give back` = trả lại; với đại từ: `give it back`."]],
["D","No problem. Anytime.","Không có gì. Cứ lúc nào cần.","No problem. Anytime.",[
"`Anytime` = bất cứ lúc nào, đáp lại lời cảm ơn rất thân thiện."]],
["K","Bye! Have a nice day!","Cháu chào bác! Chúc bác một ngày tốt lành!","Have a + tính từ + day!",[
"`Have a nice day!` = câu chào tạm biệt lịch sự."]]
]},

{id:"dad-working",g:"nha",t:"Giờ làm việc",en:"Dad Is Working",vi:"Bố đang làm việc ở nhà",sp:["K","D"],
scene:"Bố làm việc ở nhà và có cuộc họp online. Con muốn chơi với bố nên bố hẹn con sau.",
tip:"Dạy con câu ‘Are you busy?’ trước khi làm phiền người khác. Đây là thói quen lịch sự rất tốt.",
vocab:[["busy","bận"],["meeting","cuộc họp"],["quiet","yên lặng"],["interrupt","làm gián đoạn"],["in a minute","một lát nữa"],["promise","hứa"]],
L:[
["K","Dad, are you busy?","Bố ơi, bố có bận không?","are you + tính từ?",[
"Hỏi trước khi làm phiền: `Are you busy?`, `Do you have a minute?`"]],
["D","Yes, I'm in a meeting right now.","Có, bố đang họp con ạ.","I'm in a meeting",[
"`in a meeting` = đang họp. Dùng `in` chứ không phải `at`."]],
["D","Can you play quietly for a while?","Con chơi nhẹ nhàng một lúc nhé?","V + quietly + for a while",[
"`quietly` (trạng từ) bổ nghĩa cho `play`. Tính từ là `quiet`: `Be quiet.`",
"`for a while` = một lúc."]],
["K","When will you finish?","Khi nào bố xong ạ?","When will you + V?",[
"Hỏi về thời điểm trong tương lai: `When will...?`"]],
["D","In about thirty minutes.","Khoảng ba mươi phút nữa.","In + khoảng thời gian",[
"**`in` + khoảng thời gian** = sau bao lâu nữa (tương lai): `in thirty minutes`. Khác `for thirty minutes` = trong suốt ba mươi phút."]],
["K","Okay. I won't interrupt you.","Vâng. Con sẽ không làm phiền bố.","I won't + V",[
"`interrupt` = cắt ngang, làm gián đoạn."]],
["D","Thank you. After that, we'll play together. I promise.","Cảm ơn con. Sau đó mình chơi cùng nhau. Bố hứa.","After that, we'll + V. I promise.",[
"`I promise` = bố hứa. `will` dùng cho lời hứa."]],
["K","I'll wait for you in my room.","Con đợi bố trong phòng.","wait for + sb",[
"`wait for + người` = đợi ai. Không nói `wait you`."]]
]},

{id:"recycling",g:"nha",t:"Mỗi ngày",en:"Sorting the Trash",vi:"Phân loại rác",sp:["M","K"],
scene:"Mẹ hướng dẫn con phân loại rác: chai nhựa, giấy và rác thải còn lại.",
tip:"Dán nhãn tiếng Anh lên thùng rác: Plastic, Paper, Trash. Con sẽ nhớ từ rất nhanh.",
vocab:[["trash","rác"],["recycle","tái chế"],["plastic","nhựa"],["paper","giấy"],["bin","thùng"],["take out","mang ra ngoài"]],
L:[
["M","Can you help me sort the trash?","Con giúp mẹ phân loại rác nhé?","help + sb + V",[
"`sort` = phân loại. `trash` (Mỹ) = `rubbish` (Anh), không đếm được."]],
["K","Where does this bottle go?","Cái chai này bỏ vào đâu ạ?","Where does + N + go?",[
"`Where does it go?` = để vào đâu."]],
["M","It's plastic, so it goes in the blue bin.","Nó bằng nhựa nên bỏ vào thùng xanh.","S + V, so + S + V",[
"`so` = nên, vì vậy (chỉ kết quả). Khác `because` (chỉ nguyên nhân)."]],
["K","And what about this box?","Còn cái hộp này thì sao?","What about + N?",[
"`What about...?` = còn... thì sao?"]],
["M","It's made of paper. Put it in the green bin.","Nó làm bằng giấy. Bỏ vào thùng xanh lá.","be made of + chất liệu",[
"`be made of` = được làm bằng (chất liệu): `made of paper`, `made of wood`."]],
["K","Why do we recycle?","Sao mình phải tái chế ạ?","Why do we + V?",[
"Hiện tại đơn hỏi về việc làm thường xuyên."]],
["M","Because it helps keep the Earth clean.","Vì nó giúp Trái Đất sạch sẽ.","help + V + O + tính từ",[
"`keep + O + tính từ` = giữ cho cái gì như thế nào: `keep the Earth clean`.",
"`the Earth` có `the` vì là duy nhất."]],
["K","I'll take out the trash for you!","Con mang rác ra ngoài giúp mẹ!","take out + the + N",[
"`take out the trash` = đổ rác."]]
]},

{id:"loose-tooth",g:"khac",t:"Khi thay răng",en:"My Tooth Is Loose",vi:"Con bị lung lay răng",sp:["K","M"],
scene:"Con phát hiện răng sữa bị lung lay. Mẹ giải thích về việc thay răng.",
tip:"Ở phương Tây có chuyện ‘tooth fairy’ (tiên răng) để răng dưới gối. Kể cho con nghe để con bớt sợ.",
vocab:[["loose","lung lay"],["wiggle","lắc lắc"],["baby tooth","răng sữa"],["grow","mọc"],["fall out","rụng"],["tooth fairy","tiên răng"]],
L:[
["K","Mom, my tooth is loose!","Mẹ ơi, răng con bị lung lay!","N + is + loose",[
"`loose` /luːs/ = lỏng, lung lay. **Đừng nhầm** với `lose` /luːz/ = làm mất."]],
["M","Let me see. Oh, it's a baby tooth.","Để mẹ xem. À, đó là răng sữa.","Let me + V",[
"`baby tooth` = răng sữa. Số nhiều: `baby teeth`."]],
["K","Will it fall out?","Nó sẽ rụng ạ?","Will it + fall out?",[
"`fall out` = rụng ra (răng, tóc)."]],
["M","Yes, and a new tooth will grow in its place.","Có, và một cái răng mới sẽ mọc vào chỗ đó.","will + V + in its place",[
"`its` (của nó) không có dấu nháy. `it's` = `it is`."]],
["K","Does it hurt when it falls out?","Lúc rụng có đau không mẹ?","Does it hurt + when + S + V?",[
"Sau `when` trong câu hỏi về điều chung, động từ chia hiện tại đơn: `when it falls out`."]],
["M","Just a little. Don't wiggle it too much.","Chỉ hơi đau thôi. Đừng lắc nó nhiều quá.","Don't + V + it + too much",[
"`wiggle` = lắc lắc, ngọ nguậy."]],
["M","When it falls out, put it under your pillow.","Khi nó rụng, con để dưới gối nhé.","When + S + V (hiện tại), + mệnh lệnh",[
"**Vì sao `when it falls out` mà không phải `when it will fall out`?** Trong mệnh đề thời gian chỉ tương lai, dùng **hiện tại đơn**, không dùng `will`."]],
["K","Will the tooth fairy come?","Tiên răng sẽ đến ạ?","Will + the + N + V?",[
"`the tooth fairy` có `the` vì đó là nhân vật duy nhất mọi người đều biết."]]
]},

{id:"how-tall",g:"nha",t:"Sinh nhật",en:"How Tall Am I?",vi:"Đo chiều cao",sp:["K","D"],
scene:"Bố đo chiều cao cho con, đánh dấu lên tường và so sánh với năm ngoái.",
tip:"Đây là bài tuyệt vời để học so sánh hơn: taller, bigger, heavier, và so sánh với ‘than’.",
vocab:[["tall","cao"],["height","chiều cao"],["measure","đo"],["centimeter","xăng-ti-mét"],["grow","lớn lên"],["than","hơn"]],
L:[
["K","Dad, how tall am I?","Bố ơi, con cao bao nhiêu?","How + tính từ + am I?",[
"`How tall...?` hỏi chiều cao; `How old...?` hỏi tuổi; `How heavy...?` hỏi cân nặng."]],
["D","Let's measure you. Stand against the wall.","Mình đo nhé. Đứng sát vào tường.","Stand + against + the + N",[
"`against the wall` = áp sát vào tường. `against` còn nghĩa là ‘chống lại’."]],
["D","Don't stand on your tiptoes!","Đừng kiễng chân lên!","Don't + stand on + your tiptoes",[
"`on tiptoe(s)` = kiễng chân."]],
["D","You're one hundred and fifteen centimeters tall.","Con cao 115 xăng-ti-mét.","S + be + số + đơn vị + tall",[
"Mẫu: `số + đơn vị + tính từ`: `115 centimeters tall`, `seven years old`.",
"Đọc số: `one hundred and fifteen` (Anh-Mỹ thường bỏ `and`)."]],
["K","Am I taller than last year?","Con cao hơn năm ngoái không?","so sánh hơn + than",[
"So sánh hơn tính từ ngắn: thêm `-er` + `than`: `taller than`.",
"`last year` không có giới từ đứng trước."]],
["D","Yes, you grew five centimeters!","Có, con cao thêm năm phân!","S + grew + số lượng",[
"`grew` là quá khứ của `grow`."]],
["K","Am I as tall as my sister now?","Giờ con cao bằng chị chưa?","as + tính từ + as",[
"So sánh bằng: `as + adj + as`."]],
["D","Not yet, but you're catching up!","Chưa, nhưng con sắp đuổi kịp rồi!","Not yet / catch up",[
"`catch up` = đuổi kịp. Hiện tại tiếp diễn chỉ quá trình đang diễn ra."]]
]},

{id:"nap",g:"ngay",t:"12:30",en:"Nap Time",vi:"Ngủ trưa",sp:["G","K"],
scene:"Buổi trưa, bà dỗ cháu ngủ trưa nhưng cháu chưa buồn ngủ.",
tip:"Nói chuyện nhẹ nhàng bằng tiếng Anh trước giờ ngủ giúp con nghe nhiều mà không áp lực.",
vocab:[["nap","giấc ngủ trưa"],["sleepy","buồn ngủ"],["lie down","nằm xuống"],["close your eyes","nhắm mắt"],["wake up","thức dậy"],["energy","năng lượng"]],
L:[
["G","It's nap time, sweetie.","Đến giờ ngủ trưa rồi cháu ơi.","It's + N + time",[
"`nap time` = giờ ngủ trưa. `take a nap` = ngủ trưa một chút."]],
["K","But I'm not sleepy.","Nhưng cháu chưa buồn ngủ.","I'm not + tính từ",[
"`sleepy` = buồn ngủ; `asleep` = đang ngủ; `tired` = mệt."]],
["G","Just lie down and close your eyes.","Cứ nằm xuống và nhắm mắt lại.","Just + V + and + V",[
"`lie down` = nằm xuống. `lie – lay – lain` (nằm). **Đừng nhầm** với `lay` = đặt."]],
["K","Can you sing me a song?","Bà hát cho cháu nghe một bài được không?","sing + sb + a song",[
"Hai tân ngữ: `sing me a song` = `sing a song for me`."]],
["G","Of course. Get comfortable.","Tất nhiên rồi. Nằm cho thoải mái nhé.","Get + tính từ",[
"`get comfortable` = làm cho mình thoải mái."]],
["K","Grandma, how long will I sleep?","Bà ơi, cháu sẽ ngủ bao lâu?","How long will + S + V?",[
"`How long` hỏi về độ dài thời gian."]],
["G","About an hour. I'll wake you up at two.","Khoảng một tiếng. Hai giờ bà gọi dậy.","wake + sb + up + at + giờ",[
"`wake you up`: đại từ ở giữa cụm động từ.",
"`an hour`: dùng `an` vì `h` câm, âm đầu là nguyên âm."]],
["K","Okay... I'm getting sleepy now...","Vâng... Giờ cháu thấy buồn ngủ rồi...","I'm getting + tính từ",[
"`get + adj` dạng tiếp diễn = đang dần trở nên."]]
]},

{id:"toilet",g:"nha",t:"Bất cứ lúc nào",en:"I Need the Toilet",vi:"Con muốn đi vệ sinh",sp:["K","M"],
scene:"Con cần đi vệ sinh. Mẹ nhắc con xả nước và rửa tay sạch sẽ.",
tip:"Đây là câu con cần biết nhất khi đi học: ‘May I go to the bathroom, please?’ Hãy tập cho con nói thành thạo.",
vocab:[["toilet","nhà vệ sinh"],["bathroom","phòng tắm, nhà vệ sinh"],["flush","xả nước"],["soap","xà phòng"],["toilet paper","giấy vệ sinh"],["in a hurry","vội"]],
L:[
["K","Mom, I need to go to the bathroom!","Mẹ ơi, con muốn đi vệ sinh!","I need to + go to the bathroom",[
"Ở Mỹ nói `bathroom`, ở Anh nói `toilet` hoặc `loo`. Đều dùng để chỉ nhà vệ sinh."]],
["M","Go ahead. Do you need help?","Đi đi con. Con có cần mẹ giúp không?","Go ahead.",[
"`Go ahead` = cứ làm đi."]],
["K","No, I can do it by myself.","Không, con tự làm được.","by + myself",[
"`by myself` = tự mình, một mình."]],
["K","Mom, we're out of toilet paper!","Mẹ ơi, hết giấy vệ sinh rồi!","be out of + N",[
"`be out of` = hết."]],
["M","Here's a new roll.","Đây, cuộn mới này.","Here's + a + N",[
"`a roll of toilet paper` = một cuộn giấy vệ sinh."]],
["M","Don't forget to flush.","Đừng quên xả nước nhé.","Don't forget + to V",[
"`forget + to V` = quên làm (việc chưa làm). `forget + V-ing` = quên là đã làm."]],
["M","And wash your hands with soap.","Và rửa tay bằng xà phòng.","wash + your hands + with + N",[
"`with soap` = bằng xà phòng; `with` chỉ công cụ."]],
["K","I washed them for twenty seconds!","Con rửa hai mươi giây rồi!","V quá khứ + them + for + thời gian",[
"`washed` quá khứ. `them` = `my hands`."]]
]},

{id:"car-wash",g:"nha",t:"Chủ Nhật",en:"Washing the Car",vi:"Rửa xe cùng bố",sp:["D","K"],
scene:"Chủ Nhật nắng đẹp, bố và con ra sân rửa xe, vừa làm vừa nghịch nước.",
tip:"Làm việc ngoài trời là dịp tốt để học các động từ: spray, scrub, rinse, dry.",
vocab:[["hose","vòi nước"],["sponge","miếng bọt biển"],["bucket","cái xô"],["scrub","cọ"],["rinse","xả nước"],["shiny","sáng bóng"]],
L:[
["D","The car is so dirty. Let's wash it.","Xe bẩn quá. Mình rửa xe đi.","Let's + V + it",[
"`it` thay cho `the car`."]],
["K","Can I use the hose?","Con dùng vòi nước được không?","Can I + use + the + N?",[
"`hose` = vòi nước (ống mềm)."]],
["D","Sure, but don't spray me!","Được, nhưng đừng xịt vào bố!","don't + V + me",[
"`spray` = xịt, phun."]],
["D","First, fill the bucket with soapy water.","Đầu tiên, đổ đầy nước xà phòng vào xô.","fill + N + with + N",[
"`fill A with B` = đổ đầy B vào A.",
"`soapy` = có xà phòng (danh từ + `-y` thành tính từ: `soap → soapy`, `sun → sunny`)."]],
["K","Should I scrub the wheels?","Con cọ bánh xe nhé?","Should I + V + the + N?",[
"`scrub` = cọ mạnh."]],
["D","Yes, use the sponge. Then rinse it off.","Ừ, dùng miếng bọt biển. Rồi xả nước cho sạch.","rinse + it + off",[
"`rinse off` = xả cho trôi đi."]],
["K","Oops! I got you wet!","Ối! Con làm bố ướt rồi!","get + sb + tính từ",[
"`get + người + adj` = làm cho ai như thế nào: `got you wet`."]],
["D","Ha ha! Look, the car is shiny now.","Ha ha! Nhìn kìa, xe bóng loáng rồi.","N + is + tính từ + now",[
"`shiny` = sáng bóng (`shine → shiny`)."]]
]},

{id:"movie-night",g:"toi",t:"Tối thứ Bảy",en:"Family Movie Night",vi:"Tối xem phim cả nhà",sp:["D","M","K"],
scene:"Tối thứ Bảy cả nhà chọn phim, làm bỏng ngô và cùng xem.",
tip:"Sau khi xem phim, hỏi con ‘What was your favorite part?’ để con luyện kể bằng thì quá khứ.",
vocab:[["choose","chọn"],["popcorn","bỏng ngô"],["favorite","yêu thích"],["funny","buồn cười"],["scary","đáng sợ"],["part","đoạn, phần"]],
L:[
["D","It's movie night! Who wants to choose?","Tối nay xem phim! Ai muốn chọn phim nào?","Who + wants to + V?",[
"`Who` làm chủ ngữ nên động từ chia số ít: `Who wants`, không dùng `does`."]],
["K","Me! Can we watch an animal movie?","Con! Mình xem phim về động vật nhé?","Can we + watch + an + N?",[
"`Me!` = con! (trả lời nhanh, thân mật thay cho `I do!`)."]],
["M","Good choice. I'll make some popcorn.","Chọn hay đấy. Mẹ đi làm bỏng ngô.","I'll + make + some + N",[
"`choice` là danh từ của `choose`."]],
["K","Can I turn off the lights?","Con tắt đèn được không?","turn off + the + N",[
"Tắt đèn cho giống rạp chiếu phim."]],
["D","Sure. Is everyone comfortable?","Được. Mọi người ngồi thoải mái chưa?","Is everyone + tính từ?",[
"`everyone` là số ít: `Is everyone ready?`"]],
["K","Ha ha! That monkey is so funny!","Ha ha! Con khỉ đó buồn cười quá!","That + N + is + so + tính từ",[
"`funny` = buồn cười; `fun` = vui. **Đừng nhầm** hai từ này."]],
["M","What was your favorite part?","Đoạn nào con thích nhất?","What was + your favorite + N?",[
"Dùng quá khứ `was` vì bộ phim đã xem xong."]],
["K","I liked the part when the lion sang!","Con thích đoạn con sư tử hát!","the part + when + S + V quá khứ",[
"`sang` là quá khứ của `sing`.",
"`when` nối với `the part`: đoạn mà..."]]
]},

{id:"counting",g:"ngay",t:"Sau giờ học",en:"Fun with Numbers",vi:"Học đếm và làm toán",sp:["M","K"],
scene:"Mẹ và con chơi trò cộng trừ với những quả táo trên bàn.",
tip:"Dùng đồ vật thật (táo, kẹo) để học plus, minus, equals. Con nhớ lâu hơn khi được chạm vào.",
vocab:[["plus","cộng"],["minus","trừ"],["equal","bằng"],["count","đếm"],["left","còn lại"],["altogether","tổng cộng"]],
L:[
["M","Let's count these apples.","Mình đếm những quả táo này nhé.","Let's + V + these + N",[
"`these` + số nhiều, chỉ vật ở gần."]],
["K","One, two, three, four, five. Five apples!","Một, hai, ba, bốn, năm. Năm quả táo!","số + N số nhiều",[
"Từ hai trở lên danh từ thêm `-s`: `five apples`."]],
["M","What's three plus two?","Ba cộng hai bằng mấy?","What's + số + plus + số?",[
"`plus` = cộng; `minus` = trừ; `times` = nhân; `divided by` = chia."]],
["K","Three plus two equals five.","Ba cộng hai bằng năm.","số + plus + số + equals + số",[
"`equals` thêm `-s` vì phép tính coi là số ít. Cũng có thể nói `Three plus two is five.`"]],
["M","Good! Now if I eat one, how many are left?","Giỏi! Giờ nếu mẹ ăn một quả, còn mấy quả?","if + S + V (hiện tại), how many + are left?",[
"Câu điều kiện loại 1: `if + hiện tại đơn`."]],
["K","Five minus one is four. Four are left!","Năm trừ một bằng bốn. Còn bốn quả!","số + minus + số + is + số",[
"`left` = còn lại."]],
["M","How many apples do we have altogether with these two?","Thêm hai quả này thì tổng cộng có bao nhiêu?","How many + N + do we have + altogether?",[
"`altogether` = tổng cộng (một từ). Khác `all together` = tất cả cùng nhau."]],
["K","Six! Math is fun!","Sáu ạ! Học toán vui quá!","N + is + tính từ",[
"`Math` (Mỹ) / `Maths` (Anh) là danh từ số ít dù có `-s` ở bản Anh."]]
]},

{id:"house-tour",g:"nha",t:"Khi bạn đến chơi",en:"Our House",vi:"Giới thiệu ngôi nhà",sp:["K","F"],
scene:"Bạn cùng lớp lần đầu đến nhà. Con dẫn bạn đi xem các phòng.",
tip:"Đi một vòng quanh nhà và gọi tên từng phòng bằng tiếng Anh. Dán giấy ghi tên phòng lên cửa cũng là cách hay.",
vocab:[["living room","phòng khách"],["kitchen","nhà bếp"],["bedroom","phòng ngủ"],["upstairs","trên lầu"],["downstairs","dưới lầu"],["balcony","ban công"]],
L:[
["K","Welcome to my house! Come in.","Chào mừng đến nhà tớ! Vào đi.","Welcome to + N! Come in.",[
"`Welcome to my house!` = chào mừng đến nhà tớ. `Come in` = vào đi."]],
["F","Wow, your house is big!","Ồ, nhà cậu to thế!","your + N + is + tính từ",[
"`your` = của bạn; `you're` = bạn là. Đọc giống nhau nhưng viết khác."]],
["K","This is the living room. We watch TV here.","Đây là phòng khách. Nhà tớ xem TV ở đây.","This is + the + N. We + V + here.",[
"`here` = ở đây; `there` = ở đó."]],
["F","Where's your bedroom?","Phòng ngủ của cậu ở đâu?","Where's + your + N?",[
"`bedroom` = phòng ngủ (`bed` + `room`)."]],
["K","It's upstairs. Follow me!","Ở trên lầu. Đi theo tớ!","It's + upstairs. Follow me!",[
"`upstairs` là trạng từ nên không cần giới từ: không nói `at upstairs`."]],
["F","Cool! You have so many books.","Hay quá! Cậu có nhiều sách thế.","so many + N số nhiều",[
"`so many` + đếm được; `so much` + không đếm được."]],
["K","And there's a small balcony with flowers.","Và có cái ban công nhỏ trồng hoa.","there's + a + N + with + N",[
"`with flowers` = có hoa."]],
["F","I love your house!","Tớ thích nhà cậu lắm!","I love + N",[
"`love` mạnh hơn `like`."]]
]},

{id:"playdate",g:"nha",t:"Chiều thứ Bảy",en:"A Friend Comes to Play",vi:"Bạn đến nhà chơi",sp:["M","F","K"],
scene:"Bạn của con đến nhà chơi. Mẹ mời nước, hai bạn chọn trò chơi.",
tip:"Đây là dịp con học cách làm chủ nhà: mời bạn, hỏi bạn muốn chơi gì, và nhường bạn.",
vocab:[["guest","khách"],["Would you like...?","bạn có muốn...?"],["juice","nước ép"],["toy","đồ chơi"],["pick","chọn"],["come again","đến chơi nữa"]],
L:[
["M","Hello! Come on in. Make yourself at home.","Chào cháu! Vào đi cháu. Cứ tự nhiên như ở nhà.","Make yourself at home",[
"`Make yourself at home` = cứ tự nhiên như ở nhà. Câu chủ nhà hay nói với khách.",
"`Come on in` thân mật hơn `Come in`."]],
["F","Thank you!","Cháu cảm ơn ạ!","Thank you",[
"Đáp lời mời bằng `Thank you` là đủ lịch sự."]],
["M","Would you like some juice?","Cháu có muốn uống nước ép không?","Would you like + some + N?",[
"`Would you like...?` = bạn có muốn...? lịch sự hơn `Do you want...?`",
"Dùng `some` trong lời mời."]],
["F","Yes, please. Orange juice, please.","Vâng ạ. Cho cháu nước cam.","Yes, please.",[
"Nhận lời mời: `Yes, please.` Từ chối: `No, thank you.`"]],
["K","What do you want to play?","Cậu muốn chơi gì?","What do you want to + V?",[
"`want to + V` = muốn làm gì."]],
["F","Let's play with your toy cars!","Chơi ô tô đồ chơi của cậu đi!","play with + N",[
"`play with + đồ chơi` = chơi với cái gì."]],
["K","Okay. You can pick first.","Được. Cậu chọn trước đi.","You can + V + first",[
"Nhường bạn chọn trước là phép lịch sự của chủ nhà."]],
["F","Thanks for having me. Can I come again?","Cảm ơn đã mời tớ. Lần sau tớ lại đến được không?","Thanks for having me",[
"`Thanks for having me` = cảm ơn vì đã mời tôi đến. Câu khách nói khi ra về."]]

{id:"running-late",g:"sang",t:"7:25",en:"We're Late!",vi:"Muộn giờ rồi!",sp:["M","K"],

const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

const CONTR={"let's":"let us","it's":"it is","that's":"that is","what's":"what is","where's":"where is","here's":"here is","there's":"there is","he's":"he is","she's":"she is","who's":"who is","can't":"can not","won't":"will not","i'm":"i am","dinner's":"dinner is","how's":"how is"};
const SYN={ok:"okay",mum:"mom",mommy:"mom",mummy:"mom",daddy:"dad",cannot:"can not",pyjamas:"pajamas",colour:"color",grey:"gray",tshirt:"t shirt"};
function norm(s){
  s=s.toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d),(\d)/g,"$1$2").replace(/\b(\d{1,2}):00\b/g,"$1 o'clock").replace(/\b\d+\b/g,m=>n2w(+m));
  s=s.replace(/[a-z]+'[a-z]+/g,w=>CONTR[w]||w.replace(/n't$/," not").replace(/'re$/," are").replace(/'ve$/," have").replace(/'ll$/," will").replace(/'d$/," would").replace(/'s$/,""));
  s=s.replace(/-/g," ").replace(/[^a-z0-9' ]+/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).map(w=>SYN[w]||w).join(" ").split(" ").filter(Boolean);
}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const eq=(a,b)=>a===b||(a.length>4&&b.length>4&&lev(a,b)<=1);

  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(eq(t[i],h[j])){ok[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  const matched=ok.filter(Boolean).length;
  const extra=Math.max(0,m-matched-Math.ceil(n*.25));
  const sc=n?Math.max(0,Math.round(100*matched/n)-extra*3):0;
  const html=disp.map((w,k)=>{const idx=own.map((o,q)=>o===k?q:-1).filter(q=>q>=0);if(!idx.length)return esc(w);const c=idx.filter(q=>ok[q]).length;const cls=c===idx.length?"w-ok":c?"w-part":"w-miss";return `<span class="${cls}">${esc(w)}</span>`}).join(" ");
