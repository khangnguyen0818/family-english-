"Thời tiết luôn dùng `it` làm chủ ngữ: `It's sunny`, `It's cloudy`, `It's windy`.",
"`sunny` là tính từ của `sun` (thêm `-ny`, gấp đôi n). Tương tự: rain → rainy, cloud → cloudy, wind → windy.",
"`might rain` = có thể mưa (không chắc). `rain` ở đây là động từ."]],
["K","Should I bring my umbrella?","Con có nên mang ô không?","Should I + V?",[
"**`bring` hay `take`?** `bring` = mang **theo mình** hoặc mang **đến chỗ người nói**. `take` = mang **đi** khỏi đây. Ở đây dùng được cả hai; `take my umbrella` nhấn mạnh mang đi khỏi nhà.",
"`umbrella` bắt đầu bằng âm nguyên âm nên nói `an umbrella`."]],
["D","Yes, it's better to be safe.","Có, cẩn thận vẫn hơn con ạ.","It's better to + V",[
"`It's better to + V` = làm gì thì tốt hơn.",
"`better to be safe` là câu rút gọn của thành ngữ `Better safe than sorry` (cẩn tắc vô áy náy)."]],
["K","Look, it's raining cats and dogs!","Nhìn kìa, mưa như trút nước!","It's + V-ing (đang diễn ra)",[
"**Hiện tại tiếp diễn** vì mưa đang diễn ra ngay lúc nói.",
"`raining cats and dogs` là **thành ngữ**: mưa rất to, không liên quan tới chó mèo. Trẻ con rất thích câu này vì buồn cười.",
"Cách nói thông thường: `It's raining heavily` hoặc `It's pouring`."]],
["D","Let's stay inside until the rain stops.","Mình ở trong nhà cho đến khi tạnh mưa nhé.","until + hiện tại đơn",[
"`until` = cho đến khi.",
"**Vì sao `until the rain stops` mà không phải `until the rain will stop`?** Giống `if`, sau `until`, `when`, `before`, `after` dùng **hiện tại đơn** để nói về tương lai.",
"`stops` thêm `-s` vì `the rain` là ngôi ba số ít. `rain` ở đây là danh từ."]],
["K","Wow, there's a rainbow in the sky!","Ôi, có cầu vồng trên trời kìa!","There is + a + N số ít",[
"`There is` + danh từ số ít = có cái gì (ở đâu). Số nhiều: `There are two rainbows.`",
"`in the sky` = trên bầu trời. Tiếng Anh dùng `in` (trong bầu trời), không dùng `on`."]],
["D","It's beautiful. Rainbows usually come after the rain.","Đẹp quá. Cầu vồng thường xuất hiện sau cơn mưa.","S + usually + V (hiện tại đơn)",[
"**Hiện tại đơn** dùng cho sự thật, quy luật chung.",
"`Rainbows` số nhiều, không có `the` khi nói chung về cầu vồng.",
"Trạng từ tần suất (`always`, `usually`, `often`, `sometimes`, `never`) đứng **trước động từ thường** và **sau động từ `be`**: `They usually come`, `It is usually sunny`."]]
]},

{id:"birthday",g:"ngoai",t:"Dịp đặc biệt",en:"Birthday Party",vi:"Tiệc sinh nhật",sp:["D","K","G"],
scene:"Sinh nhật bảy tuổi của con. Bà tặng quà, cả nhà thổi nến và cắt bánh.",
tip:"Tổ chức sinh nhật nhỏ ‘toàn tiếng Anh’ trong nhà: cả nhà cùng hát Happy Birthday và mỗi người chúc con một câu tiếng Anh.",
vocab:[["present / gift","quà"],["How old...?","bao nhiêu tuổi"],["make a wish","ước"],["blow out the candles","thổi nến"],["the best... ever","... nhất từ trước tới nay"],["the first piece","miếng đầu tiên"]],
L:[
["D","Happy birthday, my dear! How old are you today?","Chúc mừng sinh nhật con yêu! Hôm nay con mấy tuổi rồi?","How old + are + you?",[
"`How old` dùng để hỏi tuổi. Động từ là `be`: `How old are you?`, không nói `How old do you have?` (lỗi dịch từ một số ngôn ngữ khác).",
"`my dear` = con yêu, cách gọi trìu mến."]],
["K","I'm seven years old!","Con bảy tuổi rồi!","I'm + số + years old",[
"**Vì sao `years` có `-s`?** Từ 2 trở lên thì `years` ở số nhiều. Có thể bỏ hẳn: `I'm seven.`",
"Không nói `I'm seven years` (thiếu `old`) hoặc `I have seven years`.",
"Lưu ý: khi làm tính từ đứng trước danh từ thì không có `-s`: `a seven-year-old girl`."]],
["G","This present is for you. I hope you like it.","Quà này của cháu đây. Bà mong cháu thích.","be for + người   |   hope + (that) + S + V",[
"`for you` = dành cho cháu.",
"`I hope you like it` = Bà mong cháu thích nó. Sau `hope` là một mệnh đề ở hiện tại đơn (hoặc `will`). `that` thường được bỏ.",
"`present` (danh từ, quà) nhấn âm đầu: PRE-sent."]],
["K","Thank you, Grandma! Can I open it now?","Cháu cảm ơn bà! Cháu mở ra bây giờ được không ạ?","Can I + V + it + now?",[
"`Grandma` viết hoa vì dùng như tên riêng khi gọi trực tiếp.",
"Ở nhiều nước phương Tây, mở quà ngay trước mặt người tặng là phép lịch sự."]],
["K","Wow, a new bike! It's the best present ever!","Ôi, xe đạp mới! Đây là món quà tuyệt nhất từ trước đến nay!","the + so sánh nhất + N + ever",[
"`the best` là so sánh nhất bất quy tắc của `good` (good → better → best). So sánh nhất luôn có `the`.",
"`ever` cuối câu = từ trước tới giờ, nhấn mạnh.",
"Tính từ `new` đứng trước danh từ: `a new bike`."]],
["D","Make a wish and blow out the candles!","Ước một điều rồi thổi nến đi con!","make a wish   |   blow out + the + N",[
"**Vì sao `make a wish` mà không phải `do a wish`?** Đây là collocation cố định với `make`. Nhóm `make`: `make a wish`, `make a mistake`, `make friends`, `make noise`.",
"`blow out` = thổi tắt. Với đại từ: `blow them out`."]],
["K","I wish we could have a party every day!","Ước gì ngày nào mình cũng có tiệc!","I wish + S + could/V2 (điều không có thật)",[
"**Vì sao `could` mà không phải `can`?** Sau `I wish` để nói điều **không có thật ở hiện tại**, động từ lùi một thì về quá khứ: `can` → `could`, `am` → `were`: `I wish I were taller.`",
"`every day` (hai từ) = mỗi ngày. Viết liền `everyday` là tính từ (hằng ngày): `everyday English`.",
"Đây là cấu trúc nâng cao, nhưng trẻ con dùng rất tự nhiên khi học thuộc cả câu."]],
["G","Let's cut the cake. Who wants the first piece?","Cắt bánh nào. Ai muốn ăn miếng đầu tiên?","Who + V-s?",[
"`Who wants...?`: `who` làm chủ ngữ nên không cần `do`, động từ thêm `-s`.",
"`the first piece`: số thứ tự (`first`, `second`) đi với `the`.",
"`a piece of cake` = một miếng bánh. Đây cũng là thành ngữ nghĩa là ‘dễ ợt’."]]
]},

{id:"video-call",g:"ngoai",t:"Cuối tuần",en:"Calling Grandpa",vi:"Gọi video cho ông",sp:["K","P","M"],
scene:"Con gọi video cho ông ở quê, kể chuyện học tiếng Anh, mẹ hẹn cuối tuần về thăm.",
tip:"Nếu ông bà biết vài câu tiếng Anh, nhờ ông bà hỏi con một hai câu. Con sẽ có lý do thật để nói, không chỉ là bài học.",
vocab:[["Can you hear me?","Ông có nghe rõ không?"],["clearly","rõ ràng"],["miss","nhớ (người)"],["lately","dạo này"],["visit","thăm"],["can't wait to...","rất mong được..."]],
L:[
["K","Hi, Grandpa! Can you hear me?","Cháu chào ông! Ông có nghe thấy cháu không?","Can you + V + me?",[
"`Can you hear me?` là câu đầu tiên quen thuộc trong mọi cuộc gọi video.",
"**`hear` hay `listen`?** `hear` = nghe thấy (âm thanh tự đến tai). `listen` = lắng nghe có chủ đích, luôn đi với `to`: `listen to music`."]],
["P","Yes, I can hear you clearly. How are you?","Có, ông nghe rõ lắm. Cháu khỏe không?","S + can + V + O + trạng từ",[
"`clearly` (trạng từ) bổ nghĩa cho `hear`, đứng cuối câu sau tân ngữ.",
"`How are you?` hỏi thăm sức khỏe, tâm trạng. Khác `How old are you?` (hỏi tuổi)."]],
["K","I'm fine, thank you. I miss you a lot!","Cháu khỏe ạ. Cháu nhớ ông nhiều lắm!","miss + người + a lot",[
"Ngoài `I'm fine`, có thể nói `I'm great`, `I'm good`, `Not bad`.",
"`miss` = nhớ (người, nơi chốn đang xa). **Phân biệt:** `remember` = nhớ ra, không quên. `I remember you` = cháu vẫn nhớ ông là ai.",
"`a lot` = nhiều, đặt cuối câu."]],
["P","I miss you too. What have you been doing lately?","Ông cũng nhớ cháu. Dạo này cháu làm gì?","What + have + S + been + V-ing + lately?",[
"**Hiện tại hoàn thành tiếp diễn** (`have been + V-ing`) dùng cho hoạt động **kéo dài từ một lúc nào đó đến bây giờ** và có thể còn tiếp tục.",
"`lately` = dạo gần đây, thường đi với thì hoàn thành.",
"Đây là thì khó; cách học tốt nhất là thuộc cả câu hỏi này như một cụm."]],
["K","I've been learning English with Mom every evening.","Cháu học tiếng Anh với mẹ mỗi tối ạ.","S + have been + V-ing",[
"Trả lời bằng cùng thì với câu hỏi: `I've been learning` = cháu đã và đang học (vẫn còn tiếp tục).",
"`English` luôn viết hoa (tên ngôn ngữ), không có `the`.",
"`every evening` = mỗi tối. `every` + danh từ số ít."]],
["P","That's wonderful! Say something in English for me.","Tuyệt quá! Nói gì đó bằng tiếng Anh cho ông nghe nào.","Say + something + in + ngôn ngữ",[
"`in English` = bằng tiếng Anh. Giới từ với ngôn ngữ là `in`: `in Vietnamese`, `in French`.",
"**`say` hay `tell`?** `say something` không có người nghe đứng ngay sau. Nếu có người thì dùng `for me` hoặc `to me`."]],
["M","We will visit you next weekend.","Cuối tuần sau cả nhà sẽ về thăm bố ạ.","S + will + V + next + N",[
"`will` cho kế hoạch, lời hứa trong tương lai. Có thể dùng `We're visiting you next weekend` nếu đã sắp xếp chắc chắn.",
"**Vì sao `visit you` mà không phải `visit to you`?** `visit` nhận tân ngữ trực tiếp, không cần giới từ.",
"`next weekend` không có giới từ: không nói `in next weekend`."]],
["P","I can't wait to see you!","Ông mong gặp cả nhà lắm!","can't wait to + V",[
"`can't wait to + V` = rất mong, nóng lòng được làm gì. Nghĩa đen là ‘không thể đợi được’.",
"Cấu trúc tương đương trang trọng hơn: `I'm looking forward to seeing you` (sau `to` dùng `V-ing`)."]]
]},

{id:"airport",g:"dulich",t:"Ngày khởi hành",en:"At the Airport",vi:"Ở sân bay",sp:["D","K","O"],
scene:"Cả nhà bay đi Đà Nẵng. Ở quầy làm thủ tục, nhân viên kiểm tra giấy tờ và báo cửa ra máy bay.",
tip:"Trước chuyến đi, đóng vai làm thủ tục ở nhà với ‘vé’ tự làm. Đến sân bay thật, con sẽ nhận ra những câu đã học.",
vocab:[["fly to","bay đến"],["excited","hào hứng"],["passport","hộ chiếu"],["boarding pass","thẻ lên máy bay"],["gate","cửa ra máy bay"],["take off","cất cánh"]],
L:[
["D","We're flying to Da Nang tomorrow. Are you excited?","Mai cả nhà bay đi Đà Nẵng. Con có háo hức không?","be + V-ing + thời gian tương lai",[
"**Hiện tại tiếp diễn** dùng cho **kế hoạch tương lai đã sắp xếp chắc chắn** (đã mua vé). Đây là cách nói tự nhiên nhất trong trường hợp này.",
"**`excited` hay `exciting`?** Hỏi về cảm xúc của con nên dùng `-ed`: `Are you excited?`. Chuyến đi gây ra cảm xúc thì dùng `-ing`: `The trip is exciting.`",
"`fly to` + địa điểm: bay đến đâu."]],
["K","Yes! Have you packed my swimsuit?","Có ạ! Bố đã xếp đồ bơi cho con chưa?","Have + S + V3?",[
"**Hiện tại hoàn thành** để hỏi việc đã xong chưa (kết quả quan trọng bây giờ).",
"`swimsuit` = đồ bơi. Tương tự: `swimming trunks` (quần bơi nam)."]],
["O","Good morning. May I see your ID cards and tickets, please?","Chào anh. Cho tôi xem căn cước và vé của gia đình ạ.","May I + V + O, please?",[
"Nhân viên dùng `May I` để yêu cầu một cách lịch sự, trang trọng.",
"Chuyến bay quốc tế sẽ là `passports` (hộ chiếu). `ID card` = thẻ căn cước.",
"`your ID cards and tickets`: một `your` dùng chung cho cả hai danh từ."]],
["D","Here they are.","Đây ạ.","Here + they + are",[
"**Vì sao `Here they are` mà không phải `Here are they`?** Khi chủ ngữ là **đại từ**, đại từ đứng trước động từ: `Here they are`, `Here it is`. Khi là danh từ thì đảo: `Here are the tickets.`",
"Dùng `they` vì đưa nhiều giấy tờ (số nhiều)."]],
["O","Your gate is number five. Boarding starts at nine.","Cửa ra máy bay số năm. Chín giờ bắt đầu lên máy bay.","Hiện tại đơn cho lịch trình",[
"**Vì sao `starts` (hiện tại đơn) mà không phải `will start`?** Lịch trình cố định (tàu xe, máy bay, giờ học) dùng **hiện tại đơn** dù nói về tương lai: `The train leaves at 7.`",
"`at nine` = lúc chín giờ. Giờ cụ thể dùng `at`.",
"`boarding` = việc lên máy bay; `board` (động từ) = lên tàu, xe, máy bay."]],
["K","Dad, how long is the flight?","Bố ơi, chuyến bay mất bao lâu ạ?","How long + is + N?",[
"`How long` hỏi về khoảng thời gian (hoặc chiều dài).",
"`flight` = chuyến bay (danh từ của `fly`)."]],
["D","It takes about one hour and twenty minutes.","Mất khoảng một tiếng hai mươi phút.","It takes + thời gian",[
"`It takes + thời gian` = mất bao lâu. Mở rộng: `It takes me ten minutes to walk to school.`",
"`about` = khoảng, xấp xỉ.",
"`one hour` dùng `hour` số ít; `twenty minutes` số nhiều."]],
["K","Look! The plane is taking off!","Nhìn kìa! Máy bay đang cất cánh!","be + V-ing (đang diễn ra)",[
"Hiện tại tiếp diễn vì máy bay đang cất cánh ngay trước mắt.",
"`take off` với máy bay nghĩa là **cất cánh**; với quần áo là **cởi ra**. Ngược với cất cánh là `land` (hạ cánh).",
"Cùng một cụm động từ có thể có nhiều nghĩa; ngữ cảnh quyết định nghĩa."]]
]},

{id:"hotel-beach",g:"dulich",t:"Kỳ nghỉ",en:"Hotel and Beach",vi:"Khách sạn và bãi biển",sp:["M","R","K"],
scene:"Nhận phòng khách sạn, rồi mẹ con ra biển bôi kem chống nắng, tắm biển và xây lâu đài cát.",
tip:"Ở biển, để con tự đặt câu với ‘Let's...’: Let's swim, let's build, let's collect shells. Rủ nhau là cách nói con dùng nhiều nhất khi chơi.",
vocab:[["reservation","đặt phòng trước"],["floor","tầng"],["sunscreen","kem chống nắng"],["too far","xa quá"],["sandcastle","lâu đài cát"],["take a photo","chụp ảnh"]],
L:[
["M","Hi, we have a reservation under the name Nguyen.","Chào em, chị đã đặt phòng tên Nguyễn.","have a reservation + under the name + tên",[
"`reservation` = việc đặt chỗ trước (phòng, bàn). Có thể dùng `booking` (Anh).",
"`under the name...` = đứng tên ai. Đây là cách nói cố định khi nhận phòng, nhận bàn."]],
["R","Welcome! Your room is on the fifth floor.","Chào mừng chị! Phòng của chị ở tầng năm.","on + the + số thứ tự + floor",[
"**Vì sao `on` mà không phải `in` hay `at`?** Với tầng nhà luôn dùng `on`: `on the first floor`, `on the top floor`.",
"Dùng **số thứ tự** (`fifth`) chứ không dùng số đếm (`five`).",
"Lưu ý: ở Anh `ground floor` là tầng trệt, `first floor` là tầng hai kiểu Việt Nam. Ở Mỹ `first floor` là tầng trệt."]],
["K","Mom, can we go to the beach now?","Mẹ ơi, mình ra biển bây giờ được không?","Can we + go to the + N + now?",[
"`go to the beach` có `the`.",
"Lặp lại mẫu `Can we...?` để con quen phản xạ đề nghị."]],
["M","Let's put on sunscreen first. The sun is very strong.","Mình bôi kem chống nắng trước đã. Nắng gắt lắm.","Let's + V + first",[
"`put on` = mặc, đeo, **bôi** (lên người). `put on sunscreen`, `put on glasses`, `put on a hat`.",
"`strong sun` = nắng gắt (tiếng Anh nói mặt trời ‘mạnh’).",
"`the sun` luôn có `the` vì chỉ có một mặt trời."]],
["K","The water is so cool! Come and swim with me!","Nước mát quá! Mẹ xuống bơi với con đi!","so + tính từ   |   Come and + V",[
"`cool` ở đây = mát (nhiệt độ). Văn nói, `cool` còn có nghĩa ‘tuyệt, ngầu’.",
"`Come and swim` = lại đây bơi. `with me` = cùng con."]],
["M","Don't go too far. Stay where I can see you.","Đừng ra xa quá. Ở chỗ mẹ nhìn thấy con nhé.","Don't + V + too + adj/adv   |   where + S + V",[
"`too far` = xa quá.",
"`where I can see you` là mệnh đề trạng ngữ chỉ nơi chốn: ở nơi mà mẹ có thể nhìn thấy con. Không đảo ngữ sau `where` trong mệnh đề này.",
"`stay` = ở yên, ở lại."]],
["K","Let's build a sandcastle together!","Mình cùng xây lâu đài cát đi!","Let's + V + together",[
"`sandcastle` = `sand` (cát) + `castle` (lâu đài). Chữ `t` trong `castle` câm, đọc /ˈkɑːsəl/.",
"`build` = xây, đọc /bɪld/ (chữ `u` không đọc)."]],
["M","What a beautiful sandcastle! Let's take a photo.","Lâu đài cát đẹp quá! Mình chụp ảnh nhé.","What a + tính từ + N!",[
"Câu **cảm thán** với danh từ đếm được số ít: `What a + tính từ + N!` Với danh từ số nhiều/không đếm được thì bỏ `a`: `What beautiful flowers!`",
"Câu cảm thán với tính từ đứng một mình dùng `How`: `How beautiful!`",
"**Vì sao `take a photo` mà không phải `make a photo`?** Collocation tiếng Anh là `take a photo` / `take a picture`."]]
]},

{id:"sick",g:"khac",t:"Khi con ốm",en:"Feeling Sick",vi:"Bị ốm, đi khám bác sĩ",sp:["M","K","X"],
scene:"Con mệt và sốt. Mẹ đưa con đi khám, bác sĩ hỏi triệu chứng và dặn uống thuốc.",
tip:"Dạy con nói được bộ phận nào đau bằng câu ‘My ... hurts’. Đây là câu quan trọng cho sự an toàn của con khi ở môi trường nói tiếng Anh.",
vocab:[["What's wrong?","Con bị làm sao?"],["feel well","thấy khỏe"],["hurt","đau"],["have a fever","bị sốt"],["sore throat","đau họng"],["take medicine","uống thuốc"]],
L:[
["M","What's wrong, honey? You look pale.","Con bị sao thế? Trông con xanh xao quá.","What's wrong?   |   look + tính từ",[
"`What's wrong?` = Có chuyện gì vậy? Bị làm sao? Dùng khi thấy ai đó không ổn. Tương tự: `What's the matter?`",
"`look pale` = trông xanh xao. Lại là động từ nối `look` + tính từ."]],
["K","I don't feel well. My head hurts.","Con thấy không khỏe. Con đau đầu.","S + don't feel well   |   N + hurts",[
"**Vì sao `feel well` mà không phải `feel good`?** Khi nói về **sức khỏe**, `well` là tính từ nghĩa là khỏe mạnh: `I don't feel well.` `I don't feel good` cũng hay nghe trong văn nói Mỹ.",
"`My head hurts` = đầu con đau. `hurt` là động từ; thêm `-s` vì `my head` ngôi ba số ít. Có thể nói `I have a headache.`",
"Áp dụng cho mọi bộ phận: `My tummy hurts`, `My leg hurts`."]],
["M","Let me check your temperature. Oh, you have a fever.","Để mẹ đo nhiệt độ. Ôi, con sốt rồi.","Let me + V   |   have a + bệnh",[
"`check your temperature` = đo nhiệt độ.",
"Nói về bệnh thường dùng `have`: `have a fever`, `have a cold`, `have a cough`, `have a headache`. Không nói `I am fever`."]],
["X","Hello! Can you tell me where it hurts?","Chào cháu! Cháu cho bác biết cháu đau ở đâu nào?","Can you tell me + where + S + V? (câu hỏi gián tiếp)",[
"**Câu hỏi gián tiếp**: khi câu hỏi nằm trong một câu khác (`Can you tell me...`), phần sau **không đảo ngữ**.",
"Câu hỏi trực tiếp: `Where does it hurt?` → gián tiếp: `Can you tell me where it hurts?` (không nói `where does it hurt`).",
"Câu hỏi gián tiếp nghe lịch sự, nhẹ nhàng hơn, bác sĩ hay dùng với trẻ."]],
["K","My throat is sore, and I have a cough.","Cháu bị đau họng và bị ho.","N + is + sore   |   have a cough",[
"`sore` = đau, rát (do viêm, mỏi). `My throat is sore` = `I have a sore throat`.",
"`cough` đọc /kɒf/, `gh` đọc như `f` (giống `laugh`, `enough`)."]],
["X","It's just a cold. Take this medicine three times a day.","Cháu chỉ bị cảm thôi. Uống thuốc này ngày ba lần nhé.","take + medicine   |   số lần + a + day",[
"**Vì sao `take medicine` mà không phải `drink medicine`?** Tiếng Anh dùng `take` cho thuốc dù là viên hay nước.",
"`three times a day` = ngày ba lần. `a day` = mỗi ngày. Một lần là `once`, hai lần là `twice`.",
"`a cold` = cảm lạnh (đếm được khi là bệnh); `cold` (tính từ) = lạnh."]],
["M","Thank you, doctor. You need to rest and drink lots of water.","Cảm ơn bác sĩ. Con cần nghỉ ngơi và uống nhiều nước nhé.","need to + V + and + V   |   lots of + N",[
"Có thể gọi bác sĩ là `doctor` (không viết hoa khi dùng như danh từ chung).",
"`lots of` = `a lot of` = nhiều, dùng được với cả danh từ đếm được và không đếm được.",
"Một `need to` dùng chung cho hai động từ `rest` và `drink`."]],
["K","I hope I get better soon.","Con mong con sẽ sớm khỏe lại.","hope + S + V (hiện tại)   |   get better",[
"Sau `hope` có thể dùng hiện tại đơn để nói về tương lai: `I hope I get better` (cũng đúng: `I hope I will get better`).",
"`get better` = khỏe lên, tốt lên. Lời chúc người ốm: `Get well soon!`"]]
]},

{id:"feelings",g:"khac",t:"Khi con buồn",en:"Talking About Feelings",vi:"Nói về cảm xúc",sp:["M","K"],
scene:"Con đi học về buồn vì bạn không chơi cùng. Mẹ lắng nghe và an ủi con.",
tip:"Treo một bảng cảm xúc bằng tiếng Anh: happy, sad, angry, scared, excited, tired. Mỗi tối hỏi con ‘How do you feel today?’ và để con chỉ vào bảng.",
vocab:[["upset","buồn, khó chịu"],["What happened?","Có chuyện gì vậy?"],["sad","buồn"],["angry","tức giận"],["It's okay to...","... cũng không sao"],["I'm here for you","mẹ luôn ở bên con"]],
L:[
["M","You look upset. What happened?","Trông con buồn thế. Có chuyện gì vậy?","look + tính từ   |   What + V2?",[
"`upset` = buồn bực, khó chịu (nhẹ hơn `angry`).",
"**Vì sao `What happened?` mà không phải `What did happen?`** `what` là **chủ ngữ** (cái gì đã xảy ra), nên không dùng `did`, động từ chia quá khứ luôn. Giống `Who knows?` ở chủ đề lớp học."]],
["K","My friend didn't want to play with me.","Bạn con không muốn chơi với con.","S + didn't + want to + V",[
"`didn't want` = không muốn (quá khứ). Sau `didn't` dùng nguyên mẫu `want`.",
"`play with me` = chơi với con."]],
["M","Oh, I'm sorry to hear that. How do you feel?","Ôi, mẹ tiếc khi nghe vậy. Con thấy thế nào?","I'm sorry to hear that   |   How do you feel?",[
"**`I'm sorry` không chỉ là xin lỗi.** `I'm sorry to hear that` = mẹ rất tiếc khi nghe điều đó, dùng để **chia buồn, đồng cảm**.",
"`How do you feel?` hỏi cảm xúc. Lưu ý: không nói `How do you feel like?`"]],
["K","I feel sad and a little angry.","Con thấy buồn và hơi tức.","feel + tính từ + and + a little + tính từ",[
"`feel` là động từ nối, theo sau là tính từ: `feel sad`, `feel happy`.",
"`a little` + tính từ = hơi, một chút. Tương tự: `a bit angry`.",
"Dạy con gọi tên cảm xúc bằng lời là kỹ năng quan trọng, không chỉ là tiếng Anh."]],
["M","It's okay to feel sad sometimes.","Thỉnh thoảng thấy buồn cũng không sao đâu con.","It's okay to + V",[
"`It's okay to + V` = làm gì cũng không sao, cũng bình thường.",
"`sometimes` = thỉnh thoảng; có thể đặt đầu hoặc cuối câu."]],
["M","Maybe you can talk to her tomorrow.","Có lẽ mai con thử nói chuyện với bạn ấy xem.","Maybe + S + can + V",[
"**`maybe` hay `may be`?** `maybe` (viết liền) là trạng từ = có lẽ, đứng đầu câu. `may be` (hai từ) là động từ: `She may be sad too.`",
"`talk to` + người = nói chuyện với ai. `her` là tân ngữ thay cho bạn gái; nếu là bạn trai thì `him`."]],
["K","You're right. Can I have a hug?","Mẹ nói đúng. Mẹ ôm con được không?","You're right   |   Can I have + N?",[
"`You're right` = mẹ nói đúng. `right` ở đây là tính từ nghĩa là đúng.",
"`Can I have a hug?` = con được ôm một cái không? Cùng mẫu với xin đồ ăn."]],
["M","Of course. I'm always here for you.","Tất nhiên rồi. Mẹ luôn ở đây vì con.","S + be + always + ...",[
"**Vị trí của `always`:** đứng **sau** động từ `be` (`I'm always here`) nhưng **trước** động từ thường (`I always love you`).",
"`here for you` = ở đây vì con, sẵn sàng giúp con. Đây là câu an ủi rất ấm áp trong tiếng Anh."]]
]},

{id:"snack-time",g:"nha",t:"15:30",en:"Snack Time",vi:"Giờ ăn vặt",sp:["K","M"],
scene:"Buổi chiều con đói, xin mẹ đồ ăn nhẹ. Mẹ cho chọn trái cây và nhắc vứt vỏ đúng chỗ.",
tip:"Luôn cho con chọn giữa hai thứ bằng câu ‘Would you like A or B?’. Con buộc phải nói tên món bằng tiếng Anh mới được ăn.",
vocab:[["snack","đồ ăn nhẹ"],["peel","bóc vỏ / vỏ"],["myself","tự mình"],["bin","thùng rác"],["cookies","bánh quy"],["soon","sắp, chẳng mấy chốc"]],
L:[
["K","Mom, I'm hungry. Can I have a snack?","Mẹ ơi, con đói. Con ăn chút gì được không?","Can I have + a + N?",[
"`hungry` là tính từ nên cần `am`: `I'm hungry`. Không nói `I hungry`.",
"`a snack` = một món ăn nhẹ (đếm được). Câu `Can I have...?` dùng lại ở mọi tình huống xin đồ."]],
["M","Would you like an apple or a banana?","Con muốn ăn táo hay chuối?","Would you like + A + or + B?",[
"Câu hỏi lựa chọn: `A or B?`. Giọng **lên** ở A và **xuống** ở B.",
"**Vì sao `an apple` nhưng `a banana`?** Chọn `a/an` theo **âm đầu**: `apple` bắt đầu bằng nguyên âm /æ/ → `an`; `banana` bắt đầu bằng phụ âm /b/ → `a`."]],
["K","A banana, please. Can I peel it myself?","Chuối ạ. Con tự bóc được không?","V + it + myself",[
"Trả lời ngắn bằng danh từ + `please` là đủ lịch sự.",
"`myself` là **đại từ phản thân**, ở đây nhấn mạnh ‘tự con làm, không cần ai giúp’. Bộ đầy đủ: myself, yourself, himself, herself, ourselves, themselves.",
"`peel` vừa là động từ (bóc vỏ) vừa là danh từ (cái vỏ)."]],
["M","Sure. Don't throw the peel on the floor.","Được. Đừng vứt vỏ xuống sàn nhé.","Don't + V + O + on + N",[
"`the peel` ở đây là danh từ: cái vỏ chuối.",
"`on the floor` = xuống sàn. Sàn là mặt phẳng nên dùng `on`."]],
["K","Where should I put it?","Con để nó ở đâu ạ?","Where + should + I + V?",[
"Hỏi ý kiến, chỉ dẫn với `should`.",
"`put` cần có nơi chốn đi kèm: `put it in the bin`, `put it on the table`. Không nói `put it` một mình."]],
["M","Put it in the bin, please.","Con bỏ vào thùng rác nhé.","Put + it + in + the + N",[
"`bin` (Anh) = `trash can` (Mỹ). Hai từ đều phổ biến.",
"`in the bin` = vào trong thùng rác."]],
["K","Can I have some cookies too?","Con ăn thêm bánh quy được không?","some + N số nhiều + too",[
"`cookies` (Mỹ) = `biscuits` (Anh). Đếm được nên thêm `-s`.",
"`too` cuối câu = cũng, thêm nữa."]],
["M","Just two. We're having dinner soon.","Hai cái thôi. Sắp ăn tối rồi.","Just + số   |   be having + bữa ăn + soon",[
"`Just two` = chỉ hai cái thôi. Câu đầy đủ: `You can have just two cookies.`",
"`We're having dinner soon`: hiện tại tiếp diễn cho việc sắp xảy ra đã định. `soon` = sắp, chẳng bao lâu nữa."]]
]},

{id:"lost-item",g:"nha",t:"Cả ngày",en:"Where's My Teddy?",vi:"Tìm đồ bị mất",sp:["K","M"],
scene:"Con không tìm thấy gấu bông. Mẹ hỏi lần cuối thấy ở đâu và hai mẹ con cùng đi tìm.",
tip:"Chơi trò giấu đồ: bố mẹ giấu một món, con hỏi ‘Is it under the bed?’, ‘Is it in the box?’. Con sẽ thuộc hết các giới từ chỉ vị trí.",
vocab:[["can't find","không tìm thấy"],["last see","nhìn thấy lần cuối"],["leave (left)","để quên"],["look for","tìm"],["found","đã tìm thấy"],["put away","cất đi"]],
L:[
["K","Mom, I can't find my teddy bear anywhere!","Mẹ ơi, con tìm mãi không thấy gấu bông đâu!","can't find + N + anywhere",[
"`anywhere` dùng trong câu phủ định: không thấy ở đâu cả.",
"`teddy bear` = gấu bông."]],
["M","When did you last see it?","Lần cuối con thấy nó là khi nào?","When + did + S + last + V?",[
"`last` ở đây là trạng từ nghĩa là ‘lần cuối’, đứng **giữa chủ ngữ và động từ chính**: `When did you last see it?`",
"Có thể nói cách khác: `When was the last time you saw it?`"]],
["K","I think I left it in the living room.","Con nghĩ con để quên nó ở phòng khách.","I think + (that) + S + V2",[
"**Vì sao `left` mà không phải `forgot`?** Khi nói để quên đồ **ở một nơi**, tiếng Anh dùng `leave` (left): `I left my bag at school.` Không nói `I forgot my bag at school`. `forget` dùng khi không nói nơi chốn: `I forgot my bag.`",
"Sau `I think` có một mệnh đề đầy đủ; `that` thường được bỏ."]],
["M","Have you looked under the sofa?","Con đã tìm dưới gầm ghế sofa chưa?","Have + S + V3?",[
"Hiện tại hoàn thành hỏi việc **đã làm chưa** tính đến bây giờ.",
"`look under` = nhìn, tìm dưới. `look` đi với giới từ chỉ nơi: `look in`, `look behind`, `look under`."]],
["K","Yes, I have, but it isn't there.","Rồi ạ, nhưng nó không ở đó.","Yes, I have, but + S + isn't + there",[
"Câu trả lời ngắn dùng lại trợ động từ `have`.",
"`there` = ở đó. `it isn't there` = nó không có ở đó."]],
["M","Let's look for it together. Is this it?","Mình cùng tìm nhé. Có phải cái này không?","look for + it   |   Is this it?",[
"`look for` = tìm kiếm (quá trình). Đại từ đứng sau `for`: `look for it`.",
"`Is this it?` = Có phải nó không? Câu ngắn rất hay dùng khi tìm đồ."]],
["K","Yes! You found it! Thank you, Mom.","Đúng rồi! Mẹ tìm thấy rồi! Con cảm ơn mẹ.","S + found + it",[
"`found` là quá khứ của `find` (find → found → found). Dùng quá khứ vì việc tìm thấy vừa xảy ra xong.",
"Nhắc lại: `look for` = đang tìm, `find` = tìm thấy."]],
["M","Next time, please put your things away.","Lần sau con nhớ cất đồ gọn gàng nhé.","Next time, + please + V + O + away",[
"`Next time` đầu câu = lần sau.",
"`put away` = cất vào chỗ. `things` = đồ đạc (số nhiều)."]]
]},

{id:"drawing",g:"nha",t:"Ngày nghỉ",en:"Drawing Together",vi:"Vẽ tranh, tô màu",sp:["K","D"],
scene:"Con nhờ bố vẽ con mèo, rồi con tự tô màu và dán tranh lên tủ lạnh.",
tip:"Khi tô màu, hỏi con ‘What color is this?’ cho từng chi tiết. Màu sắc là nhóm từ trẻ học nhanh nhất.",
vocab:[["draw","vẽ"],["color","màu / tô màu"],["stripes","sọc"],["outside the lines","lem ra ngoài"],["fridge","tủ lạnh"],["artist","họa sĩ"]],
L:[
["K","Dad, can you draw a cat for me?","Bố ơi, bố vẽ cho con con mèo được không?","Can you + V + O + for + me?",[
"`for me` = cho con, giúp con.",
"`draw` = vẽ bằng bút chì, bút (nét). `paint` = vẽ bằng màu nước, sơn."]],
["D","Sure! What color should the cat be?","Được! Con mèo màu gì nhỉ?","What color + should + N + be?",[
"Hỏi màu: `What color is it?`, `What color should it be?`",
"`color` (Mỹ) = `colour` (Anh)."]],
["K","Make it orange with black stripes.","Bố vẽ nó màu cam có sọc đen nhé.","make + it + tính từ   |   with + N",[
"`make + tân ngữ + tính từ` = làm cho cái gì thành thế nào: `make it orange`, `make it big`.",
"`with` = có (đặc điểm): `a cat with black stripes`."]],
["D","Here you go. Now it's your turn to color it.","Đây con. Giờ đến lượt con tô màu.","it's your turn + to + V",[
"`your turn to + V` = đến lượt con làm gì.",
"`color` ở đây là **động từ**: tô màu."]],
["K","Oops, I went outside the lines.","Ối, con tô lem ra ngoài rồi.","S + went + outside + the + N",[
"`went` là quá khứ của `go`. `go outside the lines` = tô lem ra ngoài nét.",
"`Oops` = ối (khi lỡ làm sai điều nhỏ)."]],
["D","That's okay. It still looks beautiful.","Không sao. Vẫn đẹp lắm.","S + still + V",[
"`still` = vẫn, đứng **trước động từ thường**: `It still looks`. Đứng **sau `be`**: `It is still beautiful.`",
"`look + tính từ`: `looks beautiful`."]],
["K","Can we put it on the fridge?","Mình dán nó lên tủ lạnh được không?","put + it + on + the + N",[
"`on the fridge` = lên mặt tủ lạnh. Nhiều gia đình Anh, Mỹ hay dán tranh của con lên tủ lạnh.",
"`fridge` là dạng ngắn của `refrigerator`."]],
["D","Of course! You're a great artist.","Tất nhiên! Con là một họa sĩ tài ba.","You're + a + tính từ + N",[
"Hậu tố `-ist` chỉ người làm nghề: art → artist, piano → pianist.",
"Lời khen cụ thể khiến con thích vẽ và thích nói tiếng Anh hơn."]]
]},

{id:"reading",g:"nha",t:"Ngày nghỉ",en:"Reading a Book",vi:"Đọc sách cùng nhau",sp:["M","K"],
scene:"Mẹ và con chọn sách, con đọc tên sách, đoán chuyện tiếp theo và hỏi nghĩa từ mới.",
tip:"Khi đọc truyện, dừng lại hỏi ‘What do you think will happen next?’. Con sẽ phải nói câu dài hơn chứ không chỉ trả lời Yes, No.",
vocab:[["choose","chọn"],["title","tên sách"],["happen","xảy ra"],["What does... mean?","... nghĩa là gì?"],["brave","dũng cảm"],["afraid","sợ"]],
L:[
["M","Let's read a book together. You choose.","Mình cùng đọc sách nhé. Con chọn đi.","Let's + V   |   You + V (mệnh lệnh nhấn chủ ngữ)",[
"`You choose` là câu mệnh lệnh có thêm `You` để nhấn mạnh ‘con được quyền chọn’.",
"`choose` (chọn) có quá khứ là `chose`."]],
["K","This one! It has lots of pictures.","Cuốn này! Nó có nhiều tranh.","It + has + lots of + N",[
"**Vì sao `has` mà không phải `have`?** Chủ ngữ `It` là ngôi ba số ít → `has`.",
"`lots of pictures` = nhiều tranh."]],
["M","Can you read the title for me?","Con đọc tên sách cho mẹ nghe được không?","Can you + V + the + N + for me?",[
"`title` = tên sách, tên bài, tựa đề.",
"Để con đọc tên sách là cách luyện đọc chữ in hoa và cách nhấn giọng."]],
["K","The Brave Little Fox.","Chú cáo nhỏ dũng cảm.","The + tính từ + tính từ + N",[
"Khi có nhiều tính từ, ý kiến đứng trước, kích thước đứng sau: `brave` (ý kiến) → `little` (kích thước) → `fox`.",
"Trong tên sách, các từ chính viết hoa chữ cái đầu."]],
["M","What do you think will happen next?","Con nghĩ chuyện gì sẽ xảy ra tiếp theo?","What + do you think + will + V?",[
"`do you think` chen vào giữa câu hỏi. Câu gốc là `What will happen next?`",
"**Vì sao không nói `What do you think will it happen`?** Sau `do you think` phần còn lại **không đảo ngữ**. Ở đây `what` là chủ ngữ của `happen` nên đi thẳng `will happen`."]],
["K","I think the fox will find his mom.","Con nghĩ chú cáo sẽ tìm thấy mẹ.","I think + S + will + V",[
"`will` dùng để **đoán** tương lai theo ý kiến.",
"`his mom`: con cáo trong truyện được coi là nhân vật nên dùng `his`."]],
["K","Mom, what does 'brave' mean?","Mẹ ơi, ‘brave’ nghĩa là gì?","What does + từ + mean?",[
"Cách hỏi nghĩa của từ: `What does X mean?` Động từ `mean` ở nguyên mẫu vì đã có `does`.",
"**Lỗi hay gặp:** `What is X mean?` là sai. Có thể hỏi `What is the meaning of X?`"]],
["M","Brave means not afraid. Like you at the doctor's!","Brave là không sợ hãi. Giống con lúc đi khám bác sĩ ấy!","X + means + ...",[
"`means` thêm `-s` vì chủ ngữ là một từ (ngôi ba số ít).",
"`afraid` chỉ đứng sau động từ (`I'm afraid`), không đứng trước danh từ. Không nói `an afraid boy`; nói `a scared boy`.",
"`at the doctor's` = ở phòng khám (rút gọn của `the doctor's office`)."]]
]},

{id:"pet",g:"nha",t:"Mỗi ngày",en:"Caring for Our Dog",vi:"Chăm sóc thú cưng",sp:["D","K"],
scene:"Bố nhắc con cho chó ăn. Con hỏi lượng thức ăn và xin dắt chó đi dạo.",
tip:"Giao cho con một việc chăm thú cưng mỗi ngày và nhắc bằng tiếng Anh. Nhà không nuôi thú cưng thì dùng thú nhồi bông cũng được.",
vocab:[["feed (fed)","cho ăn"],["not yet","chưa"],["wag its tail","vẫy đuôi"],["take for a walk","dắt đi dạo"],["leash","dây xích"],["tightly","chặt"]],
L:[
["D","Have you fed the dog today?","Hôm nay con cho chó ăn chưa?","Have + S + V3 + today?",[
"`fed` là V3 của `feed` (feed → fed → fed).",
"Hiện tại hoàn thành với `today` khi ngày hôm nay **chưa kết thúc**."]],
["K","Not yet. I'll do it now.","Chưa ạ. Con làm ngay đây.","Not yet   |   I'll + V",[
"`Not yet` = chưa (nhưng sẽ làm). `yet` thường đi với hiện tại hoàn thành.",
"`I'll` cho **quyết định ngay lúc nói**."]],
["K","How much food does he need?","Nó cần bao nhiêu thức ăn ạ?","How much + N không đếm được + does + S + V?",[
"`food` không đếm được → `How much food`.",
"**Vì sao gọi con chó là `he`?** Với thú cưng nhà mình, người bản xứ thường dùng `he/she` như với người. Với con vật lạ thì dùng `it`."]],
["D","One cup in the morning and one in the evening.","Sáng một cốc, tối một cốc.","in the morning / in the evening",[
"Buổi trong ngày đi với `in the`: `in the morning`, `in the afternoon`, `in the evening`. Riêng ban đêm: `at night`.",
"`one` thứ hai thay cho `one cup` để không lặp."]],
["K","Look, he's wagging his tail. He's happy!","Nhìn kìa, nó đang vẫy đuôi. Nó vui đấy!","be + V-ing (đang diễn ra)",[
"Hiện tại tiếp diễn vì con chó đang vẫy đuôi ngay lúc nói.",
"`wagging`: gấp đôi `g` khi thêm `-ing` (wag → wagging)."]],
["D","Can you take him for a walk after school?","Chiều đi học về con dắt nó đi dạo được không?","take + N + for a walk",[
"`take someone for a walk` = dắt ai đi dạo. Cũng nói `walk the dog`.",
"`after school` = sau giờ học, không có `the`."]],
["K","Yes! Can I hold the leash?","Vâng! Con cầm dây xích được không?","Can I + V + the + N?",[
"`leash` (Mỹ) = `lead` (Anh): dây dắt chó.",
"`hold` = cầm, giữ (quá khứ: `held`)."]],
["D","Okay, but hold it tightly.","Được, nhưng cầm thật chặt nhé.","V + it + trạng từ",[
"`tightly` là trạng từ bổ nghĩa cho `hold`.",
"Riêng cụm cố định `hold on tight` thì dùng `tight` không có `-ly`."]]
]},

{id:"laundry",g:"nha",t:"Chủ Nhật",en:"Laundry Day",vi:"Giặt và gấp quần áo",sp:["M","K"],
scene:"Mẹ và con gấp quần áo, nhận ra đồ của ai, phát hiện áo đã chật và bật máy giặt.",
tip:"Khi gấp đồ, hỏi con ‘Whose ... is this?’ với từng món. Con học được sở hữu cách và tên quần áo cùng lúc.",
vocab:[["laundry","đồ giặt"],["fold","gấp"],["whose","của ai"],["too small","chật"],["drawer","ngăn kéo"],["washing machine","máy giặt"]],
L:[
["M","Can you help me fold the laundry?","Con giúp mẹ gấp quần áo được không?","help + me + V + the + N",[
"`laundry` = quần áo cần giặt hoặc vừa giặt xong. Không đếm được.",
"`fold` = gấp. `do the laundry` = giặt đồ."]],
["K","Sure. Whose socks are these?","Vâng. Đây là tất của ai ạ?","Whose + N + are these?",[
"`Whose` hỏi về sở hữu (của ai). Đi với danh từ ngay sau: `Whose socks`, `Whose book`.",
"`these` (những cái này) đi với số nhiều và `are`. Số ít: `Whose sock is this?`"]],
["M","They're Dad's.","Của bố đấy.","N + 's (sở hữu cách)",[
"`Dad's` = của bố. Câu đầy đủ: `They're Dad's socks.` Danh từ sau có thể bỏ khi đã rõ.",
"Sở hữu cách: danh từ chỉ người + `'s`: `Mom's bag`, `my sister's doll`."]],
["K","This T-shirt is too small for me now.","Cái áo này giờ con mặc chật rồi.","too + tính từ + for + người",[
"`too small for me` = quá nhỏ so với con, tức là chật.",
"`now` cuối câu nhấn mạnh sự thay đổi so với trước."]],
["M","You're growing so fast!","Con lớn nhanh quá!","be + growing + so + adv",[
"Hiện tại tiếp diễn diễn tả **quá trình thay đổi**: con đang lớn lên.",
"`fast` vừa là tính từ vừa là trạng từ; không có từ `fastly`."]],
["M","Put your clothes in the top drawer.","Con cất quần áo vào ngăn kéo trên cùng nhé.","Put + N + in + the + N",[
"`clothes` (quần áo) luôn ở số nhiều, đọc /kloʊðz/. Không nhầm với `cloth` (vải).",
"`top drawer` = ngăn kéo trên cùng; `bottom drawer` = ngăn dưới cùng."]],
["K","Can I press the button on the washing machine?","Con bấm nút máy giặt được không?","Can I + V + the + N + on + the + N?",[
"`washing machine` = máy giặt. `washing` (V-ing) đứng trước danh từ chỉ công dụng.",
"`press the button` = bấm nút."]],
["M","Yes, the blue one. Then close the lid.","Được, nút màu xanh ấy. Rồi đóng nắp lại.","the + tính từ + one   |   Then + V",[
"`the blue one` = cái màu xanh (`one` thay cho `button`).",
"`Then` = sau đó, chỉ bước tiếp theo."]]
]},

{id:"sharing",g:"nha",t:"Ngày nghỉ",en:"Sharing Toys",vi:"Chia sẻ đồ chơi",sp:["S","K","M"],
scene:"Chị gái và em tranh nhau búp bê. Mẹ hướng dẫn hai chị em hỏi mượn và thay phiên nhau.",
tip:"Khi anh chị em tranh giành, bắt con nói lại đúng câu ‘Can I borrow..., please?’ trước khi được cầm đồ. Vừa dạy tiếng Anh vừa dạy cách cư xử.",
vocab:[["give it back","trả lại"],["What's going on?","Có chuyện gì thế?"],["without asking","không hỏi trước"],["borrow","mượn"],["share","chia sẻ"],["take turns","thay phiên"]],
L:[
["S","Give it back! That's my doll!","Trả đây! Búp bê của chị mà!","Give + it + back!",[
"`give back` = trả lại. Đại từ `it` phải đứng giữa: `give it back`.",
"`That's my doll` = đó là búp bê của chị."]],
["K","But I want to play with it too!","Nhưng em cũng muốn chơi mà!","But + S + want to + V",[
"Trong văn nói, `But` có thể đứng đầu câu để phản đối ý vừa nghe.",
"`play with it` = chơi với nó."]],
["M","Hey, no shouting. What's going on?","Này, không được la hét. Có chuyện gì thế?","No + V-ing   |   What's going on?",[
"`No + V-ing` = cấm làm gì, thường thấy trên biển báo: `No smoking`, `No running`.",
"`What's going on?` = Chuyện gì đang xảy ra vậy?"]],
["S","He took my doll without asking.","Em lấy búp bê của con mà không hỏi.","without + V-ing",[
"`took` là quá khứ của `take`.",
"**Vì sao `without asking` mà không phải `without ask`?** Sau giới từ (`without`, `before`, `after`, `for`...) động từ phải ở dạng `-ing`."]],
["M","We always ask first before we take something.","Nhà mình luôn hỏi trước khi lấy đồ của người khác.","always + V + before + S + V",[
"Hiện tại đơn với `always` để nói **quy tắc** trong nhà.",
"`before we take` dùng hiện tại đơn vì là sự thật chung, có thể nói gọn: `before taking something`."]],
["K","Sorry. Can I borrow your doll, please?","Em xin lỗi. Cho em mượn búp bê được không ạ?","Can I borrow + your + N?",[
"Nhắc lại: `borrow` = mượn (từ người khác về mình).",
"Nói `Sorry` trước rồi mới xin, đây là trình tự rất tự nhiên."]],
["S","Okay, you can play with it for ten minutes.","Được, em chơi mười phút nhé.","can + V + for + thời gian",[
"`for ten minutes` = trong mười phút.",
"`can` ở đây là cho phép."]],
["M","Thank you for sharing. Now you can take turns.","Cảm ơn con đã chia sẻ. Giờ hai đứa thay phiên nhau chơi nhé.","Thank you for + V-ing",[
"Sau `Thank you for` dùng `V-ing` (vì `for` là giới từ): `Thank you for helping`, `Thank you for sharing`.",
"`take turns` = thay phiên nhau."]]
]},

{id:"guests",g:"nha",t:"Cuối tuần",en:"Visitors at Home",vi:"Khách đến chơi nhà",sp:["M","K","U"],
scene:"Dì Mai đến chơi. Con ra mở cửa, mời dì vào, mẹ mời nước và dì tặng quà.",
tip:"Tập cho con một câu chào khách cố định bằng tiếng Anh. Khách là người Việt cũng được, con sẽ thấy tự hào vì nói được.",
vocab:[["at the door","ở ngoài cửa"],["come in","mời vào"],["grow (grown)","lớn lên"],["have a seat","mời ngồi"],["gift","quà"],["stay for dinner","ở lại ăn tối"]],
L:[
["M","Someone's at the door. Can you open it, please?","Có ai ở cửa kìa. Con ra mở cửa được không?","Someone's = Someone is   |   at the door",[
"`Someone` (ai đó) đi với động từ **số ít**: `Someone is at the door.`",
"`at the door` = ở chỗ cửa (đang đứng ngoài cửa)."]],
["K","Hello, Aunt Mai! Come in, please.","Con chào dì Mai! Mời dì vào ạ.","Come in, please.",[
"`Come in` = mời vào. Thêm `please` để lịch sự.",
"`Aunt` + tên = dì, cô, bác gái. `Uncle` + tên = chú, cậu, bác trai. Viết hoa vì dùng như tên gọi."]],
["U","Hello, dear! Wow, you've grown so tall!","Chào cháu yêu! Ôi, cháu lớn cao quá!","S + have + V3 (kết quả đến hiện tại)",[
"`grown` là V3 của `grow` (grow → grew → grown).",
"Hiện tại hoàn thành vì nhấn mạnh **kết quả thấy được bây giờ**: cháu đã cao hơn so với lần trước."]],
["M","Please have a seat. Would you like some tea?","Em ngồi đi. Em uống trà nhé?","Please have a seat   |   Would you like + some + N?",[
"`Have a seat` lịch sự hơn `Sit down` khi mời khách.",
"Mời đồ uống dùng `some` trong câu hỏi."]],
["U","Yes, please. That would be lovely.","Vâng ạ. Thế thì tốt quá.","That would be + tính từ",[
"`That would be lovely` = thế thì tuyệt quá (lịch sự, kiểu Anh).",
"`would` làm lời nói nhẹ nhàng hơn `That is lovely`."]],
["U","This is a little gift for you.","Đây là chút quà nhỏ cho cháu.","a + little + N đếm được",[
"**Chú ý:** `a little gift` = một món quà nhỏ (`little` là tính từ, nghĩa là nhỏ). Khác với `a little water` (một ít nước).",
"`gift` = `present`: quà."]],
["K","Thank you so much! That's very kind of you.","Cháu cảm ơn dì nhiều! Dì tốt quá ạ.","That's + tính từ + of + you",[
"`It's / That's kind of you` = bạn thật tốt. Với cấu trúc này dùng `of`, không dùng `for`.",
"Đây là câu cảm ơn lịch sự mà trẻ nói sẽ được người lớn rất quý."]],
["M","Please stay for dinner.","Em ở lại ăn tối nhé.","stay for + bữa ăn",[
"`stay for dinner` = ở lại ăn tối.",
"`Please` đầu câu mệnh lệnh biến nó thành lời mời."]]
]},

{id:"dishes",g:"nha",t:"Sau bữa tối",en:"Washing the Dishes",vi:"Rửa bát",sp:["D","K"],
scene:"Sau bữa tối, bố và con cùng dọn bếp. Con rửa bát, bố lau khô và cất.",
tip:"Làm việc nhà cùng nhau là lúc rất tốt để nói tiếng Anh, vì tay bận nhưng miệng rảnh và câu nói gắn với hành động thật.",
vocab:[["clean up","dọn dẹp"],["wash the dishes","rửa bát"],["gloves","găng tay"],["slippery","trơn"],["both hands","cả hai tay"],["teamwork","làm việc nhóm"]],
L:[
["D","Let's clean up the kitchen together.","Mình cùng dọn bếp nhé.","Let's + V + up + the + N",[
"`clean up` = dọn dẹp sạch sẽ (sau khi bày bừa).",
"`up` trong nhiều cụm động từ mang nghĩa ‘làm cho xong, cho hết’: `clean up`, `eat up`, `tidy up`."]],
["K","Can I wash the dishes?","Con rửa bát được không ạ?","Can I + V + the + N?",[
"`wash the dishes` = `do the dishes` = rửa bát.",
"`dishes` thêm `-es` vì `dish` tận cùng bằng `sh`. Quy tắc: -s, -sh, -ch, -x, -o → thêm `-es`."]],
["D","Sure. Put on these gloves first.","Được. Đeo găng tay này vào trước đã.","Put on + these + N số nhiều",[
"`these` đi với danh từ số nhiều; `this` đi với số ít.",
"`put on gloves` = đeo găng tay. `put on` dùng cho mọi thứ mặc, đeo lên người."]],
["K","The plates are slippery!","Đĩa trơn quá!","N số nhiều + are + tính từ",[
"`slippery` = trơn. Liên quan tới động từ `slip` (trượt).",
"`plates` = đĩa; `bowls` = bát; `cups` = cốc."]],
["D","Hold them with both hands.","Cầm bằng cả hai tay nhé.","V + them + with + both + N",[
"`with both hands` = bằng cả hai tay. `with` chỉ công cụ.",
"`both` + danh từ số nhiều: `both hands`, `both of us`."]],
["D","I'll dry them and put them away.","Bố sẽ lau khô rồi cất đi.","I'll + V + them + and + V + them + away",[
"`dry` ở đây là động từ: lau khô.",
"`put them away`: đại từ `them` đứng giữa `put` và `away`."]],
["K","All done! The kitchen is clean now.","Xong hết rồi! Bếp sạch rồi bố ạ.","All done!",[
"`All done!` = xong hết rồi.",
"`clean` ở đây là tính từ (sạch); trong `clean up` thì là động từ."]],
["D","Thanks, partner. Teamwork makes it easy!","Cảm ơn đồng đội. Làm cùng nhau thì việc gì cũng dễ!","make + it + tính từ",[
"`make + tân ngữ + tính từ` = làm cho cái gì trở nên thế nào: `makes it easy`.",
"`Teamwork` là chủ ngữ số ít nên `makes` thêm `-s`.",
"`partner` = cộng sự; bố gọi con là `partner` cho vui."]]
]},

{id:"telling-time",g:"nha",t:"Mỗi ngày",en:"What Time Is It?",vi:"Hỏi và xem giờ",sp:["K","M"],
scene:"Con hỏi giờ, hỏi khi nào đến giờ học bơi và tính còn bao nhiêu thời gian để chơi.",
tip:"Treo đồng hồ kim trong phòng con. Mỗi lần con hỏi giờ, để con tự đọc giờ bằng tiếng Anh trước rồi mẹ mới xác nhận.",
vocab:[["What time is it?","Mấy giờ rồi?"],["half past","rưỡi"],["a quarter to","kém mười lăm"],["start","bắt đầu"],["until","cho đến khi"],["set an alarm","đặt chuông báo"]],
L:[
["K","Mom, what time is it?","Mẹ ơi, mấy giờ rồi ạ?","What time + is it?",[
"`What time is it?` = Mấy giờ rồi? `it` là chủ ngữ giả khi nói về thời gian.",
"Lịch sự hơn khi hỏi người lạ: `Excuse me, do you have the time?`"]],
["M","It's half past four.","Bốn giờ rưỡi rồi.","It's + half past + giờ",[
"`half past four` = 4:30 (đã qua bốn giờ được nửa tiếng). Cũng có thể nói `It's four thirty.`",
"`past` = qua, dùng cho số phút từ 1 đến 30."]],
["K","What time does my swimming lesson start?","Mấy giờ thì bắt đầu học bơi ạ?","What time + does + N + V?",[
"Hiện tại đơn cho **lịch trình** cố định.",
"`swimming lesson` = buổi học bơi."]],
["M","It starts at a quarter to six.","Sáu giờ kém mười lăm bắt đầu.","at + a quarter to + giờ",[
"`a quarter to six` = 5:45 (còn mười lăm phút nữa là sáu giờ). `quarter` = một phần tư giờ.",
"`to` dùng cho số phút từ 31 đến 59 (còn thiếu bao nhiêu phút nữa). Có thể nói đơn giản: `five forty-five`.",
"Giờ cụ thể đi với `at`."]],
["K","How much time do I have?","Con còn bao nhiêu thời gian ạ?","How much time + do + S + have?",[
"**Vì sao `How much time` mà không phải `How many time`?** `time` theo nghĩa thời gian là danh từ **không đếm được**. Khi nghĩa là ‘lần’ thì đếm được: `How many times?`"]],
["M","You have one hour and fifteen minutes.","Con còn một tiếng mười lăm phút.","số + hour(s) + and + số + minutes",[
"`one hour` số ít, `fifteen minutes` số nhiều.",
"Có thể nói: `an hour and a quarter`."]],
["K","Can I play until five o'clock?","Con chơi đến năm giờ được không?","until + giờ",[
"`until` = cho đến khi.",
"`o'clock` chỉ dùng cho giờ chẵn: `five o'clock`. Không nói `five thirty o'clock`."]],
["M","Okay, but set an alarm so you don't forget.","Được, nhưng đặt chuông báo để khỏi quên nhé.","so (that) + S + V (mục đích)",[
"`so` hay `so that` = để mà, chỉ **mục đích**: `so you don't forget`.",
"`set an alarm` = đặt chuông báo. `an` vì `alarm` bắt đầu bằng nguyên âm."]]
]},

{id:"tidy-room",g:"nha",t:"Ngày nghỉ",en:"Tidying Your Room",vi:"Dọn phòng",sp:["M","K"],
scene:"Phòng con bừa bộn đồ chơi và sách. Mẹ hướng dẫn con dọn từng bước.",
tip:"Chia việc dọn phòng thành từng bước nhỏ bằng First, Then, Next, Finally. Con vừa học từ chỉ trình tự vừa biết cách làm việc có thứ tự.",
vocab:[["messy","bừa bộn"],["tidy up","dọn dẹp gọn gàng"],["pick up","nhặt lên"],["shelf","giá, kệ"],["make the bed","dọn giường"],["toy box","hộp đồ chơi"]],
L:[
["M","Your room is so messy!","Phòng con bừa quá!","S + is + so + tính từ",[
"`messy` = bừa bộn, là tính từ của danh từ `mess` (đống bừa bộn): `What a mess!`",
"**Vì sao `so messy` mà không phải `such messy`?** `so` + tính từ đứng một mình; `such a` + tính từ + danh từ: `such a messy room`."]],
["K","I'll tidy it up later.","Lát nữa con dọn ạ.","I'll + V + it + up + later",[
"`tidy up` là cụm động từ tách được. Khi tân ngữ là đại từ (`it`, `them`) thì **bắt buộc** đặt ở giữa: `tidy it up`, không nói `tidy up it`.",
"`will` diễn tả quyết định đưa ra ngay lúc nói."]],
["M","No, let's do it now. It won't take long.","Không, mình làm luôn bây giờ. Không lâu đâu.","It won't take long",[
"`won't` = `will not`.",
"`take long` = mất nhiều thời gian, thường dùng trong câu phủ định và câu hỏi: `How long does it take?` Trong câu khẳng định nói `It takes a long time`."]],
["M","First, pick up your toys and put them in the box.","Đầu tiên, nhặt đồ chơi lên rồi cho vào hộp.","First, + V + and + V",[
"`First,` mở đầu chuỗi trình tự; tiếp theo là `Then`, `Next`, `Finally`.",
"`pick up` = nhặt lên; `put them in the box` = cho vào trong hộp. `in` chỉ vị trí bên trong."]],
["K","Where do these books go?","Mấy quyển sách này để đâu ạ?","Where + do + N số nhiều + go?",[
"`Where does it go?` = nó để chỗ nào (chỗ của nó). Động từ `go` ở đây không phải là ‘đi’.",
"`these books` số nhiều nên dùng `do`; số ít thì `Where does this book go?`"]],
["M","They go on the shelf.","Để lên giá sách con nhé.","They go + on + the + N",[
"`on the shelf`: dùng `on` vì sách nằm trên bề mặt kệ.",
"Số nhiều của `shelf` là `shelves` (f → ves), giống `knife → knives`, `leaf → leaves`."]],
["K","Should I make my bed too?","Con có phải dọn giường nữa không ạ?","Should I + V + too?",[
"`make the bed` = dọn, xếp gọn giường. Đây là cụm cố định, không có nghĩa là ‘làm ra cái giường’.",
"`Should I...?` = con có nên/có cần...? dùng để hỏi việc nên làm.",
"`too` = cũng, đứng cuối câu khẳng định và câu hỏi."]],
["M","Yes, please. Wow, it looks much better now!","Có con ạ. Ôi, trông gọn hơn nhiều rồi!","look + so sánh hơn",[
"`look` + **tính từ** (không dùng trạng từ): `looks better`, `looks nice`.",
"**Vì sao `much better` mà không phải `very better`?** `very` không đi với so sánh hơn. Muốn nhấn mạnh so sánh hơn thì dùng `much`, `a lot` hoặc `far`."]]
]},

{id:"screen-time",g:"nha",t:"Buổi tối",en:"Screen Time",vi:"Xem TV, máy tính bảng",sp:["K","D"],
scene:"Con muốn xem hoạt hình. Bố cho xem có giới hạn thời gian, hết giờ thì tắt TV.",
tip:"Thống nhất giờ xem trước khi bật TV, ví dụ ‘thirty minutes’. Khi hết giờ chỉ cần nói ‘Time's up’, con sẽ quen với câu này rất nhanh.",
vocab:[["cartoons","phim hoạt hình"],["turn off","tắt"],["Time's up","hết giờ"],["rest","nghỉ ngơi"],["board game","trò chơi cờ bàn"],["instead","thay vào đó"]],
L:[
["K","Dad, can I watch cartoons?","Bố ơi, con xem hoạt hình được không ạ?","Can I + V + N?",[
"`cartoons` = phim hoạt hình, dùng số nhiều khi nói chung.",
"`watch` dùng cho TV, phim (thứ chuyển động, xem có chủ ý); `see` là nhìn thấy; `look at` là nhìn vào một vật."]],
["D","You can watch for thirty minutes.","Con được xem ba mươi phút.","can + V + for + khoảng thời gian",[
"`for` + khoảng thời gian: `for thirty minutes`, `for an hour`.",
"`can` ở đây là cho phép, không phải khả năng."]],
["K","Can I have five more minutes, please?","Cho con thêm năm phút nữa được không ạ?","số + more + N",[
"**Trật tự từ:** số đứng trước `more`: `five more minutes`. Không nói `more five minutes`.",
"`Can I have...?` = cho con xin..."]],
["D","Time's up. Please turn off the TV.","Hết giờ rồi. Tắt TV đi con.","Time's up. + Please + V",[
"`Time's up` = `Time is up` = hết giờ.",
"`turn off` ↔ `turn on`. Với đại từ: `turn it off`."]],
["K","But I'm not finished yet!","Nhưng con chưa xem xong mà!","I'm not finished + yet",[
"`finished` ở đây là tính từ (xong rồi): `I'm finished` = `I'm done`.",
"`yet` đứng cuối câu phủ định = vẫn chưa."]],
["D","You've been watching for a long time.","Con xem lâu lắm rồi đấy.","have been + V-ing + for",[
"**Hiện tại hoàn thành tiếp diễn** (`have been + V-ing`): hành động bắt đầu trong quá khứ, kéo dài liên tục tới bây giờ.",
"**Vì sao không nói `You watch for a long time`?** Hiện tại đơn chỉ thói quen; câu đó sẽ hiểu là ‘con hay xem lâu’, không phải ‘từ nãy tới giờ’."]],
["D","Your eyes need a rest.","Mắt con cần được nghỉ.","N số nhiều + need + a + N",[
"`eyes` số nhiều nên `need` không thêm `-s`.",
"`a rest` là danh từ (một lần nghỉ). Có thể nói bằng động từ: `Your eyes need to rest.`"]],
["K","Okay. Can we play a board game instead?","Vâng ạ. Thế mình chơi cờ bàn được không bố?","... + instead",[
"`instead` đứng cuối câu = thay vào đó.",
"Nếu muốn nói rõ thay cho cái gì: `instead of watching TV` (`instead of` + V-ing/N)."]]
]},

{id:"plants",g:"nha",t:"Sáng sớm",en:"Watering the Plants",vi:"Tưới cây cùng bà",sp:["G","K"],
scene:"Buổi sáng, bà rủ cháu ra ban công tưới cây và thấy một bông hoa mới nở.",
tip:"Cho con tự chăm một chậu cây nhỏ. Mỗi sáng hỏi ‘Did you water your plant?’ để con luyện câu hỏi quá khứ.",
vocab:[["water","tưới (động từ)"],["watering can","bình tưới"],["next to","bên cạnh"],["a little","một ít"],["grow","lớn lên, mọc"],["plant","cây; trồng"]],
L:[
["G","Can you help me water the plants?","Cháu giúp bà tưới cây nhé?","help + sb + V",[
"`help + người + V nguyên mẫu`: `help me water`. Nói `help me to water` cũng đúng nhưng ít tự nhiên hơn khi nói.",
"`water` ở đây là **động từ** (tưới nước), không phải danh từ ‘nước’."]],
["K","Sure! Where's the watering can?","Vâng ạ! Bình tưới ở đâu hả bà?","Where's + the + N?",[
"`Where's` = `Where is`.",
"`watering can` = bình tưới. `can` ở đây là danh từ (cái bình, cái lon), không phải động từ khuyết thiếu."]],
["G","It's next to the door.","Ở cạnh cửa ấy.","It's + next to + the + N",[
"`next to` = bên cạnh. Các giới từ vị trí khác: `behind` (sau), `in front of` (trước), `between` (giữa)."]],
["K","How much water does this plant need?","Cây này cần bao nhiêu nước ạ?","How much + N không đếm được + does + S + V?",[
"`water` (nước) không đếm được nên dùng `How much`.",
"`this plant` số ít nên trợ động từ là `does`, động từ chính `need` giữ nguyên."]],
["G","Just a little. Don't give it too much.","Chỉ một ít thôi. Đừng tưới nhiều quá.","a little / too much",[
"`a little` + không đếm được (một ít); `a few` + đếm được số nhiều.",
"`too much` = quá nhiều, mang nghĩa **thừa, không tốt**. Khác `a lot` (nhiều) không mang nghĩa xấu."]],
["K","Look, Grandma! There's a new flower!","Bà ơi nhìn kìa! Có một bông hoa mới!","There's + a + tính từ + N",[
"`There's a` + danh từ số ít; số nhiều: `There are two flowers.`",
"`Look!` đứng một mình để gọi người khác chú ý."]],
["G","It grew because you watered it every day.","Nó lớn được là nhờ ngày nào cháu cũng tưới.","S + V quá khứ + because + S + V quá khứ",[
"`grew` là quá khứ bất quy tắc của `grow`. `watered` là quá khứ có quy tắc (+ed).",
"`because` + mệnh đề nêu lý do. `every day` (hai chữ) = mỗi ngày; `everyday` (một chữ) là tính từ: `everyday life`."]],
["K","I want to plant some tomatoes next.","Lần tới cháu muốn trồng cà chua.","want to + V + some + N số nhiều",[
"`plant` ở đây là động từ: trồng.",
"`tomatoes` thêm `-es` vì tận cùng bằng `o` (như `potatoes`).",
"`next` ở cuối câu = tiếp theo, lần sau."]]
]},

{id:"power-cut",g:"nha",t:"Buổi tối",en:"The Lights Went Out",vi:"Mất điện",sp:["K","D"],
scene:"Đang tối thì cả nhà mất điện. Con hơi sợ, bố đi lấy đèn pin và trấn an con.",
tip:"Phân biệt cho con cặp scared/scary qua chính tình huống này: con thì ‘scared’, bóng tối thì ‘scary’.",
vocab:[["power cut","mất điện"],["flashlight","đèn pin"],["dark","tối"],["scared","sợ"],["fan","quạt"],["be back on","có lại (điện)"]],
L:[
["K","Dad! Everything went dark!","Bố ơi! Tối om hết rồi!","Everything + went + tính từ",[
"`go dark` = trở nên tối. `went` là quá khứ của `go`.",
"`Everything` luôn tính là **số ít**: `Everything is fine`, không nói `Everything are`."]],
["D","Don't worry. It's just a power cut.","Đừng lo. Chỉ là mất điện thôi.","It's just + a + N",[
"`power cut` (Anh) = `power outage` (Mỹ) = mất điện.",
"`just` = chỉ là, làm cho việc nghe nhẹ nhàng hơn."]],
["D","Stay where you are. I'll get the flashlight.","Con cứ đứng yên đấy. Bố đi lấy đèn pin.","Stay where you are",[
"`Stay where you are` = đứng yên chỗ con đang đứng. `where you are` là một mệnh đề làm trạng ngữ.",
"`flashlight` (Mỹ) = `torch` (Anh). `I'll` = quyết định ngay lúc nói."]],
["K","I'm a little scared.","Con hơi sợ.","I'm + a little + tính từ",[
"**Vì sao `scared` mà không phải `scary`?** Đuôi `-ed` tả cảm xúc của người (`I'm scared`); `scary` tả thứ gây ra cảm xúc (`The dark is scary`).",
"`a little` trước tính từ = hơi, một chút."]],
["D","Hold my hand. I'm right here.","Nắm tay bố này. Bố ở ngay đây.","Hold + my + N. / right here",[
"`right here` = ngay đây; `right` nhấn mạnh vị trí, giống `right now` (ngay bây giờ)."]],
["K","Why is it so hot?","Sao nóng thế ạ?","Why + is + it + so + tính từ?",[
"`it` là chủ ngữ giả khi nói về nhiệt độ, thời tiết: `It's hot`, `It's raining`.",
"Câu hỏi đảo `is` lên trước `it`: `Why is it...?`"]],
["D","Because the fan isn't working.","Vì quạt không chạy con ạ.","Because + S + isn't + V-ing",[
"`work` với máy móc = hoạt động, chạy: `The fan isn't working.`",
"Dùng **hiện tại tiếp diễn** vì đây là tình trạng tạm thời lúc này."]],
["K","Yay, the lights are back on!","A, có điện lại rồi!","S + are + back on",[
"`be back on` = bật lại, sáng lại. `be back` = quay lại; `on` = đang bật.",
"`Yay!` là tiếng reo vui."]]
]},

{id:"delivery",g:"nha",t:"Buổi chiều",en:"A Package Arrives",vi:"Người giao hàng đến",sp:["Y","K","M"],
scene:"Người giao hàng bấm chuông. Con không tự mở cửa mà gọi mẹ ra nhận hàng.",
tip:"Đây cũng là bài học an toàn: con nói chuyện qua cửa và gọi bố mẹ, không tự mở cửa cho người lạ.",
vocab:[["package","bưu kiện, gói hàng"],["delivery man","người giao hàng"],["sign","ký tên"],["order","đặt hàng"],["scissors","cái kéo"],["Just a moment","đợi chút"]],
L:[
["Y","Hello! I have a package for Ms. Lan.","Xin chào! Tôi có bưu kiện cho chị Lan.","I have + a + N + for + người",[
"`package` = bưu kiện, gói hàng (Anh hay nói `parcel`).",
"`Ms.` dùng cho phụ nữ mà không cần biết đã kết hôn hay chưa; `Mrs.` cho người đã kết hôn."]],
["K","Just a moment, please. Mom! It's the delivery man!","Chú đợi một chút ạ. Mẹ ơi! Có chú giao hàng!","Just a moment. / It's + the + N",[
"`Just a moment` = đợi một chút, lịch sự hơn `Wait`.",
"`It's the delivery man` = người đó là chú giao hàng. Dùng `It's` để báo ai đang ở cửa hoặc gọi điện: `It's me.`"]],
["M","Coming! Thank you. Where do I sign?","Ra ngay đây! Cảm ơn anh. Tôi ký ở đâu?","Coming! / Where do I + V?",[
"`Coming!` là dạng rút gọn của `I'm coming!` = ra ngay đây.",
"`sign` = ký (động từ); chữ ký là `signature`. Chữ `g` trong `sign` câm."]],
["Y","Right here, please.","Chị ký ngay chỗ này ạ.","Right here",[
"`right here` = ngay chỗ này. Thêm `please` cho lịch sự."]],
["K","What's in the box, Mom?","Trong hộp có gì thế mẹ?","What's in + the + N?",[
"`What's in...?` = bên trong có gì? `in` chỉ vị trí bên trong."]],
["M","It's the new shoes I ordered for you.","Là đôi giày mới mẹ đặt cho con đấy.","the + N + (that) + S + V",[
"`the new shoes I ordered` là cách rút gọn của `the new shoes that I ordered`. Có thể **bỏ `that`** khi nó làm tân ngữ trong mệnh đề quan hệ.",
"`ordered` = đã đặt hàng (quá khứ)."]],
["K","Can I open it?","Con mở được không ạ?","Can I + V + it?",[
"`it` thay cho `the box`. Dùng đại từ để khỏi lặp lại danh từ."]],
["M","Yes, but be careful with the scissors.","Được, nhưng cẩn thận cái kéo nhé.","be careful with + N",[
"`be careful with` + vật nguy hiểm = cẩn thận với.",
"`scissors` luôn ở dạng số nhiều: `The scissors are sharp.` Muốn đếm thì nói `a pair of scissors`."]]
]},

{id:"phone-call",g:"nha",t:"Bất cứ lúc nào",en:"Answering the Phone",vi:"Nghe điện thoại hộ mẹ",sp:["K","U","M"],
scene:"Điện thoại reo khi mẹ đang tắm. Con nghe máy, ghi lại lời nhắn của dì Mai rồi nhắn lại cho mẹ.",
tip:"Tập cho con câu ‘Can I take a message?’ Đây là câu rất lịch sự và hữu ích khi con lớn hơn.",
vocab:[["Who's calling?","Ai gọi đấy ạ?"],["take a message","ghi lời nhắn"],["call back","gọi lại"],["in the shower","đang tắm"],["right now","ngay bây giờ"],["tell","bảo, nói với"]],
L:[
["K","Hello? Who's calling, please?","A lô? Ai gọi đấy ạ?","Who's calling, please?",[
"`Who's calling?` là cách hỏi lịch sự trên điện thoại. Không nên hỏi `Who are you?` vì nghe cộc lốc.",
"`Who's` = `Who is`; dùng hiện tại tiếp diễn vì cuộc gọi đang diễn ra."]],
["U","Hi, it's Aunt Mai. Is your mom there?","Chào cháu, dì Mai đây. Mẹ cháu có nhà không?","It's + tên. / Is + N + there?",[
"Trên điện thoại giới thiệu bằng `It's...` hoặc `This is...`, không nói `I am Aunt Mai`.",
"`Is your mom there?` = mẹ cháu có ở đó không?"]],
["K","Sorry, she's in the shower right now.","Dạ, mẹ cháu đang tắm ạ.","she's + in the shower + right now",[
"`in the shower` = đang tắm (dưới vòi sen).",
"`right now` = ngay lúc này."]],
["K","Can I take a message?","Dì có muốn nhắn gì không ạ?","Can I + take a message?",[
"**Vì sao `take` mà không phải `get`?** Cụm cố định: người nghe máy `take a message` (ghi lời nhắn), người gọi `leave a message` (để lại lời nhắn)."]],
["U","Please tell her to call me back.","Cháu bảo mẹ gọi lại cho dì nhé.","tell + sb + to V",[
"`tell + người + to V` = bảo ai làm gì. Đây là cách truyền đạt lời yêu cầu.",
"`call back` = gọi lại; với đại từ: `call me back`."]],
["K","Okay, I'll tell her. Bye!","Vâng, cháu sẽ nói với mẹ. Cháu chào dì!","I'll + tell + her",[
"`tell` cần tân ngữ chỉ người ngay sau: `tell her`. Còn `say` không có người ngay sau: `say hello`, `say it to her`."]],
["K","Mom, Aunt Mai called. She wants you to call her back.","Mẹ ơi, dì Mai gọi. Dì muốn mẹ gọi lại.","want + sb + to V",[
"`want + người + to V` = muốn ai làm gì. Không nói `She wants that you call`.",
"`called` quá khứ vì cuộc gọi đã kết thúc."]],
["M","Thank you, sweetie. You took a great message!","Cảm ơn con yêu. Con nhắn giỏi quá!","You took + a + tính từ + N",[
"`took` là quá khứ của `take`.",
"`sweetie` là từ gọi thân mật với trẻ con, giống `honey`."]]
]},

{id:"spill",g:"nha",t:"Bất cứ lúc nào",en:"Oops, I Spilled It!",vi:"Làm đổ sữa",sp:["K","M"],
scene:"Con lỡ tay làm đổ cốc sữa. Mẹ không mắng, hai mẹ con cùng lau dọn.",
tip:"‘Accidents happen’ là câu nên nói thật nhiều: con học tiếng Anh và học cách không sợ khi mắc lỗi.",
vocab:[["spill","làm đổ (chất lỏng)"],["on purpose","cố ý"],["accident","tai nạn, sự cố"],["towel","khăn"],["wipe","lau"],["get angry","nổi giận"]],
L:[
["K","Oops! I spilled my milk.","Ối! Con làm đổ sữa rồi.","I + spilled + my + N",[
"`spill` = làm đổ chất lỏng. Quá khứ là `spilled` (Mỹ) hoặc `spilt` (Anh).",
"`Oops!` là tiếng thốt lên khi lỡ tay."]],
["K","I'm sorry, Mom. I didn't mean to.","Con xin lỗi mẹ. Con không cố ý ạ.","I didn't mean to.",[
"`I didn't mean to` = con không cố ý. Sau `to` bỏ động từ vì đã hiểu (`to spill it`).",
"Cùng nghĩa: `I didn't do it on purpose.`"]],
["M","It's okay. Accidents happen.","Không sao. Ai cũng có lúc lỡ tay mà.","N số nhiều + V (hiện tại đơn)",[
"`Accidents happen` = chuyện không may vẫn xảy ra. Dùng **hiện tại đơn** vì nói một sự thật chung.",
"`Accidents` số nhiều nên `happen` không thêm `-s`."]],
["M","Let's clean it up together.","Mình cùng lau nhé.","Let's + V + it + up + together",[
"`clean it up`: đại từ `it` đứng giữa cụm động từ tách được."]],
["M","Can you get a towel from the kitchen?","Con lấy giúp mẹ cái khăn trong bếp nhé?","get + a + N + from + nơi",[
"`get` = đi lấy (mang về).",
"`from the kitchen` = từ trong bếp. `from` chỉ nơi xuất phát."]],
["K","Here you are. Should I wipe the table?","Đây ạ. Con lau bàn nhé?","Here you are. / Should I + V?",[
"`Here you are` = đây ạ, nói khi đưa đồ cho ai.",
"`wipe` = lau (bằng khăn); `mop` = lau sàn bằng cây lau."]],
["M","Yes, and next time hold your cup with two hands.","Ừ, lần sau con cầm cốc bằng hai tay nhé.","next time + câu mệnh lệnh",[
"`next time` = lần sau, không cần giới từ (không nói `in next time`).",
"Câu mệnh lệnh nói nhẹ nhàng dùng để khuyên."]],
["K","I will. Thanks for not getting angry.","Vâng ạ. Cảm ơn mẹ đã không giận con.","Thanks for + not + V-ing",[
"`Thanks for + V-ing`. Dạng phủ định: đặt `not` **trước** V-ing: `for not getting`.",
"`get angry` = nổi giận. `get + tính từ` = trở nên: `get tired`, `get cold`.",
"`I will.` là câu trả lời ngắn = con sẽ làm thế."]]
]},

{id:"baking",g:"nha",t:"Cuối tuần",en:"Baking a Cake",vi:"Làm bánh",sp:["M","K"],
scene:"Mẹ và con làm bánh tặng bà: chuẩn bị nguyên liệu, đập trứng, khuấy bột rồi cho vào lò.",
tip:"Làm bánh rất hợp để học danh từ đếm được và không đếm được: eggs đếm được, còn flour, sugar, butter thì không.",
vocab:[["bake","nướng (bằng lò)"],["flour","bột mì"],["butter","bơ"],["crack","đập (trứng)"],["mix","trộn, khuấy"],["oven","lò nướng"]],
L:[
["M","Let's bake a cake for Grandma.","Mình làm bánh tặng bà nhé.","Let's + V + a + N + for + người",[
"`bake` = nướng bằng lò (bánh, bánh mì); `cook` là nấu nói chung.",
"`for Grandma` = cho bà. `for` chỉ người nhận."]],
["K","What do we need?","Mình cần những gì ạ?","What + do + we + need?",[
"Câu hỏi hiện tại đơn với `do` vì chủ ngữ là `we`."]],
["M","We need flour, sugar, eggs, and butter.","Mình cần bột mì, đường, trứng và bơ.","need + N, N, N, and N",[
"`flour`, `sugar`, `butter` là danh từ **không đếm được** nên không thêm `-s`. `eggs` đếm được nên có `-s`.",
"Khi liệt kê, đặt `and` trước thứ cuối cùng."]],
["M","Can you crack two eggs into the bowl?","Con đập hai quả trứng vào bát nhé?","crack + N + into + the + N",[
"`crack` = đập vỡ (vỏ trứng).",
"**Vì sao `into` mà không phải `in`?** `into` có chuyển động đi vào bên trong; `in` chỉ vị trí đứng yên: `The eggs are in the bowl.`"]],
["K","How much sugar should I add?","Con cho bao nhiêu đường ạ?","How much + N không đếm được + should I + V?",[
"`sugar` không đếm được nên dùng `How much`. Với `eggs` thì hỏi `How many eggs?`",
"`add` = thêm vào."]],
["M","Two spoons. Now mix it slowly.","Hai thìa. Giờ khuấy từ từ nhé.","V + it + trạng từ",[
"**Vì sao `slowly` mà không phải `slow`?** `slowly` là trạng từ, bổ nghĩa cho động từ `mix`. `slow` là tính từ, bổ nghĩa cho danh từ: `a slow car`.",
"`Two spoons` = hai thìa; muốn đếm thứ không đếm được thì dùng đơn vị: `two spoons of sugar`."]],
["K","Mmm, it smells delicious!","Ừm, thơm quá!","smell + tính từ",[
"Động từ giác quan (`smell`, `taste`, `look`, `sound`, `feel`) đi với **tính từ**: `smells delicious`, không nói `smells deliciously`."]],
["M","It needs to bake for thirty minutes. Don't touch the oven, it's hot!","Bánh phải nướng ba mươi phút. Đừng chạm vào lò, nóng đấy!","need to + V + for + thời gian",[
"`need to + V` = cần phải.",
"`Don't touch...` = đừng chạm vào. Câu mệnh lệnh phủ định để cảnh báo."]]
]},

{id:"hide-seek",g:"nha",t:"Ngày nghỉ",en:"Hide and Seek",vi:"Chơi trốn tìm",sp:["S","K"],
scene:"Hai chị em chơi trốn tìm trong nhà. Chị đếm, em đi trốn.",
tip:"Trò trốn tìm là cách rất vui để ôn giới từ chỉ vị trí: under, behind, in, next to. Mỗi lần tìm, hãy hỏi ‘Are you under the bed?’",
vocab:[["hide","trốn"],["seek","tìm"],["count","đếm"],["under","bên dưới"],["behind","phía sau"],["peek","nhìn trộm"]],
L:[
["S","Let's play hide and seek!","Mình chơi trốn tìm đi!","Let's + play + N",[
"`hide and seek` = trốn tìm. Tên trò chơi không có `the`: `play tag`, `play hide and seek`."]],
["K","You count first. I'll hide.","Chị đếm trước đi. Em đi trốn.","You + V + first. I'll + V.",[
"`first` ở cuối câu = trước, làm trước.",
"Hai câu đặt cạnh nhau để phân vai: `You count... I'll hide.`"]],
["S","One, two, three... ten! Ready or not, here I come!","Một, hai, ba... mười! Dù chưa trốn xong thì chị cũng đi tìm đây!","Here + đại từ + V",[
"`Ready or not, here I come!` là câu quen thuộc của trò trốn tìm.",
"**Trật tự từ:** khi chủ ngữ là đại từ thì `Here I come`; khi là danh từ thì đảo: `Here comes the bus`."]],
["S","Are you under the bed?","Em có ở dưới gầm giường không?","Are you + giới từ + the + N?",[
"`under` = bên dưới. Hỏi vị trí bằng `Are you + giới từ + nơi?`"]],
["K","No, I'm not!","Không, em không ở đây!","No, I'm not.",[
"Câu trả lời ngắn: `No, I'm not.` Câu này buồn cười vì trả lời tức là đã lộ chỗ trốn!"]],
["S","Found you! You were behind the curtain.","Tìm thấy rồi! Em núp sau rèm.","Found you! / You were + behind + the + N",[
"`Found you!` là dạng rút gọn của `I found you!`",
"`were` là quá khứ của `are`. `behind` = phía sau."]],
["K","That's not fair. You peeked!","Thế là không công bằng. Chị nhìn trộm!","That's not + tính từ. You + V-ed!",[
"`fair` = công bằng; `That's not fair!` trẻ con nói rất nhiều.",
"`peek` = nhìn trộm; quá khứ `peeked`."]],
["S","I didn't! Now it's your turn to count.","Chị không nhìn! Giờ đến lượt em đếm.","It's your turn to + V",[
"`I didn't!` = `I didn't peek!` Lặp lại trợ động từ để khỏi nhắc động từ.",
"`It's your turn to + V` = đến lượt ai làm gì."]]
]},

{id:"rainy-day",g:"nha",t:"Ngày mưa",en:"A Rainy Day Inside",vi:"Ngày mưa ở trong nhà",sp:["K","M"],
scene:"Trời mưa cả ngày, con thấy chán. Mẹ rủ con dựng lều bằng chăn trong phòng khách.",
tip:"Câu ‘Why don't we...?’ là cách rủ rê rất tự nhiên. Hãy dùng nó thay cho ‘Let's’ để con quen cả hai cách.",
vocab:[["bored","chán"],["blanket","chăn"],["fort","lều, pháo đài"],["cushion","gối tựa"],["over","phủ lên trên"],["popcorn","bỏng ngô"]],
L:[
["K","It's raining again. I'm so bored.","Lại mưa rồi. Con chán quá.","It's + V-ing. / I'm + so + tính từ",[
"`It's raining` dùng hiện tại tiếp diễn vì mưa đang diễn ra.",
"**Vì sao `bored` mà không phải `boring`?** `bored` = cảm thấy chán (cảm xúc của con). `I'm boring` lại có nghĩa ‘con là người nhàm chán’."]],
["M","Why don't we build a blanket fort?","Sao mình không dựng lều bằng chăn nhỉ?","Why don't we + V?",[
"`Why don't we + V?` là lời **rủ rê, đề nghị**, không phải hỏi lý do. Nghĩa giống `Let's build...`",
"`blanket fort` = lều làm từ chăn."]],
["K","Yes! Can we use the sofa cushions?","Hay quá! Mình dùng gối sofa được không ạ?","Can we + V + the + N + N?",[
"`sofa cushions`: danh từ `sofa` đứng trước làm tính từ, nên không thêm `-s`: không nói `sofas cushions`."]],
["M","Sure. Put the blanket over the chairs.","Được chứ. Phủ chăn lên mấy cái ghế đi.","Put + the + N + over + the + N",[
"`over` = phủ lên trên, che kín. Khác `on` = đặt trên bề mặt: `Put the book on the table.`"]],
["K","It's dark inside. We need a flashlight.","Bên trong tối quá. Mình cần đèn pin.","It's + tính từ + inside",[
"`inside` = bên trong, là trạng từ nên không cần giới từ đi kèm."]],
["M","Here. What should we do in our fort?","Đây. Mình làm gì trong lều nhỉ?","What should we + V?",[
"`What should we do?` = mình nên làm gì? `should` hỏi ý kiến, lời khuyên."]],
["K","Let's read stories and eat popcorn!","Mình đọc truyện và ăn bỏng ngô đi!","Let's + V + and + V",[
"Sau `Let's` có thể nối hai động từ bằng `and`.",
"`popcorn` không đếm được: `some popcorn`, không nói `a popcorn`."]],
["M","That sounds like a perfect rainy day.","Nghe như một ngày mưa tuyệt vời đấy.","sound like + N",[
"`sound like` + **danh từ**: `sounds like a perfect day`. `sound` + **tính từ**: `That sounds fun.`"]]
]},

{id:"bugs",g:"nha",t:"Buổi tối",en:"There's a Bug!",vi:"Có côn trùng!",sp:["K","D"],
scene:"Một con bướm đêm bay vào nhà, con hoảng hốt gọi bố. Con còn bị muỗi đốt ở tay.",
tip:"Nhắc con: muốn nói về một loài vật nói chung thì dùng số nhiều, không cần ‘the’: ‘Mosquitoes bite. Moths don't bite.’",
vocab:[["bug","con bọ, côn trùng"],["moth","bướm đêm"],["mosquito","con muỗi"],["bite","cắn; vết cắn"],["itchy","ngứa"],["scratch","gãi"]],
L:[
["K","Dad! There's a big bug on the wall!","Bố ơi! Có con bọ to trên tường!","There's + a + tính từ + N + on + the + N",[
"`bug` (Mỹ) = côn trùng nói chung, giống `insect`.",
"`on the wall`: dùng `on` vì nó bám trên bề mặt tường."]],
["D","Don't be afraid. It's just a moth.","Đừng sợ. Chỉ là con bướm đêm thôi.","Don't be + tính từ",[
"Mệnh lệnh phủ định với tính từ: `Don't be + tính từ`: `Don't be afraid`, `Don't be sad`.",
"`be afraid of` + N = sợ cái gì: `afraid of bugs`."]],
["K","Will it bite me?","Nó có cắn con không ạ?","Will + it + V + me?",[
"`Will + S + V?` hỏi dự đoán chuyện sẽ xảy ra.",
"`bite` (cắn) là động từ bất quy tắc: `bite – bit – bitten`."]],
["D","No, moths don't bite. But mosquitoes do.","Không, bướm đêm không cắn. Muỗi mới cắn.","N số nhiều + don't + V. But + N + do.",[
"Nói về **một loài nói chung** thì dùng danh từ số nhiều, không có `the`: `Moths don't bite.`",
"`mosquitoes do` = `mosquitoes bite`. Dùng `do` để khỏi lặp động từ.",
"`mosquitoes` thêm `-es` vì tận cùng bằng `o`."]],
["K","I have a mosquito bite on my arm. It's itchy.","Con bị muỗi đốt ở tay. Ngứa quá.","I have + a + N + on + my + N",[
"`bite` ở đây là danh từ = vết cắn. `a mosquito bite` = vết muỗi đốt.",
"Tiếng Anh nói ‘con có một vết’ (`I have a bite`), không nói ‘con bị muỗi đốt’ theo kiểu bị động khi nói thân mật."]],
["D","Don't scratch it. I'll put some cream on it.","Đừng gãi. Bố bôi kem cho con.","put + some + N + on + it",[
"`scratch` = gãi.",
"`put cream on` = bôi kem lên. `cream` không đếm được nên dùng `some`."]],
["D","Let's close the window so more mosquitoes can't come in.","Mình đóng cửa sổ lại để muỗi không bay vào nữa.","so + S + can't + V (mục đích)",[
"`so` + mệnh đề = để mà (chỉ mục đích).",
"`come in` = vào trong."]],
["K","And let's help the moth go outside.","Và mình giúp bướm đêm bay ra ngoài nhé.","help + O + V",[
"`help + tân ngữ + V nguyên mẫu`: `help the moth go`.",
"`outside` là trạng từ nên nói `go outside`, không nói `go to outside`."]]
]},

{id:"saying-sorry",g:"nha",t:"Khi con làm vỡ đồ",en:"Saying Sorry",vi:"Biết nói lời xin lỗi",sp:["K","M"],
scene:"Con chơi bóng trong nhà và làm vỡ bình hoa. Con tự đến nói thật với mẹ.",
tip:"Khen con vì đã nói thật trước, rồi mới nhắc lại quy định. Câu ‘Thank you for telling me the truth’ rất đáng để con nghe nhiều lần.",
vocab:[["break","làm vỡ"],["vase","bình hoa"],["broken","bị vỡ"],["hurt","bị đau, bị thương"],["tell the truth","nói thật"],["rule","quy định"]],
L:[
["K","Mom... I have to tell you something.","Mẹ ơi... con phải nói với mẹ một chuyện.","I have to + V + sb + something",[
"`have to` = phải (vì bắt buộc, vì hoàn cảnh).",
"`something` dùng trong câu khẳng định; trong câu hỏi và phủ định thường dùng `anything`."]],
["M","What is it, honey?","Chuyện gì thế con?","What is it?",[
"`What is it?` = có chuyện gì vậy? `it` chỉ chuyện con định nói."]],
["K","I broke your vase. I was playing ball inside.","Con làm vỡ bình hoa của mẹ. Con đang chơi bóng trong nhà.","quá khứ đơn + quá khứ tiếp diễn",[
"`broke` là quá khứ của `break`.",
"`I was playing` (**quá khứ tiếp diễn**) là hành động đang diễn ra làm nền; `I broke` (**quá khứ đơn**) là sự việc xảy ra chen vào."]],
["M","Are you hurt? Don't touch the broken glass.","Con có bị đau không? Đừng chạm vào mảnh vỡ.","Are you + tính từ? / the + broken + N",[
"`hurt` ở đây là tính từ = bị thương.",
"`broken` (quá khứ phân từ của `break`) dùng như tính từ: `broken glass` = thủy tinh vỡ."]],
["K","No, I'm okay. I'm really sorry.","Con không sao ạ. Con thật sự xin lỗi mẹ.","I'm + really + sorry",[
"`really` nhấn mạnh: `really sorry`, `so sorry`.",
"`I'm sorry` = xin lỗi vì đã làm sai. `Excuse me` = xin lỗi khi làm phiền hoặc muốn hỏi."]],
["M","Thank you for telling me the truth.","Cảm ơn con đã nói thật với mẹ.","Thank you for + V-ing",[
"Sau giới từ `for` động từ phải ở dạng V-ing: `for telling`.",
"**Vì sao `tell the truth` mà không phải `say the truth`?** Đây là cụm cố định: `tell the truth`, `tell a lie`, `tell a story`."]],
["M","But what's the rule about balls?","Nhưng quy định về bóng là gì nào?","what's + the + N + about + N?",[
"`the rule about...` = quy định về...",
"`about` = về (chủ đề)."]],
["K","No playing ball in the house. I won't do it again.","Không chơi bóng trong nhà. Con sẽ không làm thế nữa.","No + V-ing / I won't + V + again",[
"`No + V-ing` = cấm làm gì, giống trên biển báo: `No smoking`, `No running`.",
"`won't` (= will not) dùng để **hứa**: `I won't do it again.`"]]
]},

{id:"old-photos",g:"nha",t:"Chiều CN",en:"Old Family Photos",vi:"Xem ảnh gia đình ngày xưa",sp:["G","K"],
scene:"Bà mở album ảnh cũ và kể cho cháu nghe về bố hồi bé và về ông cụ.",
tip:"Album ảnh là dịp tốt để học từ chỉ người thân (great-grandfather, uncle, aunt, cousin) và thì quá khứ.",
vocab:[["photo album","album ảnh"],["cute","dễ thương"],["great-grandfather","cụ ông"],["back then","hồi đó"],["village","làng"],["river","con sông"]],
L:[
["G","Come and look at this old photo album.","Lại đây xem cuốn album ảnh cũ này.","Come and + V",[
"`Come and + V` là cách nói thân mật, nghĩa giống `Come to look`.",
"`look at` + vật được nhìn."]],
["K","Who is this baby?","Em bé này là ai ạ?","Who is + this + N?",[
"`this` + danh từ số ít, chỉ thứ ở gần (trong ảnh trước mặt)."]],
["G","That's your dad when he was two years old.","Đó là bố cháu lúc hai tuổi đấy.","That's + N + when + S + was + tuổi",[
"`when he was...` là mệnh đề thời gian ở quá khứ.",
"`two years old`: `years` có `-s`. Nhưng khi làm tính từ ghép thì không có `-s`: `a two-year-old boy`."]],
["K","No way! He looks so cute!","Không thể nào! Trông bố dễ thương quá!","No way! / look + so + tính từ",[
"`No way!` = không thể nào (rất ngạc nhiên).",
"`look + tính từ` = trông có vẻ."]],
["K","And who is the man next to him?","Thế còn người đàn ông bên cạnh là ai ạ?","who is + the + N + next to + him?",[
"`next to him`: sau giới từ dùng đại từ tân ngữ (`him`), không dùng `he`."]],
["G","That's your great-grandfather, my father.","Đó là cụ ông của cháu, bố của bà.","That's + N, + N (đồng vị ngữ)",[
"`great-grandfather` = cụ ông; `great-grandmother` = cụ bà.",
"`my father` đứng sau dấu phẩy để giải thích thêm cho danh từ trước (đồng vị ngữ)."]],
["K","Did you live in this house back then?","Hồi đó bà có sống ở nhà này không ạ?","Did + S + V + back then?",[
"Câu hỏi quá khứ: `Did + S + V nguyên mẫu`. Sau `did` không dùng `lived`.",
"`back then` = hồi đó, thời ấy."]],
["G","No, we lived in a small village near the river.","Không, hồi đó nhà bà ở một ngôi làng nhỏ gần sông.","S + V-ed + in + a + tính từ + N + near + the + N",[
"Khẳng định quá khứ: `lived` (+ed).",
"`near the river` = gần sông. `near` không cần `to`; nhưng `close to the river` thì cần."]]
]},

{id:"fixing",g:"nha",t:"Ngày nghỉ",en:"Fixing a Toy",vi:"Sửa đồ chơi",sp:["K","D"],
scene:"Xe đồ chơi của con không chạy nữa. Bố và con cùng mở ra thay pin.",
tip:"Khi sửa đồ, cho con làm ‘trợ lý’ đưa dụng cụ. Mỗi lần nói ‘Pass me the...’ là con học thêm tên một dụng cụ.",
vocab:[["not anymore","không còn nữa"],["have a look","xem thử"],["battery","cục pin"],["dead","hết (pin)"],["screwdriver","tua vít"],["fix","sửa"]],
L:[
["K","Dad, my car doesn't work anymore.","Bố ơi, xe của con không chạy nữa.","S + doesn't + V + anymore",[
"`not ... anymore` = không còn nữa (trước thì có).",
"`work` với đồ vật = hoạt động, chạy."]],
["D","Let me have a look.","Để bố xem nào.","Let me + V",[
"`Let me + V nguyên mẫu` = để tôi làm.",
"`have a look` = xem thử, nhìn qua một chút."]],
["D","I think the batteries are dead.","Bố nghĩ là hết pin rồi.","I think + S + V",[
"`dead` với pin = hết pin. Với điện thoại: `My phone is dead.`",
"`batteries` (y → ies)."]],
["K","Can we change them?","Mình thay pin được không ạ?","Can we + V + them?",[
"`change the batteries` = thay pin. `them` thay cho `the batteries`."]],
["D","Sure. Pass me the screwdriver, please.","Được. Đưa bố cái tua vít nhé.","pass + sb + sth",[
"`pass + người + vật` (hai tân ngữ): `pass me the screwdriver`. Có thể đổi thành `pass the screwdriver to me`.",
"`screwdriver` = tua vít (`screw` = con vít, `driver` = cái vặn)."]],
["K","Is this the right one?","Có phải cái này không ạ?","Is this + the right one?",[
"`one` thay cho danh từ đã nhắc (`screwdriver`) để khỏi lặp lại.",
"`the right one` = đúng cái cần dùng."]],
["D","Yes, that's it. Now turn it on.","Đúng rồi. Giờ bật lên thử xem.","That's it. / turn it on",[
